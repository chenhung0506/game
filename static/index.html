<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Battle Prototype</title>
<style>
  body { margin: 0; background: #14161c; color: #e8e8ea; font: 14px system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; }
  canvas { background: #2b3a2f; max-width: 100%; max-height: calc(100vh - 120px); margin-top: 12px; border: 2px solid #3d4a40; }
  #bar { padding: 10px 16px; text-align: center; line-height: 1.6; }
  code { background: #262a33; padding: 2px 6px; border-radius: 4px; word-break: break-all; }
  #bar:empty { display: none; }
  /* Portrait (the default, for phones): the canvas fills the screen and the pad is drawn over it. */
  html { touch-action: none; overscroll-behavior: none; }
  body.portrait { height: 100dvh; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  body.portrait canvas { margin: 0; border: 0; max-width: 100vw; max-height: 100dvh; }
  body.portrait #bar { position: fixed; top: 0; left: 0; right: 0; z-index: 2; background: #000b; padding: 6px 12px; font-size: 12px; }
  body.portrait #bar2 { display: none; }
  #unzoom { position: fixed; left: 0; top: 0; transform-origin: 0 0; z-index: 9; display: none; margin: 12px; padding: 10px 14px; border-radius: 8px; border: 2px solid #fff; background: #000c; color: #fff; font: bold 14px system-ui; }
  .stick, .btn { position: fixed; z-index: 3; border-radius: 50%; touch-action: none; user-select: none; -webkit-user-select: none; }
  .stick { left: 18px; bottom: 28px; width: 140px; height: 140px; background: #ffffff22; border: 2px solid #ffffff44; }
  .knob { position: absolute; left: 38px; top: 38px; width: 60px; height: 60px; border-radius: 50%; background: #ffffff88; pointer-events: none; }
  .btn { display: flex; align-items: center; justify-content: center; background: #ffffff2a; border: 2px solid #ffffff66; color: #fff; font-weight: bold; }
  .btn.on { background: #ffffff77; }
  /* cooldown: a dark pie over the button, the part still to wait, shrinking clockwise from the top */
  /* character choice: shown from connecting until the match starts */
  #pick { position: fixed; inset: 0; z-index: 4; background: #14161c; display: none; flex-direction: column; align-items: center; padding: 56px 12px 12px; box-sizing: border-box; overflow-y: auto; touch-action: pan-y; }
  #pick h2 { margin: 6px 0 12px; font-size: 20px; }
  #cards { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .card { width: 148px; border: 2px solid #3d4a40; border-radius: 12px; padding: 8px; background: #1b1f27; text-align: center; cursor: pointer; user-select: none; -webkit-user-select: none; }
  .card canvas { margin: 0; border: 0; width: 120px; height: 100px; border-radius: 8px; background: #2b3a2f; }
  .card b { display: block; margin-top: 6px; font-size: 16px; }
  .card small { display: block; margin-top: 4px; opacity: .75; line-height: 1.5; text-align: left; font-size: 12px; }
  .card.mine { border-color: #6fd36f; background: #243026; }
  #easebox { margin: 0 0 12px; text-align: center; line-height: 1.6; }
  #easebox input { width: 220px; vertical-align: middle; }
  #easemsg { font-size: 12px; opacity: .75; }
  #modes, #teambar { display: flex; gap: 10px; margin: 0 0 12px; }
  #teambar { margin: 12px 0 0; }
  #pick button, #repick { font: bold 15px system-ui; padding: 9px 16px; border-radius: 10px; border: 2px solid #3d4a40; background: #1b1f27; color: #eee; cursor: pointer; }
  #pick button.on { border-color: #6fd36f; background: #243026; }
  #pick button:disabled { opacity: .4; cursor: default; }
  #repick { position: fixed; left: 50%; top: 56%; transform: translateX(-50%); z-index: 3; display: none; font-size: 18px; padding: 12px 26px; background: #243026; border-color: #6fd36f; }
  .card { position: relative; }
  .card .ord { position: absolute; top: 4px; left: 4px; min-width: 24px; height: 24px; line-height: 24px; border-radius: 12px; background: #6fd36f; color: #111; font: bold 15px/24px system-ui; font-style: normal; display: none; }
  #pickmsg { margin-top: 14px; text-align: center; line-height: 1.7; }
  .uses { position: absolute; top: -4px; right: -4px; min-width: 28px; padding: 2px 5px; border-radius: 14px; background: #f7cf3a; color: #222; font-size: 14px; text-align: center; pointer-events: none; }
  .uses.out { background: #888; color: #eee; }
  .cd { position: absolute; inset: 0; border-radius: 50%; pointer-events: none; background: conic-gradient(#000000b0 var(--cd, 0deg), transparent 0); }
</style>
</head>
<body>
<div id="bar"></div>
<div id="pick"><h2>選擇你的寶可夢</h2><div id="easebox"><label>放水 <b id="easeval">0%</b>　<input id="ease" type="range" min="0" max="90" step="10" value="0"></label><div id="easemsg"></div></div><div id="modes"><button id="mSingle">單場對戰</button><button id="mTeam">死鬥（4 隻依序上場）</button></div><div id="cards"></div><div id="teambar"><button id="tClear">清除順序</button><button id="tOk">確認出場順序</button></div><div id="pickmsg"></div></div>
<button id="repick">重選角色</button>
<canvas id="c" width="2000" height="1000"></canvas>
<div id="bar2" style="padding:8px 16px;opacity:.7"></div>
<script>
// Portrait is the default (phones): the two players are one above the other and you are always at the
// bottom, so the arena is turned a quarter turn, a different way for each player. Add ?landscape to the
// address for the wide view, with the players left and right.
const PORTRAIT = !new URLSearchParams(location.search).has('landscape');
document.body.classList.toggle('portrait', PORTRAIT);
const QUAKE_LIFE = 0.75; // seconds the earthquake effect stays on screen (also on a landing)
let ROT = 0;               // how far the arena is turned on screen (radians); 0 in landscape
let VIEW = [1, 0, 0, 1, 0, 0]; // world -> canvas matrix for ctx.transform
// Each player picks a character in the lobby; a snapshot's p[i].k says who is who (0 Pikachu, 1 Snorlax, 2 Charizard, 3 Chikorita).
// Everything below that belongs to one character looks that player up with slotOf, instead of assuming a slot.
const NAMES = ['皮卡丘', '卡比獸', '噴火龍', '菊草葉'];
const BLURB = ['伏特攻擊・打雷・電球', '跳躍落地震・破壞死光・急凍拳', '飛行・噴火・地球上投', '葉刃連斬・飛葉快刀・藤鞭'];
const HELP = [
  '你是皮卡丘　移動 WASD / 方向鍵　空白鍵＝伏特攻擊（全身纏繞閃電朝按住的方向衝刺，可連續使用數次，撞到敵人會使其麻痺無法移動；比地球上投和急凍拳輕，對撞時會輸）　K＝電球（續能後自動朝敵人所在方向丟出，碰到敵人、牆或被打爆時爆炸）　L＝打雷（朝天空放電並在敵人頭上落雷，施放期間無法移動，陰影會追著敵人）',
  '你是卡比獸　移動 WASD / 方向鍵　空白鍵＝跳躍（落地壓人，附地震特效）　J＝急凍拳（蓄力時按方向鍵決定方向，朝該方向衝拳，打到的敵人被冰凍）　K＝破壞死光（朝敵人所在方向扇形掃射，蓄力與掃射時定身，之後硬直）',
  '你是噴火龍　移動 WASD / 方向鍵　空白鍵＝飛行（一段時間在半空，移動更快，但仍會被電球和急凍拳打到）　K＝噴火（自動朝敵人噴出一串小火球，可以邊走邊噴）　J＝地球上投（全身著火朝按住的方向衝刺，撞到敵人就抓上天再摔下）',
  '你是菊草葉　移動 WASD / 方向鍵　空白鍵＝葉刃連斬（朝按住的方向跳一大步，落地不傷人，接著甩動頭上的葉子連斬數下，每一下都朝敵人前進，葉子掃到的人會受傷）　K＝飛葉快刀（在身邊灑出一堆樹葉，各自等一下後朝敵人射出）　J＝藤鞭（朝搖桿方向左右各揮出一條藤鞭在前方會合，被打中的敵人一段時間不能走路也不能用位移技能）',
];
const ghosts = []; // dash afterimages
const beamLook = [{ ang: null, tail: null }, { ang: null, tail: null }]; // per slot: the smoothed beam angle, and the fading afterimage when a sweep ends
const TAIL = 0.2; // seconds
let beamCfg = { len: 450, w: 50, charge: 0.6, angle: 30 }; // replaced by the server's values in 'hi'
let thunderCfg = { radius: 60, delay: 1, interval: 0.5, strikes: 3 }; // likewise
// Body sizes from 'hi' (world units). The art below was drawn at REF, so it is scaled by radius / REF;
// that is also the size the server hits with, and it does not depend on the court's size.
let radius = [16, 24, 26, 18]; // indexed by character
const REF = [16, 24, 26, 18];
let maxHp = [100, 100, 120, 110]; // each character's full HP, from 'hi'
let ballCfg = { radius: 14, hp: 30, charge: 0.5 }; // Electro Ball, from 'hi'
let punchCfg = { charge: 0.4, radius: 40, freeze: 1.5, distance: 250 }; // Ice Punch, from 'hi'
const iceTrail = []; // fading ice puffs the dash leaves behind
let leafCfg = { radius: 90, scale: 2.5 }, razorCfg = { radius: 10, scale: 1, hp: 5 }, vineCfg = { len: 160, w: 24, angle: 70, duration: 0.35, charge: 0.4, recharge: 0.5 }; // Chikorita's Leaf Slash reach, from 'hi'
let voltCfg = { radius: 16, uses: 3, window: 2 }; // Volt Tackle, from 'hi'
let fireCfg = { radius: 10, hp: 10 }, tossCfg = { radius: 45, high: 180 }, flyCfg = { height: 90 }; // Charizard's, from 'hi'
let cdCfg = { dash: 0, thunder: 0, jump: 0, beam: 0, ball: 0, punch: 0, fly: 0, fire: 0, toss: 0 }; // full cooldowns, from 'hi'
const cdBtns = []; // { span, field, total }: the pad's cooldown overlays
let usesBadge = null; // Pikachu's main button: how many Volt Tackles are left
const shadow = [{ x: null, y: null }, { x: null, y: null }]; // per slot: the smoothed thunder shadow position
const smoke = []; // puffs rising off Snorlax while it recharges
const flames = []; // fading flames Charizard leaves while it runs with a catch
let smokeAcc = 0;

const query = new URLSearchParams(location.search);
let room = query.get('room');
if (!room) { room = Math.random().toString(36).slice(2, 8); query.set('room', room); location.replace('?' + query); }

const bar = document.getElementById('bar');
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let arena = { w: 2000, h: 1000 }; // replaced by the server's values in 'hi'
if (PORTRAIT) { cv.width = arena.h; cv.height = arena.w; }
let you = -1, snap = null, waiting = true, status = '連線中…';
// Which way each character faces on screen and how it is running (see art); set from how its display position moves.
const look = [{ dir: null, vx: 0, vy: 0, mv: 0, ph: 0, ls: 1, la: 0 }, { dir: null, vx: 0, vy: 0, mv: 0, ph: 0, ls: 1, la: 0 }]; // ls, la: the size and angle of Chikorita's leaf
const disp = [{ x: null, y: 0, z: 0 }, { x: null, y: 0, z: 0 }]; // smoothed positions; set from the first snapshot
let fx = [], shake = 0;

const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws?room=' + room + '&mode=' + (PORTRAIT ? 'mobile' : 'web')); // the first player's view picks the court
let picks = [-1, -1], here = [true, false], padKind = -1;
let ease = [0, 0]; // each slot's handicap in percent, from the lobby
let teamMode = false, myOrder = [], sentOrder = ''; // the lobby's match type; the order I field my characters in, and the one the server has
const slotsOf = (k) => (snap ? [0, 1].filter((i) => snap.p[i].k === k) : []); // the slots playing that character (both may play the same one)
ws.onmessage = (e) => {
  const m = JSON.parse(e.data);
  if (m.t === 'hi') { you = m.you; beamCfg = m.beam; thunderCfg = m.thunder; cdCfg = m.cooldown; ballCfg = m.ball; punchCfg = m.punch; fireCfg = m.fire; tossCfg = m.toss; flyCfg = m.fly; voltCfg = m.volt; leafCfg = m.leaf; razorCfg = m.razor; vineCfg = m.vine; maxHp = m.maxhp; radius = m.radius; arena = m.arena; setView(); buildCards(); }
  else if (m.t === 'lobby') {
    if (m.picks[0] >= 0 && m.picks[1] >= 0 && m.here[0] && m.here[1]) return; // a match is on: a refused pick changes nothing
    if (teamMode !== !!m.team) { teamMode = !!m.team; myOrder = []; sentOrder = ''; } // another match type: choose again
    if (sentOrder && m.picks[you] < 0) { myOrder = []; sentOrder = ''; } // sent back to choose again
    ease = m.ease || [0, 0];
    picks = m.picks; here = m.here; waiting = !(here[0] && here[1]); snap = null; padKind = -1;
    document.querySelectorAll('.stick, .btn').forEach((el) => el.remove());
    showPick();
  }
  else if (m.t === 'full') { status = '房間已滿（最多 2 人）'; waiting = false; }
  else if (m.t === 's') {
    if (!snap) { ghosts.length = iceTrail.length = voltTrail.length = smoke.length = flames.length = 0; fx = []; for (const b of beamLook) b.ang = b.tail = null; for (const sh of shadow) sh.x = null; for (const d of disp) d.x = null; for (const l of look) l.dir = null; } // a new match starts clean
    const old = snap;
    waiting = false; snap = m;
    document.getElementById('pick').style.display = 'none';
    if (padKind !== m.p[you].k) { padKind = m.p[you].k; document.getElementById('bar2').textContent = HELP[padKind]; if (PORTRAIT) buildPad(); }
    for (const i of slotsOf(1)) {
      const st = m.p[i].st, prevSt = old ? old.p[i].st : 0;
      if (st > 0 && !(prevSt > 0)) shake = 14; // the sweep begins
      if (!(st > 0) && prevSt > 0 && beamLook[i].ang !== null) beamLook[i].tail = { x: disp[i].x, y: disp[i].y - 6, ang: beamLook[i].ang, age: 0 };
    }
    for (const ev of m.e || []) {
      fx.push({ ...ev, age: 0 });
      if (ev.t === 'slam') shake = 16;
      if (ev.t === 'thunder') shake = 10;
      if (ev.t === 'explode') shake = 14;
      if (ev.t === 'leaf') shake = 6;
      if (ev.t === 'freeze') shake = 10;
      if (ev.t === 'paralyze') shake = 8;
    }
  }
};
ws.onclose = () => { status = '連線中斷，重新整理頁面再試'; waiting = false; snap = null; document.getElementById('pick').style.display = 'none'; };

// The view: the world is drawn through VIEW, so everything that is not upright art (rings, beams, the
// strike areas) just follows. Pikachu starts on the left, so its view turns the arena a quarter turn
// counter-clockwise (the opponent ends up above it); Snorlax's turns clockwise.
function setView() {
  const W = arena.w, H = arena.h;
  tele.width = W; tele.height = H; // the warning fan is drawn in world space
  if (!PORTRAIT) { ROT = 0; VIEW = [1, 0, 0, 1, 0, 0]; cv.width = W; cv.height = H; return; }
  cv.width = H; cv.height = W;
  if (you === 0) { ROT = -Math.PI / 2; VIEW = [0, -1, 1, 0, 0, W]; } // x' = y,     y' = W - x
  else { ROT = Math.PI / 2; VIEW = [0, 1, -1, 0, H, 0]; }            // x' = H - y, y' = x
}
const screenY = (x, y) => VIEW[1] * x + VIEW[3] * y + VIEW[5]; // where a world point lands on the canvas
// A world vector as it appears on screen (for offsets drawn inside an upright frame).
const rv = (x, y) => [x * Math.cos(ROT) - y * Math.sin(ROT), x * Math.sin(ROT) + y * Math.cos(ROT)];
// Draw upright art at a world point: the origin is that point and the axes are the screen's.
function upright(x, y, fn) { ctx.save(); ctx.translate(x, y); ctx.rotate(-ROT); fn(); ctx.restore(); }

// ---- the character choice ----
const cardEls = [];
function buildCards() {
  const box = document.getElementById('cards');
  box.textContent = '';
  cardEls.length = 0;
  NAMES.forEach((name, k) => {
    const el = document.createElement('div'); el.className = 'card';
    const cvs = document.createElement('canvas'); cvs.width = 240; cvs.height = 200; // drawn at 2x
    const b = document.createElement('b'); b.textContent = name;
    const sm = document.createElement('small'); sm.textContent = `HP ${maxHp[k]}　${BLURB[k]}`;
    el.append(cvs, b, sm); box.append(el);
    const ord = document.createElement('i'); ord.className = 'ord'; el.append(ord);
    el.addEventListener('click', () => {
      if (teamMode) { // click to line the characters up, click a numbered one to take it out
        const n = myOrder.indexOf(k);
        if (n >= 0) myOrder.splice(n, 1); else if (myOrder.length < NAMES.length) myOrder.push(k);
        showPick();
      } else if (ws.readyState === 1) ws.send(JSON.stringify({ pick: k }));
    });
    cardEls.push({ el, cvs, ord });
  });
}
function showPick() {
  document.getElementById('pick').style.display = 'flex';
  cardEls.forEach(({ el, ord }, k) => {
    const n = myOrder.indexOf(k);
    el.classList.toggle('mine', teamMode ? n >= 0 : picks[you] === k);
    ord.style.display = teamMode && n >= 0 ? 'block' : 'none';
    ord.textContent = n + 1;
  });
  if (document.activeElement !== easeEl) { easeEl.value = ease[you]; document.getElementById('easeval').textContent = ease[you] + '%'; }
  document.getElementById('easemsg').textContent = `你的血量和移動速度減少 ${ease[you]}%` + (ease[1 - you] ? `　對手放水 ${ease[1 - you]}%` : '') + '（開打前設定）';
  document.getElementById('mSingle').classList.toggle('on', !teamMode);
  document.getElementById('mTeam').classList.toggle('on', teamMode);
  document.getElementById('teambar').style.display = teamMode ? 'flex' : 'none';
  document.getElementById('tOk').disabled = myOrder.length !== NAMES.length || myOrder.join() === sentOrder;
  document.getElementById('tClear').disabled = !myOrder.length;
  const link = location.origin + location.pathname + '?room=' + room;
  const mine = picks[you], theirs = picks[1 - you];
  const lines = [];
  if (teamMode) {
    if (!here[1 - you]) lines.push(`等待對手加入… 把這個連結傳給對方：<br><code>${link}</code>`);
    if (sentOrder) lines.push(`你的出場順序：${sentOrder.split(',').map((k) => NAMES[k]).join(' → ')}${picks[1 - you] >= 0 ? '' : '（等對手排好順序…）'}`);
    else lines.push(`依序點選 ${NAMES.length} 隻，決定出場順序（點已排的可以取消）；${here[1 - you] && picks[1 - you] >= 0 ? '對手已經排好了' : '雙方都確認後開打'}`);
    lines.push('一隻被打倒就換下一隻上場，活著的角色保留剩下的血量，一方四隻都倒下就輸了');
    document.getElementById('pickmsg').innerHTML = lines.join('<br>');
    return;
  }
  if (!here[1 - you]) lines.push(`等待對手加入… 把這個連結傳給對方：<br><code>${link}</code><br>（電腦橫式版：在自己的網址後面加上 &landscape）`);
  else if (mine < 0 && theirs >= 0) lines.push(`對手選了${NAMES[theirs]}，換你選（可以選一樣的）`);
  else if (mine >= 0 && theirs < 0) lines.push('對手選擇中…');
  if (mine >= 0) lines.push(`你選了${NAMES[mine]}（對手還沒選好以前，可以重選；兩人可以選同一隻）`);
  else if (here[1 - you] && theirs < 0) lines.push('點一隻寶可夢開始');
  document.getElementById('pickmsg').innerHTML = lines.join('<br>');
}
const send = (o) => { if (ws.readyState === 1) ws.send(JSON.stringify(o)); };
const easeEl = document.getElementById('ease');
easeEl.oninput = () => { document.getElementById('easeval').textContent = easeEl.value + '%'; };
easeEl.onchange = () => send({ ease: +easeEl.value });
document.getElementById('mSingle').onclick = () => send({ team: false });
document.getElementById('mTeam').onclick = () => send({ team: true });
document.getElementById('tClear').onclick = () => { myOrder = []; showPick(); };
document.getElementById('tOk').onclick = () => { send({ order: myOrder }); sentOrder = myOrder.join(); showPick(); };
document.getElementById('repick').onclick = () => send({ repick: true });
// The cards show the real art, moving: the same drawing the arena uses.
function drawCards() {
  if (document.getElementById('pick').style.display !== 'flex') return;
  const t = performance.now() / 1000;
  cardEls.forEach(({ cvs }, k) => {
    const c = cvs.getContext('2d');
    c.clearRect(0, 0, cvs.width, cvs.height);
    c.save(); c.translate(cvs.width / 2, cvs.height / 2 + (k === 2 ? 22 : 6)); c.scale(k === 2 ? 1.6 : 2.4, k === 2 ? 1.6 : 2.4); // the big wings need room
    art(c, k, 0, 0, t, k === 2 && Math.sin(t * 0.8) > 0.2 ? 1 : 0); // Charizard now and then beats its wings hard
    c.restore();
  });
}

// ---- input: send only when the held-key state changes ----
// Directions are read on screen (up is up) and turned back into world directions for the server.
const keys = new Set();
const touch = { skill: false, thunder: false, beam: false, ball: false, punch: false, fire: false, toss: false, razor: false, vine: false }; // the pad's buttons
let stick = { x: 0, y: 0 }; // the pad's stick, each -1 / 0 / 1 on screen
let stickAim = { x: 0, y: 0 }; // the stick's exact direction on screen, a unit vector (0, 0 = not pushed)
let last = '';
function sendInput() {
  const k = (n) => keys.has(n);
  let sx = (k('d') || k('arrowright') ? 1 : 0) - (k('a') || k('arrowleft') ? 1 : 0);
  let sy = (k('s') || k('arrowdown') ? 1 : 0) - (k('w') || k('arrowup') ? 1 : 0);
  if (stick.x || stick.y) { sx = stick.x; sy = stick.y; }
  const c = Math.cos(ROT), s = Math.sin(ROT);
  const msg = JSON.stringify({
    dx: Math.round(sx * c + sy * s) || 0,
    dy: Math.round(-sx * s + sy * c) || 0,
    // the aim of the Electro Ball and the Ice Punch: the stick's exact direction (2 decimals is 0.6 degrees)
    ax: Math.round((stickAim.x * c + stickAim.y * s) * 100) / 100 || 0,
    ay: Math.round((-stickAim.x * s + stickAim.y * c) * 100) / 100 || 0,

// Volt Tackle: while it dashes Pikachu is wrapped in a flickering glow with lightning crackling round it; during

    ctx.fillStyle = `rgba(255,255,200,${0.5 * (1 - k)})`; ctx.beginPath(); ctx.arc(t.x, t.y, t.R * 0.5 * (1 - k), 0, 7); ctx.fill();
  }

  for (const i of slotsOf(0)) {
    const p = snap.p[i], d = disp[i], bs = radius[0] / REF[0];
    upright(d.x, d.y, () => {
      const cy = -d.z - 4 * bs;

        ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.shadowColor = 'rgba(255,230,60,1)'; ctx.shadowBlur = 14;

          const a = Math.random() * 6.283, r0 = R * (0.4 + Math.random() * 0.4), r1 = R * (1.5 + Math.random() * 1.1);
          const x0 = Math.cos(a) * r0, y0 = cy + Math.sin(a) * r0, x1 = Math.cos(a) * r1, y1 = cy + Math.sin(a) * r1;
          const bx = x0 + (x1 - x0) * 0.55, by = y0 + (y1 - y0) * 0.55, ba = a + (Math.random() - 0.5) * 1.6;
          for (const [col, w] of [['rgba(120,170,255,0.55)', 6], ['rgba(255,225,50,0.95)', 3.4], ['rgba(255,255,255,1)', 1.4]]) {

// Paralyzed by a Volt Tackle: sparks crackle round the body, and a label, while it cannot walk or use a movement skill.

// Thunder: a dark circle the size of the strike area sits where the bolt will land.
// It darkens and a ring closes in on it as the bolt gets near.
function drawShadow() {
  for (const i of [0, 1]) drawThunderShadow(snap.p[i], shadow[i]);
}
function drawThunderShadow(p, shadow) {
  if (p.k !== 0 || !(p.tn > 0)) { shadow.x = null; return; }
  if (shadow.x === null) { shadow.x = p.sx; shadow.y = p.sy; }
  shadow.x += (p.sx - shadow.x) * 0.4; shadow.y += (p.sy - shadow.y) * 0.4;
  const period = p.tn === thunderCfg.strikes ? thunderCfg.delay : thunderCfg.interval; // time the current wait started from

  ctx.beginPath(); ctx.arc(shadow.x, shadow.y, thunderCfg.radius, 0, 7); ctx.fill();
  ctx.strokeStyle = `rgba(255,235,90,${0.4 + 0.6 * k})`; ctx.lineWidth = 3;

  ctx.restore();
}

// The ground-shock effect, used for Snorlax's landing and Charizard's slam. It shows the real reach (f.r, sent by the
// server) in a bright disc the moment it goes off, then a pair of shockwaves, cracks in the ground and flying dust. All circles are true
// circles because the hit test is a distance in the ground plane.

  const R = f.r, k = f.age / QUAKE_LIFE, a = 1 - k;

  disc.addColorStop(0, `rgba(255,170,40,${0.2 * a})`);

  ctx.fillStyle = disc; ctx.beginPath(); ctx.arc(f.x, f.y, R, 0, 7); ctx.fill();
  ctx.strokeStyle = `rgba(255,225,100,${a})`; ctx.lineWidth = 7; ctx.stroke();

  ctx.strokeStyle = `rgba(45,25,10,${0.9 * a})`; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    ctx.lineTo(f.x + dx * len * 0.7 - dy * j2, f.y + dy * len * 0.7 + dx * j2);

  for (let i = 0; i < 18; i++) {

// A jagged bolt from the top of the screen to the strike point, plus a flash on the ground.
// Drawn upright so it comes from the top of the screen in any view; sy is how far down the point is.
function drawBolt(f) {

// Pikachu fires a bolt straight up into the sky for each strike: a jagged line from its position
// off the top of the screen, with a spark where it leaves.

  upright(f.x, f.y, () => {

// Chikorita's leaf: while a swing runs, a bright crescent cuts across the body. Swing 0, 2, ... go from the upper
// left to the lower right, swing 1, 3, ... from the upper right to the lower left. The blade reaches `radius`
// from the body on each side, which is the reach the server hits with.
function drawLeafSlashes() { for (const si of slotsOf(3)) drawLeafSlash(snap.p[si], disp[si]); }
function drawLeafSlash(p, d) {
  if (p.lp !== 2) return;
  const R = leafCfg.radius, k = p.lk, sgn = p.ln % 2 === 0 ? 1 : -1, bs = radius[3] / REF[3];
  const P0 = [-sgn * 0.707 * R, -0.707 * R], P1 = [sgn * 0.707 * R, 0.707 * R];
  const dx = P1[0] - P0[0], dy = P1[1] - P0[1], len = Math.hypot(dx, dy), nx = -dy / len, ny = dx / len;
  const pos = (v) => [P0[0] + dx * v + nx * 0.22 * R * Math.sin(Math.PI * v), P0[1] + dy * v + ny * 0.22 * R * Math.sin(Math.PI * v)];
  const v0 = Math.max(0, k - 0.75), n = 16, W = 10 + 0.14 * R, alpha = 0.55 * (k > 0.88 ? (1 - k) / 0.12 : 1); // only an afterimage now: the leaf itself is the blade
  upright(d.x, d.y, () => {

    const A = [], B = [];
    for (let i = 0; i <= n; i++) {

    ctx.fillStyle = gr; ctx.beginPath();

    B.reverse().forEach(([x, y]) => ctx.lineTo(x, y)); ctx.closePath(); ctx.fill();

// Razor Leaf: a sharp leaf pointing the way it flies. While it hangs around Chikorita it turns slowly and bobs; a bar
// shows its HP once the opponent's skills have worn it down.
function drawRazorLeaf(b) {
  const r = razorCfg.radius * razorCfg.scale, t = performance.now() / 1000, ang = b.w ? t * 2 + b.x * 0.05 : Math.atan2(b.dy || 0, b.dx || 0);

// Vine Whip: two vines swing in from either side of the aim and meet on it. A vine lags behind its own swing,
// so it bends away from the aim until the two come together.
function drawVines() { for (const si of slotsOf(3)) drawVine(snap.p[si], disp[si]); }
function drawVine(p, d) {
  const charging = p.vc > 0, swinging = p.vt > 0, pulling = p.vr > 0;
  if (!charging && !swinging && !pulling) return;
  const [ax, ay] = rv(p.vx, p.vy), base = Math.atan2(ay, ax), L = vineCfg.len, bs = radius[3] / REF[3];
  // charging: the vines unfurl towards where they will start from, with a fan on the ground showing what they are about to sweep;
  // swinging: in from either side; pulling back: they shrink away along the aim
  const ck = charging ? 1 - p.vc / Math.max(vineCfg.charge, 1e-6) : 1, ease = 1 - (1 - ck) * (1 - ck);
  const deg = charging ? vineCfg.angle : swinging ? p.va : 0;
  const len = charging ? L * ease : pulling && !swinging ? L * Math.min(p.vr / Math.max(vineCfg.recharge, 1e-6), 1) : L;
  const alpha = charging ? 0.45 + 0.55 * ck : 1, t = performance.now() / 1000;
  upright(d.x, d.y, () => {
    ctx.translate(0, -d.z - 8 * bs);
    if (charging) { // the warning fan
      const A = vineCfg.angle * Math.PI / 180;
      ctx.fillStyle = `rgba(60,170,60,${0.07 + 0.12 * ck})`; ctx.strokeStyle = `rgba(90,210,90,${0.25 + 0.35 * ck})`; ctx.lineWidth = 2; ctx.setLineDash([8, 6]);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, L, base - A, base + A); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.setLineDash([]);
    }
    ctx.globalAlpha = alpha;
    for (const side of [-1, 1]) {
      const shake = charging ? Math.sin(t * 40 + side) * 0.05 * (1 - ck) : 0; // trembling as they uncoil
      const a = base + side * deg * Math.PI / 180 + shake, ux = Math.cos(a), uy = Math.sin(a);
      const bend = side * 0.2 * len * (deg / vineCfg.angle), nx = -uy, ny = ux; // outward, away from the aim
      const cx = ux * len * 0.5 + nx * bend, cy = uy * len * 0.5 + ny * bend, ex = ux * len, ey = uy * len;
      const pts = [], n = 14;
      for (let i = 0; i <= n; i++) {
        const u = i / n, x = 2 * (1 - u) * u * cx + u * u * ex, y = 2 * (1 - u) * u * cy + u * u * ey;
        const tx = 2 * (1 - u) * cx + 2 * u * (ex - cx), ty = 2 * (1 - u) * cy + 2 * u * (ey - cy), tl = Math.hypot(tx, ty) || 1;
        pts.push([x, y, -ty / tl, tx / tl, vineCfg.w * 0.26]); // the same width from root to tip
      }
      ctx.beginPath();
      pts.forEach(([x, y, px, py, w], i) => (i ? ctx.lineTo(x + px * w, y + py * w) : ctx.moveTo(x + px * w, y + py * w)));
      for (let i = n; i >= 0; i--) { const [x, y, px, py, w] = pts[i]; ctx.lineTo(x - px * w, y - py * w); }
      ctx.closePath(); ctx.fillStyle = '#2b6e2f'; ctx.fill(); ctx.strokeStyle = '#123d19'; ctx.lineWidth = 1.5; ctx.lineJoin = 'round'; ctx.stroke();
      ctx.strokeStyle = 'rgba(150,215,120,.4)'; ctx.lineWidth = 1.5; ctx.beginPath(); // a highlight along the vine
      pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.stroke();
      ctx.fillStyle = '#3c8f3a'; ctx.beginPath(); ctx.arc(ex, ey, vineCfg.w * 0.26, 0, 7); ctx.fill(); ctx.stroke(); // a rounded tip
    }
  });
}

// Bound by a vine: green coils round the feet and a label, while it cannot walk or use a movement skill.
function drawBound(d, p) {
  const bs = radius[p.k] / REF[p.k];
  upright(d.x, d.y, () => {
    ctx.strokeStyle = '#3f9a3a'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.ellipse(0, 12 * bs - i * 4 * bs - d.z, 17 * bs, 5 * bs, 0, 0, 7); ctx.stroke();
    }
    ctx.font = 'bold 12px system-ui'; ctx.textAlign = 'center'; ctx.fillStyle = '#9be37b';
    ctx.fillText('被纏住！', 0, -d.z - 44 * bs);
  });
}

// Smoke over Snorlax's head while it cannot move (recharging after Hyper Beam).
function drawSmoke() {
  const resting = slotsOf(1).filter((i) => snap.p[i].rt > 0);
  if (resting.length) {
    for (smokeAcc += 1 / 60; smokeAcc > 0.06; smokeAcc -= 0.06) for (const i of resting) {
      const d = disp[i];
      // x, y: the ground point it left from; u, v: its offset on screen from there (v < 0 is up)
      smoke.push({ x: d.x, y: d.y, u: (Math.random() - 0.5) * 18, v: -d.z - 30, vx: (Math.random() - 0.5) * 12, vy: -(26 + Math.random() * 16), age: 0, life: 0.9 + Math.random() * 0.5 });
    }
  }
  for (const s of smoke) {
    const k = s.age / s.life;
    s.u += s.vx / 60; s.v += s.vy / 60; s.age += 1 / 60;
    ctx.fillStyle = `rgba(200,200,205,${0.55 * (1 - k)})`;
    upright(s.x, s.y, () => { ctx.beginPath(); ctx.arc(s.u, s.v, 5 + 11 * k, 0, 7); ctx.fill(); });
  }
  while (smoke.length && smoke[0].age >= smoke[0].life) smoke.shift();
}

function drawPlayer(i, p) {
  const d = disp[i];
  if (d.x === null) { d.x = p.x; d.y = p.y; d.z = p.z; }
  const px = d.x, py = d.y;
  // Snapshots arrive at 30/s; ease toward them so 60fps motion looks smooth.
  d.x += (p.x - d.x) * 0.4; d.y += (p.y - d.y) * 0.4; d.z += (p.z - d.z) * 0.5;
  // Only a dash moves this fast along the ground (walking is ~3px/frame): leave an afterimage.
  const lk = look[i], [sx, sy] = rv(d.x - px, d.y - py), sp = Math.hypot(sx, sy); // moved this frame, as seen on screen
  const faceOf = (vx, vy) => (Math.abs(vx) > Math.abs(vy) ? (vx < 0 ? 2 : 3) : (vy < 0 ? 1 : 0));
  if (lk.dir === null) { const o = disp[1 - i]; lk.dir = o.x === null ? 0 : faceOf(...rv(o.x - d.x, o.y - d.y)); } // starts facing the opponent
  lk.vx += (sx - lk.vx) * 0.3; lk.vy += (sy - lk.vy) * 0.3;
  const running = sp > 0.35;
  if (running && Math.hypot(lk.vx, lk.vy) > 0.3) lk.dir = faceOf(lk.vx, lk.vy);
  lk.mv += ((running ? 1 : 0) - lk.mv) * 0.25; lk.ph += 0.2 * lk.mv;
  const pose = { dir: lk.dir, mv: lk.mv, ph: lk.ph };
  if (p.k === 3) { // the leaf grows for the Leaf Slash and is swung by it, upper left to lower right on the first, the other way on the next
    const sgn = p.ln % 2 === 0 ? 1 : -1, e = p.lk * p.lk * (3 - 2 * p.lk); // eased: the swing gathers speed and slows at the end
    lk.ls += ((p.lp > 0 ? leafCfg.scale : 1) - lk.ls) * 0.3;
    if (p.lp === 2) { lk.la = sgn * (-0.9 + 3.1 * e) * 1; lk.lb = -sgn * 26 * Math.sin(Math.PI * p.lk); } // about -50 to +130 degrees
    else { lk.la += (0 - lk.la) * 0.25; lk.lb = (lk.lb || 0) * 0.7; }
    pose.leaf = { s: lk.ls, a: lk.la, bend: lk.lb || 0 };
  }
  if (Math.hypot(d.x - px, d.y - py) > 8) ghosts.push({ k: p.k, x: d.x, y: d.y, z: d.z, a: 0.5, pose });
  const lift = Math.min(d.z, 200) / 200, bs = radius[p.k] / REF[p.k]; // bs: how much bigger than the reference art
  // Shadow stays on the ground and shrinks/fades as the player rises.
  upright(d.x, d.y, () => {
    ctx.fillStyle = `rgba(0,0,0,${0.35 - 0.2 * lift})`;
    ctx.beginPath(); ctx.ellipse(0, 14 * bs, 18 * bs * (1 - 0.4 * lift), 7 * bs * (1 - 0.4 * lift), 0, 0, 7); ctx.fill();
  });
  drawBody(p.k, d.x, d.y, 1, d.z, p.k === 2 && (p.ft > 0 || p.gp > 0) ? 1 : 0, pose); // the body floats d.z above the ground; Charizard beats its wings hard in flight
  drawFrozen(p, i, d);
  if (p.bd > 0) drawBound(d, p);
  if (p.pz > 0) drawParalyzed(d, p);
  // Everything below is upright, with the origin on the ground under the player; the body is at -d.z.
  const top = -d.z;
  upright(d.x, d.y, () => {
    if (p.k === 1 && p.bt > 0) { // glowing orb with radiating lines, growing as the charge fills
      const k = 1 - p.bt / beamCfg.charge, [ax, ay] = rv(p.bx, p.by), ox = ax * 26 * bs, oy = top - 4 * bs + ay * 26 * bs, r = 4 + 12 * k;
      ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1.5;
      for (let a = 0; a < 6.28; a += 0.5236) {
        ctx.beginPath();
        ctx.moveTo(ox + Math.cos(a) * (r + 4), oy + Math.sin(a) * (r + 4));
        ctx.lineTo(ox + Math.cos(a) * (r + 10 + 14 * k), oy + Math.sin(a) * (r + 10 + 14 * k));
        ctx.stroke();
      }
      const gr = ctx.createRadialGradient(ox, oy, 0, ox, oy, r * 1.8);
      gr.addColorStop(0, '#fff'); gr.addColorStop(0.35, '#ffb040'); gr.addColorStop(1, 'rgba(255,90,30,0)');
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(ox, oy, r * 1.8, 0, 7); ctx.fill();
    }
    if (p.k === 1 && (p.bt > 0 || p.st > 0 || p.rt > 0)) {
      ctx.font = 'bold 13px system-ui'; ctx.textAlign = 'center';
      ctx.fillStyle = p.rt > 0 ? '#ff8a5c' : '#ffd27a';
      ctx.fillText(p.rt > 0 ? 'MUST RECHARGE' : '破壞死光！', 0, top - 54 * bs);
    }
    if (p.k === 2 && p.ht > 0) { // Fire Breath: flames at the mouth, toward the opponent
      const o = disp[1 - i], [vx, vy] = rv(o.x - d.x, o.y - d.y), n = Math.hypot(vx, vy) || 1, ux = vx / n, uy = vy / n;
      const mx = ux * 18 * bs, my = top - 11 * bs + uy * 18 * bs, R = 17 * bs * (0.8 + 0.4 * Math.random());
      const gr = ctx.createRadialGradient(mx, my, 0, mx, my, R);
      gr.addColorStop(0, '#fff6c0'); gr.addColorStop(0.4, '#ffb030'); gr.addColorStop(1, 'rgba(255,70,10,0)');
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(mx, my, R, 0, 7); ctx.fill();
    }
    if (p.hd) { ctx.font = 'bold 13px system-ui'; ctx.textAlign = 'center'; ctx.fillStyle = '#ff8a5c'; ctx.fillText('被抓住！', 0, top - 54 * bs); }
    if (i === you) { ctx.fillStyle = '#fff'; ctx.font = '12px system-ui'; ctx.textAlign = 'center'; ctx.fillText('▼ 你', 0, top - 40 * bs); }
    // HP bar follows the body.
    ctx.fillStyle = '#000a'; ctx.fillRect(-20, top - 36 * bs, 40, 6);
    ctx.fillStyle = p.hp > 0.3 * maxHp[p.k] ? '#6fd36f' : '#e55'; ctx.fillRect(-20, top - 36 * bs, 40 * p.hp / maxHp[p.k], 6);
  });
}

// Volt Tackles left: the running chain's, else all of them once the cooldown is over, else none.
const voltUses = (p) => (p.vn > 0 ? p.vn : p.dcd > 0 ? 0 : voltCfg.uses);

// Each button's dark pie is the share of its cooldown still to wait.
function drawCooldowns() {
  if (!snap) return;
  for (const c of cdBtns) {
    const total = cdCfg[c.total], left = snap.p[you][c.field];
    c.span.style.setProperty('--cd', (total > 0 ? Math.min(Math.max(left / total, 0), 1) * 360 : 0) + 'deg');
  }
  if (usesBadge) { const n = voltUses(snap.p[you]); usesBadge.textContent = '×' + n; usesBadge.classList.toggle('out', n === 0); }
}

// Team match: a row of four tokens per side along the top, the opponent's above mine. A fallen character is
// crossed out, the one fighting is lit, and the ones still to come are my own letters and the opponent's "?".
function drawTeamHud() {
  const tm = snap.tm;
  if (!tm) return;
  ctx.save(); ctx.font = 'bold 17px system-ui'; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
  [1 - you, you].forEach((s, row) => {
    const y = 20 + row * 38;
    ctx.fillStyle = '#fffc'; ctx.textAlign = 'left'; ctx.fillText(s === you ? '你' : '對手', 8, y); ctx.textAlign = 'center';
    for (let n = 0; n < NAMES.length; n++) {
      const x = 82 + n * 38, fallen = n < tm.c[s], now = n === tm.c[s] && !tm.o;
      const k = fallen ? tm.f[s][n] : now ? snap.p[s].k : s === you ? +(myOrder[n] ?? -1) : -1;
      ctx.beginPath(); ctx.arc(x, y, 15, 0, 7);
      ctx.fillStyle = fallen ? '#555' : now ? '#f7cf3a' : '#2b3340'; ctx.fill();
      ctx.strokeStyle = now ? '#fff' : '#889'; ctx.lineWidth = now ? 2.5 : 1; ctx.stroke();
      ctx.fillStyle = now ? '#222' : fallen ? '#999' : '#dde'; ctx.fillText(k >= 0 ? NAMES[k][0] : '?', x, y + 1);
      if (fallen) { ctx.strokeStyle = '#e44'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x - 11, y - 11); ctx.lineTo(x + 11, y + 11); ctx.moveTo(x + 11, y - 11); ctx.lineTo(x - 11, y + 11); ctx.stroke(); }
    }
  });
  ctx.restore();
}

// The banner when a bout or the match ends.
function drawResult() {
  if (snap.w < 0) return;
  const tm = snap.tm, final = !tm || tm.o, me = snap.p[you], op = snap.p[1 - you];
  const text = final ? ((tm ? tm.mw : snap.w) === you ? '你贏了！' : '你輸了')
    : me.hp <= 0 && op.hp <= 0 ? '同時倒下！雙方換下一隻' : me.hp <= 0 ? `${NAMES[me.k]}倒下了，換下一隻` : `打倒對手的${NAMES[op.k]}！`;
  ctx.fillStyle = '#000a'; ctx.fillRect(0, cv.height / 2 - 50, cv.width, 100);
  ctx.fillStyle = '#fff'; ctx.font = (final ? 40 : 28) + 'px system-ui'; ctx.textAlign = 'center';
  ctx.fillText(text, cv.width / 2, cv.height / 2 + 12);
}

function frame() {
  drawCooldowns();
  drawCards();
  ctx.save();
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (shake > 0) { ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake); shake *= 0.85; if (shake < .5) shake = 0; }

  if (snap) {
    ctx.save();
    ctx.transform(...VIEW); // from here on, coordinates are the world's
    for (const g of ghosts) { drawBody(g.k, g.x, g.y, Math.max(g.a, 0), g.z, 0, g.pose); g.a -= 0.04; }
    while (ghosts.length && ghosts[0].a <= 0) ghosts.shift();
    drawTelegraph();
    drawShadow();
    drawBalls();
    drawToss();
    drawIcePunch();
    drawBeams();
    drawSmoke(); // under the players, so the labels and HP bars stay readable
    // Draw lower players first so the one nearer the camera overlaps correctly.
    [0, 1].sort((a, b) => screenY(snap.p[a].x, snap.p[a].y) - screenY(snap.p[b].x, snap.p[b].y)).forEach((i) => drawPlayer(i, snap.p[i]));
    drawLeafSlashes(); // over the bodies: the blade is the thing to see
    drawVines();
    drawVolt();
    fx = fx.filter((f) => (f.age += 1 / 60) < (f.t === 'slam' ? QUAKE_LIFE : f.t === 'explode' ? 0.5 : f.t === 'freeze' ? 0.6 : 0.35));
    for (const f of fx) {
      if (f.t === 'thunder') drawBolt(f);
      else if (f.t === 'skybolt') drawSkyBolt(f);
      else if (f.t === 'explode') drawExplosion(f);
      else if (f.t === 'freeze') drawFreezeBurst(f);
      else if (f.t === 'paralyze') drawParalyzeBurst(f);
      else if (f.t === 'leaf') drawLeafSpark(f);
      else drawQuake(f); // 'slam'
    }
    ctx.restore();
    drawTeamHud();
    drawResult();
  }
  ctx.restore();
  document.getElementById('repick').style.display = snap && snap.w >= 0 && (!snap.tm || snap.tm.o) ? 'block' : 'none';

  const link = location.origin + location.pathname + '?room=' + room;
  bar.innerHTML = waiting ? `等待對手加入… 把這個連結傳給對方：<br><code>${link}</code><br>（電腦橫式版：在自己的網址後面加上 &landscape）` : status === '連線中…' ? '' : status;
  requestAnimationFrame(frame);
}
frame();
</script>
