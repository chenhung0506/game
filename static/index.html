<style>
  body { margin: 0; background: #14161c; color: #e8e8ea; font: 14px system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; }
  canvas { background: #2b3a2f; max-width: 100%; max-height: calc(100vh - 120px); margin-top: 12px; border: 2px solid #3d4a40; }
  #bar { padding: 10px 16px; text-align: center; line-height: 1.6; }
  code { background: #262a33; padding: 2px 6px; border-radius: 4px; word-break: break-all; }
  #bar:empty { display: none; }
  /* Portrait (the default, for phones): the canvas fills the screen and the pad is drawn over it. */
  html { touch-action: none; overscroll-behavior: none; }
  body.portrait { height: 100dvh; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  body.portrait canvas { margin: 0; border: 0; max-width: 100vw; max-height: 100dvh; }
  body.portrait #bar { position: fixed; top: 0; left: 0; right: 0; z-index: 2; background: #000b; padding: 6px 12px; font-size: 12px; }
  body.portrait #bar2 { display: none; }
  #reconnect { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 30; display: none; padding: 16px 28px; border-radius: 12px; border: 2px solid #fff; background: #e83838; color: #fff; font: bold 18px system-ui; }
  #unzoom { position: fixed; left: 0; top: 0; transform-origin: 0 0; z-index: 9; display: none; margin: 12px; padding: 10px 14px; border-radius: 8px; border: 2px solid #fff; background: #000c; color: #fff; font: bold 14px system-ui; }
  .stick, .btn { position: fixed; z-index: 3; border-radius: 50%; touch-action: none; user-select: none; -webkit-user-select: none; }
  .stick { left: 18px; bottom: 28px; width: 140px; height: 140px; background: #ffffff22; border: 2px solid #ffffff44; }
  .knob { position: absolute; left: 38px; top: 38px; width: 60px; height: 60px; border-radius: 50%; background: #ffffff88; pointer-events: none; }
  .btn { display: flex; align-items: center; justify-content: center; background: #ffffff2a; border: 2px solid #ffffff66; color: #fff; font-weight: bold; }
  .btn.on { background: #ffffff77; }
  .btn.ult { border-color: #ffd84a99; font-size: 12px; }
  .btn.ult.ready { border-color: #ffe14a; background: #ffd84a55; box-shadow: 0 0 14px 4px #ffe14acc; animation: ultpulse .8s ease-in-out infinite alternate; }
  @keyframes ultpulse { from { box-shadow: 0 0 8px 2px #ffe14a99; } to { box-shadow: 0 0 20px 7px #ffe14aee; } }
  .btn .pct { position: absolute; bottom: 5px; left: 0; right: 0; font-size: 11px; text-align: center; pointer-events: none; color: #ffe9a0; }
  .aimring, .aimdot { position: absolute; left: 50%; top: 50%; border-radius: 50%; pointer-events: none; display: none; }
  .aimring { width: 150px; height: 150px; margin: -75px 0 0 -75px; border: 2px dashed #ffffff88; }
  .aimdot { width: 26px; height: 26px; margin: -13px 0 0 -13px; background: #ffd27acc; }
  .btn.aim .aimring, .btn.aim .aimdot { display: block; }
  /* cooldown: a dark pie over the button, the part still to wait, shrinking clockwise from the top */
  /* character choice: shown from connecting until the match starts */
  #pick { position: fixed; inset: 0; z-index: 4; background: #14161c; display: none; flex-direction: column; align-items: center; padding: 56px 12px 12px; box-sizing: border-box; overflow-y: auto; touch-action: pan-y; }
  #rooms { position: fixed; inset: 0; z-index: 5; background: #14161c; display: none; flex-direction: column; align-items: center; padding: 56px 12px 12px; box-sizing: border-box; overflow-y: auto; }
  #rooms h2 { margin: 6px 0 12px; font-size: 20px; }
  #roomlist { display: flex; flex-direction: column; gap: 8px; width: min(420px, 100%); margin-bottom: 14px; }
  #rooms button { font: bold 15px system-ui; padding: 12px 16px; border-radius: 10px; border: 2px solid #3d4a40; background: #1b1f27; color: #eee; cursor: pointer; }
  #rooms button.stale { opacity: .5; border-style: dashed; }
  #rooms .hint { margin-top: 12px; font-size: 13px; opacity: .6; }
  #pick h2 { margin: 6px 0 12px; font-size: 20px; }
  #cards { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .card { width: 148px; border: 2px solid #3d4a40; border-radius: 12px; padding: 8px; background: #1b1f27; text-align: center; cursor: pointer; user-select: none; -webkit-user-select: none; }
  .card canvas { margin: 0; border: 0; width: 120px; height: 100px; border-radius: 8px; background: #2b3a2f; }
  .card b { display: block; margin-top: 6px; font-size: 16px; }
  .card small { display: block; margin-top: 4px; opacity: .75; line-height: 1.5; text-align: left; font-size: 12px; }
  .card.mine { border-color: #6fd36f; background: #243026; }
  #fullbox { margin: 0 0 12px; text-align: center; display: none; }
  #fullbox label { cursor: pointer; }
  #easebox { margin: 0 0 12px; text-align: center; line-height: 1.6; display: none; }
  #easebox input { width: 220px; vertical-align: middle; }
  #easemsg { font-size: 12px; opacity: .75; }
  #playmodes, #modes, #teambar, #tools, #botpick { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 0 0 12px; }
  #botpick { display: none; }
  #teambar { margin: 12px 0 0; }
  #pick button, #repick, #exitdummy { font: bold 15px system-ui; padding: 9px 16px; border-radius: 10px; border: 2px solid #3d4a40; background: #1b1f27; color: #eee; cursor: pointer; }
  #pick button.on { border-color: #6fd36f; background: #243026; }
  #pick button:disabled { opacity: .4; cursor: default; }
  #exitdummy { position: fixed; right: 10px; top: 10px; z-index: 3; display: none; font-size: 14px; padding: 8px 14px; opacity: .85; }
  #repick { position: fixed; left: 50%; top: 56%; transform: translateX(-50%); z-index: 3; display: none; font-size: 18px; padding: 12px 26px; background: #243026; border-color: #6fd36f; }
  .card { position: relative; }
  .card .ord { position: absolute; top: 4px; left: 4px; min-width: 24px; height: 24px; line-height: 24px; border-radius: 12px; background: #6fd36f; color: #111; font: bold 15px/24px system-ui; font-style: normal; display: none; }
  #pickmsg { margin-top: 14px; text-align: center; line-height: 1.7; }
  .uses { position: absolute; top: -4px; right: -4px; min-width: 28px; padding: 2px 5px; border-radius: 14px; background: #f7cf3a; color: #222; font-size: 14px; text-align: center; pointer-events: none; }
  .uses.out { background: #888; color: #eee; }
  .cd { position: absolute; inset: 0; border-radius: 50%; pointer-events: none; background: conic-gradient(#000000b0 var(--cd, 0deg), transparent 0); }
</style>
</head>
<body>
<div id="bar"></div>
<button id="reconnect">連線中斷　重新連線</button>
<div id="rooms"><h2>選擇房間</h2><div id="roomlist"></div><button id="newroom">開新房間</button><div class="hint">灰色表示對方可能已斷線；沒有人等待時會自動開房</div></div>
<div id="pick"><h2>選擇你的寶可夢</h2><div id="playmodes"><button data-play="computer">打電腦</button><button data-play="player">打玩家</button><button data-play="dummy">打木樁</button><button data-play="squad">2v2</button><button data-play="vs2">1v2</button></div><div id="fullbox"><label><input type="checkbox" id="fullcharge"> 絕招一進場就充滿（不用累積能量）</label></div><div id="modes"><button id="mSingle">單場對戰</button><button id="mTeam">死鬥（依序上場）</button><button id="sz3">3 隻</button><button id="szAll">全部</button></div><div id="tools"><button id="botMain">單機對戰</button><button id="botOff">改和真人對戰</button><button id="easeBtn">放水 0%</button></div><div id="botpick"></div><div id="easebox"><label><span id="easelabel">放水</span> <b id="easeval">0%</b>　<input id="ease" type="range" min="0" max="90" step="10" value="0"></label><div id="easemsg"></div></div><div id="cards"></div><div id="teambar"><button id="tClear">清除順序</button><button id="tOk">確認出場順序</button></div><div id="pickmsg"></div></div>
<button id="repick">重選角色</button><button id="exitdummy">退出木樁</button>
<canvas id="c" width="2000" height="1000"></canvas>
<div id="bar2" style="padding:8px 16px;opacity:.7"></div>
<script>
// Portrait is the default (phones): the two players are one above the other and you are always at the
// bottom, so the arena is turned a quarter turn, a different way for each player. Add ?landscape to the
// address for the wide view, with the players left and right.
const PORTRAIT = !new URLSearchParams(location.search).has('landscape');
document.body.classList.toggle('portrait', PORTRAIT);
const QUAKE_LIFE = 0.75; // seconds the earthquake effect stays on screen (also on a landing)
let ROT = 0;               // how far the arena is turned on screen (radians); 0 in landscape
let VIEW = [1, 0, 0, 1, 0, 0]; // world -> canvas matrix for ctx.transform
// Each player picks a character in the lobby; a snapshot's p[i].k says who is who (0 Pikachu, 1 Snorlax, 2 Charizard, 3 Chikorita, 4 Vulpix, 5 Rowlet).
// Everything below that belongs to one character looks that player up with slotOf, instead of assuming a slot.
const NAMES = ['皮卡丘', '卡比獸', '噴火龍', '菊草葉', '六尾', '木木梟', '鯉魚王', '小智', '怪力', '梗鬼', '胖丁'];
const FORMS = [...NAMES, '紅色暴鯉龍']; // every kind a player can be in: Magikarp becomes the last one (nobody picks it)
const BLURB = ['伏特攻擊・打雷・電球', '跳躍落地震・破壞死光・急凍拳・睡覺（絕招）', '飛行・噴火・地球上投', '葉刃連斬・飛葉快刀・藤鞭・大藤蔓（絕招）', '冰山滑行・冰風暴・急凍光線・冰封世界（絕招）', '空氣斬・箭雨・龍捲風', '彈跳・彈跳五次進化成暴鯉龍', '飛膝踢・拔樹・百裂拳・百萬噸拳擊（絕招）', '飛膝踢・子彈拳・岩石陣', '暗影潛行・鬼火・影子球・極巨化（絕招）', '連環巴掌・翻滾飛踢'];
const HELP = [
  '你是皮卡丘　移動 WASD　空白鍵＝伏特攻擊（全身纏繞閃電朝按住的方向衝刺，可連續使用數次，撞到敵人會使其麻痺無法移動；比地球上投和急凍拳輕，對撞時會輸）　J＝打雷（朝天空放電並在敵人頭上落雷，施放期間無法移動，陰影會追著敵人）　K＝電球（續能後自動朝敵人所在方向丟出，碰到敵人、牆或被打爆時爆炸）　L＝千萬伏特（絕招：開場鎖住，被打、打中敵人、時間經過都會續能，滿了才能放；朝四周放出一圈閃電，之後追著敵人跑、碰到會擊退，時間到全部爆炸）',
  '你是卡比獸　移動 WASD　空白鍵＝跳躍（落地壓人，附地震特效）　J＝破壞死光（朝敵人所在方向扇形掃射，蓄力與掃射時定身，之後硬直）　K＝急凍拳（蓄力時按 WASD 決定方向，朝該方向衝拳，打到的敵人被冰凍）　L＝睡覺（絕招：開場鎖住，被打、打中敵人、時間經過都會續能，滿了才能用；睡著的這段時間不能動也不能出招，但會持續回血；被暈眩、擊退、打上空中、冰凍、定身都不會中斷睡眠）',
  '你是噴火龍　移動 WASD　空白鍵＝飛行（一段時間在半空，移動更快，但仍會被電球和急凍拳打到）　J＝噴火（自動朝敵人噴出一串小火球，可以邊走邊噴）　K＝地球上投（全身著火朝按住的方向衝刺，撞到敵人就抓上天再摔下）　L＝極巨化（絕招，蓄能滿了才能放：變成又大又壯的極巨化噴火龍一段時間，血量、速度和體型大增，空白鍵的飛行換成「極巨地獄滅焰」（站定召喚一隻燃燒的火焰鳥，飛上天後朝敵人俯衝，落地爆炸、把敵人炸上天並留下一片火海），噴火和地球上投換成更強的數值，火球更大、顆數更少，摔下去留下的火更大片；變身時鏡頭會拉到最遠，時間到變回原形，血量依比例縮回）',
  '你是菊草葉　移動 WASD　空白鍵＝葉刃連斬（朝按住的方向跳一大步，落地不傷人，接著甩動頭上的葉子連斬數下，每一下都朝敵人前進，葉子掃到的人會受傷）　J＝飛葉快刀（在身邊灑出一堆樹葉，各自等一下後朝敵人射出）　K＝藤鞭（朝搖桿方向左右各揮出一條藤鞭在前方會合，被打中的敵人一段時間不能走路也不能用位移技能）　L＝大藤蔓（絕招，蓄能滿了才能放；一根粗藤蔓從地底追著敵人跑，碰到敵人或時間到就在那裡冒出來，周圍一圈大藤蔓依序衝出地面，各自鎖定敵人朝下拍打，打中的人受傷、變慢，被藤蔓打中好幾次還會被打暈；整個過程無法移動）',
  '你是六尾　移動 WASD　空白鍵＝冰山滑行（踩著冰山快速滑動，停不下來，WASD 控制方向；經過的地面結冰，站在自己的冰上走得更快、敵人踩上去會變慢；冰山撞到敵人或時間到就爆炸）　J＝冰風暴（風暴從身上出發追著敵人跑，定時打擊，每打中幾次就把敵人冰住）　K＝急凍光線（站定不動，WASD 或搖桿改成移動光線落點，光線不傷人，掃過的地面會長出冰柱擋住敵人）　L＝冰封世界（蓄能滿才能放：短暫集氣後，在前方的圓形範圍內不斷從天上砸下冰錐，砸中的敵人受傷並變慢，冰錐會留在場上擋住敵人的走位，可以被打碎）',
  '你是木木梟　移動 WASD　一直飛在空中，只有打得到這個高度的招式才打得到你　空白鍵＝空氣斬（朝按住的方向衝出一道半月形弧線，彎向敵人那一側，沿途朝最近的敵人射出一道道白色的空氣斬擊，打得到貼地的敵人）　J＝箭雨（朝敵人扇形射出一排綠色弓箭，射中的敵人受傷並變慢）　K＝龍捲風（蓄力後在前方放出龍捲風，自動追著敵人跑，捲到就把敵人捲上天旋轉、最後摔下來；龍捲風可以被打壞）　L＝神鳥猛攻（絕招，蓄能滿才能放：先定身集氣，飛上高空、身上的鳥形光芒愈來愈大，然後朝敵人俯衝，撞擊地面爆炸，把敵人打上天、在空中動彈不得）',
  '你是鯉魚王　移動 WASD　空白鍵＝彈跳（跳到半空並在最高點停一會兒再落下，打不到那麼高的招式都打不到你，落地不傷人；每落地一次算一次，累計彈跳 5 次就會進化成紅色暴鯉龍）　沒有其他技能',
  '你是真新鎮小智　移動 WASD　空白鍵＝飛膝踢（朝按住的方向滑一步，接著朝敵人飛身踢過去，踢中的敵人受傷、被踢飛並被打暈）　J＝拔樹（朝按住的方向跳一大步，落地後從地面拔起一棵大樹，高舉一會兒後朝敵人所在位置砸下，地上會先畫出樹幹加樹冠的範圍給對手看）　K＝百裂拳（一直朝敵人衝過去，前方不斷出現一堆拳頭打人）　L＝百萬噸拳擊（絕招，蓄能滿了才能放；天色會變暗。朝按住的方向先跳一步，落地後定身蓄力一下（蓄力時拳會一直追著敵人，推搖桿就改朝搖桿的方向），蓄力後半段畫面會閃爍，朝敵人的方向帶著拳頭一起往前衝出去，打中的敵人受傷、被擊暈並被打飛）',

// The view: the world is drawn through VIEW, so everything that is not upright art (rings, beams, the
// strike areas) just follows. Pikachu starts on the left, so its view turns the arena a quarter turn

// where the window sits), so it is rebuilt every frame by updateCamera.

const camState = { t: 0, cx: null, cy: null, last: 0 }; // t: 0 = zoomed all the way in, 1 = all the way out

// The zoom follows the distance between the farthest two characters (so it works for more than two): at zin or less it is all the way in, at zout

  pts.forEach((a, i) => {

    for (let j = i + 1; j < pts.length; j++) far = Math.max(far, Math.hypot(a.x - pts[j].x, a.y - pts[j].y));
  });

  if (pts.length > 1) { // the wanted zoom grows with the distance: all the way in at zin, all the way out at zout; it moves there at zspeed
    let want = cam.zout > cam.zin ? Math.min(1, Math.max(0, (far - cam.zin) / (cam.zout - cam.zin))) : (far > cam.zout ? 1 : 0);
    if (cam.gz && snap.p.some((q) => q.gmt > 0)) want = 1; // somebody is Gigantamax: the body fills the screen, so the camera goes all the way out
    S.t += Math.min(Math.abs(want - S.t), cam.zspeed * dt) * Math.sign(want - S.t);

// Keep the page from zooming. The viewport tag and touch-action cover most browsers; iOS Safari ignores

if (PORTRAIT) {

  document.addEventListener('touchmove', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false }); // two fingers
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (e) => { const now = Date.now(); if (now - lastTouchEnd < 350) e.preventDefault(); lastTouchEnd = now; }, { passive: false }); // double tap

  const follow = () => {

    if (zoomed) btn.style.transform = `translate(${vv.offsetLeft}px, ${vv.offsetTop}px) scale(${1 / vv.scale})`;

  { main: ['跳躍', 'skill'], small: [['死光', 'beam'], ['冰拳', 'punch']], ult: ['睡覺', 'ult'] }, // Snorlax: Z puts it to sleep, healing it; // Snorlax
  { main: ['飛行', 'skill'], small: [['噴火', 'fire'], ['上投', 'toss']], ult: ['極巨化', 'ult'] }, // Charizard: Z turns it into the Gigantamax Charizard; the three skills keep their names and buttons
  { main: ['葉刃', 'skill'], small: [['飛葉', 'razor'], ['藤鞭', 'vine', true]], ult: ['大藤蔓', 'ult'] }, // Chikorita
  { main: ['冰山', 'skill'], small: [['冰風暴', 'storm'], ['冰光線', 'freeze']], ult: ['冰封世界', 'ult'] }, // Vulpix
  { main: ['空氣斬', 'skill'], small: [['箭雨', 'arrow'], ['龍捲風', 'twister']], ult: ['神鳥猛攻', 'ult'] }, // Rowlet
  { main: ['彈跳', 'skill'], small: [] }, // Magikarp
  { main: ['飛膝踢', 'skill'], small: [['拔樹', 'tree'], ['百裂拳', 'comet']], ult: ['百萬噸', 'ult'] }, // Ash: the kick is the main skill (sent as Skill, personsInput on the server sorts out what it is), the tree and the Comet Punch the small ones, the Megaton Punch the ultimate
  { main: ['上鉤拳', 'skill'], small: [['子彈拳', 'comet'], ['飛膝踢', 'rock']], ult: ['極巨化', 'ult'] }, // Machamp: Z turns it into the Gigantamax Machamp; the Uppercut is the main skill, the High Jump Kick (the page sends K as `rock`, the server turns it into the kick) a small one; the Rock Tomb is not used
  { main: ['暗影潛行', 'skill'], small: [['鬼火', 'gfire'], ['影子球', 'sball', true]], ult: ['極巨化', 'ult'] }, // Gengar: Z turns it into the Gigantamax Gengar, whose three buttons are the Lick, the Devour and the fan of fire
  { main: ['連環巴掌', 'skill'], small: [['翻滾飛踢', 'roll']] }, // Jigglypuff: the main button is the chain of blows (ground: five hand blows, in the air: stomps), the small one the roll kick
  { main: ['海浪', 'skill'], small: [['死光', 'beam'], ['擺尾', 'tail', true]] }, // Gyarados; a third entry marks a skill that is aimed with its own button
];
function buildPad() {
  document.querySelectorAll('.stick, .btn').forEach((el) => el.remove());
  cdBtns.length = 0; usesBadge = null; ultBtn = null;
  const el = (cls) => { const d = document.createElement('div'); d.className = cls; document.body.append(d); return d; };

  const base = el('stick'), knob = document.createElement('div'); knob.className = 'knob'; base.append(knob);
  const MAXR = 46; let sid = null;
  const aim = (e) => {
    const r = base.getBoundingClientRect(), vx = e.clientX - (r.left + r.width / 2), vy = e.clientY - (r.top + r.height / 2);
    const len = Math.hypot(vx, vy), ux = len ? vx / len : 0, uy = len ? vy / len : 0, pull = Math.min(len, MAXR);
    knob.style.transform = `translate(${ux * pull}px, ${uy * pull}px)`;
    // 8 directions; 0.38 = cos(67.5deg) splits the circle into eight equal sectors
    stickAim = len < MAXR * 0.35 ? { x: 0, y: 0 } : { x: ux, y: uy };
    stick = len < MAXR * 0.35 ? { x: 0, y: 0 } : { x: ux > 0.38 ? 1 : ux < -0.38 ? -1 : 0, y: uy > 0.38 ? 1 : uy < -0.38 ? -1 : 0 };
    sendInput();
  };
  const release = (e) => { if (e.pointerId !== sid) return; sid = null; knob.style.transform = ''; stick = { x: 0, y: 0 }; stickAim = { x: 0, y: 0 }; sendInput(); };
  base.addEventListener('pointerdown', (e) => { if (sid !== null) return; sid = e.pointerId; base.setPointerCapture(sid); aim(e); });
  base.addEventListener('pointermove', (e) => { if (e.pointerId === sid) aim(e); });
  for (const t of ['pointerup', 'pointercancel', 'lostpointercapture']) base.addEventListener(t, release);

  const MAIN = 104, SMALL = 58, EDGE = 18, BOTTOM = 28;
  const place = (b, size, cx, cy) => { b.style.width = b.style.height = size + 'px'; b.style.right = (cx - size / 2) + 'px'; b.style.bottom = (cy - size / 2) + 'px'; };
  // which snapshot field holds the time left, and which cooldown is its full length
  const CD = [{ skill: ['dcd', 'dash'], thunder: ['tcd', 'thunder'], ball: ['ecd', 'ball'] }, { skill: ['jcd', 'jump'], beam: ['bcd', 'beam'], punch: ['pcd', 'punch'] }, { skill: ['fcd', 'fly'], fire: ['hcd', 'fire'], toss: ['gcd', 'toss'] }, { skill: ['lcd', 'leaf'], razor: ['rcd', 'razor'], vine: ['vcd', 'vine'] }, { skill: ['ycd', 'frost'], storm: ['wcd', 'storm'], freeze: ['zcd', 'fbeam'] }, { skill: ['mcd', 'drift'], arrow: ['acd', 'arrow'], twister: ['qcd', 'twister'] }, { skill: ['ocd', 'hop'] }, { skill: ['kkcd', 'akick'], tree: ['trcd', 'tree'], comet: ['cpcd', 'comet'] }, { skill: ['ucd', 'upper'], comet: ['cpcd', 'mcomet'], rock: ['kkcd', 'mkick'] }, { skill: ['gncd', 'gsneak'], gfire: ['gfcd', 'gfire'], sball: ['sbcd', 'sball'] }, { skill: ['slcd', 'slap'], roll: ['rlcd', 'roll'] }, { skill: ['wvcd', 'wave'], beam: ['bcd', 'gbeam'], tail: ['tlcd', 'tail'] }];
  const hold = (b, label, name, aimed) => {
    b.textContent = label; let id = null;
    const span = document.createElement('div'); span.className = 'cd'; b.append(span);
    if (name === 'ult') { // no cooldown: the dark pie is the charge still missing, and the button lights up when it is full
      const pct = document.createElement('div'); pct.className = 'pct'; b.append(pct); b.classList.add('ult'); ultBtn = { b, span, pct };
    } else cdBtns.push({ span, field: CD[padKind][name][0], total: CD[padKind][name][1], b, label, gmLabel: padKind === 9 && name === 'skill' ? '舔舌' : padKind === 9 && name === 'sball' ? '吞噬' : padKind === 8 && name === 'rock' ? '閃電拳' : padKind === 8 && name === 'skill' ? '爆裂拳' : padKind === 2 && name === 'skill' ? '地獄滅焰' : null }); // gmLabel: what the button says while Machamp is Gigantamax
    if (padKind === 0 && name === 'skill') { usesBadge = document.createElement('div'); usesBadge.className = 'uses'; b.append(usesBadge); }
    if (aimed) { // the button turns into a stick while it is held: the way it is dragged is the way the skill goes
      const ring = document.createElement('div'), dot = document.createElement('div'); ring.className = 'aimring'; dot.className = 'aimdot'; b.append(ring, dot);
      // The straight balls (the Electro Ball, the Shadow Ball) are aimed like a stick that starts where the finger went down, with a dead zone: a tap, or a finger that
      // only wobbles, aims nothing and the ball goes at the opponent. The whips measure from the button's middle.
      const fromTouch = name === 'ball' || name === 'sball';
      const DEAD = fromTouch ? 30 : 20, MAXR = 56;
      let o = null; // where the finger went down
      const drag = (e) => {
        const r = b.getBoundingClientRect(), ox = fromTouch && o ? o.x : r.left + r.width / 2, oy = fromTouch && o ? o.y : r.top + r.height / 2, vx = e.clientX - ox, vy = e.clientY - oy, len = Math.hypot(vx, vy);
        if (aiming) { aiming.x = len < DEAD ? 0 : vx / len; aiming.y = len < DEAD ? 0 : vy / len; }
        const pull = Math.min(len, MAXR);
        dot.style.transform = len ? `translate(${vx / len * pull}px, ${vy / len * pull}px)` : '';
      };
      b.addEventListener('pointerdown', (e) => { e.preventDefault(); if (id !== null) return; id = e.pointerId; b.setPointerCapture(id); o = { x: e.clientX, y: e.clientY }; beginAim({ name, x: 0, y: 0 }); b.classList.add('on', 'aim'); drag(e); });
      b.addEventListener('pointermove', (e) => { if (e.pointerId === id) drag(e); });
      const end = (doCast) => (e) => { if (e.pointerId !== id) return; id = null; b.classList.remove('on', 'aim'); dot.style.transform = ''; endAim(doCast); };
      b.addEventListener('pointerup', end(true));
      for (const t of ['pointercancel', 'lostpointercapture']) b.addEventListener(t, end(false));

    }
    b.addEventListener('pointerdown', (e) => { e.preventDefault(); if (id !== null) return; id = e.pointerId; b.setPointerCapture(id); touch[name] = true; b.classList.add('on'); sendInput(); });
    const up = (e) => { if (e.pointerId !== id) return; id = null; touch[name] = false; b.classList.remove('on'); sendInput(); };
    for (const t of ['pointerup', 'pointercancel', 'lostpointercapture']) b.addEventListener(t, up);
  };
  const mcx = EDGE + MAIN / 2, mcy = BOTTOM + MAIN / 2; // centre of the main button, from the right / bottom edges
  const [mainLabel, mainKey] = PAD[padKind].main;
  const main = el('btn'); place(main, MAIN, mcx, mcy); main.style.fontSize = '20px'; hold(main, mainLabel, mainKey);
  const R = MAIN / 2 + SMALL / 2 + 8, withUlt = PAD[padKind].ult && ultCfg[padKind] > 0;
  // slot angles: round the upper-left of the main button; the third sits farther out. With an ultimate the three are one arc, 42 degrees
  // apart (just clear of each other), from the left of the main button up to its top: J, K, then Z.
  const slots = withUlt ? [[180, R], [138, R], [96, R]] : [[165, R], [105, R], [135, R + 50]];
  slots.forEach(([deg, rr], n) => {
    const def = withUlt ? [...PAD[padKind].small, PAD[padKind].ult][n] : PAD[padKind].small[n];
    if (!def) return;
    const b = el('btn'), a = deg * Math.PI / 180;
    place(b, SMALL, mcx - rr * Math.cos(a), mcy + rr * Math.sin(a)); b.style.fontSize = def[1] === 'ult' ? '12px' : '14px'; hold(b, def[0], def[1], def[2]);
  });
}

// ---- render ----
// Placeholder art drawn with shapes; (x, y) is the centre of the body.
// art() draws one character (0 Pikachu, 1 Snorlax, 2 Charizard) in an upright frame on any context; the
// arena and the character cards both use it. flap (Charizard only) is 1 while it flies, to beat the wings hard.
function el(c, x, y, rx, ry, fill, rot = 0) { c.fillStyle = fill; c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, 7); c.fill(); }
function art(c, kind, x, y, t, flap, pose = IDLE) {
  if (kind === 0) artPikachu(c, x, y, t, pose);
  else if (kind === 1) artSnorlax(c, x, y, t, pose);
  else if (kind === 2) artCharizard(c, x, y, t, flap, pose);
  else if (kind === 3) artChikorita(c, x, y, t, pose);
  else if (kind === 4) artVulpix(c, x, y, t, pose);
  else if (kind === 5) artRowlet(c, x, y, t, pose);
  else if (kind === 6) artMagikarp(c, x, y, t, pose);
  else if (kind === 7) artAsh(c, x, y, t, pose);
  else if (kind === 8) artMachamp(c, x, y, t, pose, !!pose.gmax);
  else if (kind === 9) artGengar(c, x, y, t, pose);
  else if (kind === 10) artJigglypuff(c, x, y, t, pose);
  else if (kind === DUMMY) artDummy(c, x, y);

// The practice dummy: a wooden stump with a target painted on it, planted in the ground.
function artDummy(c, x, y) {
  c.save(); c.translate(x, y);
  poly(c, [[-13, 26], [-15, -8], [15, -8], [13, 26]], '#8a5a2e');            // the trunk
  c.strokeStyle = 'rgba(50,30,10,.5)'; c.lineWidth = 1; c.beginPath();         // bark
  for (const bx of [-8, -2, 5, 10]) { c.moveTo(bx, -6); c.lineTo(bx * 1.05, 24); }
  c.stroke();
  ov(c, 0, -8, 15, 6, '#c9985a');                                            // the cut top
  ov(c, 0, -8, 9, 3.4, '#b3834a', 0, 'rgba(70,45,15,.5)'); ov(c, 0, -8, 3.4, 1.4, '#9a6e3a', 0, null);
  ov(c, 0, 8, 10.5, 10.5, '#f4f4f4');                                        // a target on the front
  ov(c, 0, 8, 7.8, 7.8, '#d9322b', 0, null); ov(c, 0, 8, 5, 5, '#f4f4f4', 0, null); ov(c, 0, 8, 2.4, 2.4, '#d9322b', 0, null);
  ov(c, 0, 27, 17, 4.5, 'rgba(0,0,0,.28)', 0, null);                         // earth round its foot
  c.restore();
}

// ---- Pikachu and Snorlax: one drawing per view ----
// pose.dir is the way the character faces on screen (0 down = towards you, 1 up = its back, 2 left, 3 right),
// pose.mv is 0..1 while it is running and pose.ph the stride phase that drives the legs, arms and bounce.
const IDLE = { dir: 0, mv: 0, ph: 0 };
const OUTLINE = 'rgba(40,25,5,.55)';
function ov(c, x, y, rx, ry, fill, rot = 0, line = OUTLINE) { // an outlined ellipse
  c.fillStyle = fill; c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, 7); c.fill();
  if (line) { c.strokeStyle = line; c.lineWidth = 0.8; c.stroke(); }
}
function poly(c, pts, fill, line = OUTLINE) {
  c.fillStyle = fill; c.beginPath(); pts.forEach(([px, py], i) => (i ? c.lineTo(px, py) : c.moveTo(px, py))); c.closePath(); c.fill();
  if (line) { c.strokeStyle = line; c.lineWidth = 0.8; c.lineJoin = 'round'; c.stroke(); }
}
function eye(c, x, y, rx, ry) { ov(c, x, y, rx, ry, '#1d1d1d', 0, null); ov(c, x + rx * 0.3, y - ry * 0.35, rx * 0.4, rx * 0.4, '#fff', 0, null); }

// Pikachu's lightning-bolt tail, rooted at (bx, by) and leaning rot radians; the root is brown.
function pikaTail(c, bx, by, rot, k = 1) {
  c.save(); c.translate(bx, by); c.rotate(rot); c.scale(k, k);
  poly(c, [[-3, 0], [-5, -8], [1, -9], [-3, -17], [3, -18], [-1, -27], [14, -33], [11, -22], [16, -21], [7, -11], [11, -10], [4, 0]], '#f7cf3a');
  poly(c, [[-3, 0], [4, 0], [5, -4], [-4, -4]], '#7a4a1e');
  c.restore();

function artPikachu(c, x, y, t, pose) {
  const { dir, mv, ph } = pose, sw = Math.sin(ph) * mv, bob = -Math.abs(Math.sin(ph)) * 2.2 * mv;

  const wag = Math.sin(t * (6 + 8 * mv)) * 0.3; // the tail wags all the time, quicker when running
  const twitch = Math.sin(t * 3) * 0.06;
  c.save(); c.translate(x, y + bob);
  if (dir === 2) c.scale(-1, 1);
  if (mv > 0.2) pikaCrawl(c, dir, sw, wag, twitch); // running: down on all fours
  else if (dir === 0 || dir === 1) {
    const back = dir === 1;
    if (!back) pikaTail(c, 8, 10, 0.5 + wag);
    ov(c, -6, 15 - Math.max(0, sw) * 3, 4.5, 3, Y); ov(c, 6, 15 - Math.max(0, -sw) * 3, 4.5, 3, Y);
    ov(c, 0, 6, 10, 9.5, Y);
    if (back) { ov(c, 0, 3, 6.5, 1.3, BR, 0, null); ov(c, 0, 7, 6.5, 1.3, BR, 0, null); }
    ov(c, -9.5, 6 + sw * 2, 3, 4.8, Y, 0.2); ov(c, 9.5, 6 - sw * 2, 3, 4.8, Y, -0.2);
    for (const m of [-1, 1]) { // ears behind the head, black tips
      ov(c, m * 10, -20, 3.6, 9, Y, m * 0.35 + twitch * m); ov(c, m * 12.6, -27, 3.2, 3.6, '#222', m * 0.35 + twitch * m, null);
    }
    ov(c, 0, -6, 13, 11, Y);
    if (!back) {
      eye(c, -5, -8, 2.2, 2.8); eye(c, 5, -8, 2.2, 2.8);
      ov(c, 0, -4.8, 1, 0.7, '#222', 0, null);
      c.strokeStyle = '#222'; c.lineWidth = 0.9; c.beginPath(); c.arc(0, -4, 2.4, 0.2 * Math.PI, 0.8 * Math.PI); c.stroke();
      ov(c, -9.5, -2, 3, 2.7, RED, 0, null); ov(c, 9.5, -2, 3, 2.7, RED, 0, null);
    }
    if (back) pikaTail(c, 1, 12, wag * 0.8, 0.8);
  } else { // side view, facing right
    pikaTail(c, -8, 10, -0.5 + wag);
    ov(c, -5 + sw * 5, 15 - Math.max(0, sw) * 2, 4.5, 3, Y); ov(c, 5 - sw * 5, 15 - Math.max(0, -sw) * 2, 4.5, 3, Y);
    ov(c, -1, 6, 9, 9.5, Y);
    ov(c, -3, -20, 3.4, 8.5, Y, -0.5 + twitch); ov(c, -5.6, -27, 3, 3.4, '#222', -0.5 + twitch, null);
    ov(c, 2, -20, 3.4, 8.5, Y, -0.25 + twitch); ov(c, 0.6, -27.5, 3, 3.4, '#222', -0.25 + twitch, null);
    ov(c, 2, -6, 12, 10.5, Y);
    eye(c, 7.5, -8, 2, 2.6);
    ov(c, 13.6, -5.5, 0.9, 0.8, '#222', 0, null);
    c.strokeStyle = '#222'; c.lineWidth = 0.9; c.beginPath(); c.arc(11, -3.5, 2, 0.1 * Math.PI, 0.7 * Math.PI); c.stroke();

    ov(c, 3 + sw * 2, 6, 3, 5, Y, 0.1);
  }

}

// Running Pikachu goes down on all fours: hands and feet both hit the ground, in turn (sw is the stride, -1..1).
// Seen from the side the diagonal pairs move together; seen from the front or the back the hands and feet
// come and go alternately, the near pair drawn bigger.
function pikaLimb(c, x0, y0, len, ang, w, fill) { // a leg or arm hanging at angle ang from (x0, y0), with a paw
  const cx = x0 + Math.sin(ang) * len / 2, cy = y0 + Math.cos(ang) * len / 2;
  ov(c, cx, cy, w, len / 2 + 1, fill, -ang);
  ov(c, x0 + Math.sin(ang) * len, y0 + Math.cos(ang) * len, w + 0.8, w * 0.8, fill, -ang);
}
function pikaCrawl(c, dir, sw, wag, twitch) {
  const Y = '#f7cf3a', YD = '#d9b030', RED = '#e8362f', BR = '#7a4a1e';
  const up = (v) => Math.max(0, v); // how far a paw is lifted off the ground
  if (dir === 2 || dir === 3) { // side view, running to the right (a left run is this one mirrored)
    const a = sw * 0.9;
    pikaTail(c, -12, 4, -0.9 + wag * 0.7);
    pikaLimb(c, 6, 9, 8, -a + 0.2, 2.6, YD); pikaLimb(c, -8, 10, 8, a - 0.1, 2.6, YD); // the far pair
    ov(c, -1, 6, 12.5, 7.5, Y, -0.05);
    ov(c, -4, 0, 5.5, 1.1, BR, 0.1, null); ov(c, -9, 1.5, 4, 1.1, BR, 0.1, null);
    for (const o of [0, 3]) { // two ears swept back
      const rot = -1 - o * 0.06 + twitch, ex = 5 + o, ey = -7, ry = 8;
      ov(c, ex, ey, 3, ry, Y, rot); ov(c, ex + Math.sin(rot) * ry * 0.85, ey - Math.cos(rot) * ry * 0.85, 2.8, 3.2, '#222', rot, null);
    }
    ov(c, 11, 2, 10, 8.5, Y);
    eye(c, 15, 0, 1.9, 2.4); ov(c, 20.4, 2.6, 0.9, 0.8, '#222', 0, null);
    c.strokeStyle = '#222'; c.lineWidth = 0.9; c.beginPath(); c.arc(17.5, 4.5, 2, 0.1 * Math.PI, 0.7 * Math.PI); c.stroke();
    ov(c, 12.5, 5.5, 2.7, 2.4, RED, 0, null);
    pikaLimb(c, 7, 9, 8, a + 0.2, 2.8, Y); pikaLimb(c, -8, 10, 8, -a - 0.1, 2.8, Y); // the near pair
    return;
  }
  const back = dir === 1;
  if (!back) { // coming towards you
    pikaTail(c, 6, 4, 0.6 + wag);
    ov(c, -8, 13 - up(sw) * 3, 4, 2.6, YD); ov(c, 8, 13 - up(-sw) * 3, 4, 2.6, YD);
    ov(c, 0, 5, 10, 8, Y);
    for (const m of [-1, 1]) { ov(c, m * 10, -12, 3.4, 8, Y, m * 0.8 + twitch * m); ov(c, m * 14.4, -17, 3, 3.3, '#222', m * 0.8 + twitch * m, null); }
    ov(c, 0, -1, 12.5, 10, Y);
    eye(c, -5, -3, 2.2, 2.8); eye(c, 5, -3, 2.2, 2.8);
    ov(c, 0, 0.5, 1, 0.7, '#222', 0, null);
    c.strokeStyle = '#222'; c.lineWidth = 0.9; c.beginPath(); c.arc(0, 1.2, 2.4, 0.2 * Math.PI, 0.8 * Math.PI); c.stroke();
    ov(c, -9.5, 3.2, 3, 2.7, RED, 0, null); ov(c, 9.5, 3.2, 3, 2.7, RED, 0, null);
    ov(c, -9, 11 + sw * 3, 3.4 + up(sw) * 1.2, 3.1, Y); ov(c, 9, 11 - sw * 3, 3.4 + up(-sw) * 1.2, 3.1, Y);
  } else { // running away
    for (const m of [-1, 1]) { ov(c, m * 9, -12, 3.2, 7.5, Y, m * 0.7 + twitch * m); ov(c, m * 12.8, -16.5, 2.8, 3.1, '#222', m * 0.7 + twitch * m, null); }
    ov(c, 0, -4, 11, 9, Y);
    ov(c, -8.5, -2 + sw * 2.5, 3, 2.8, YD); ov(c, 8.5, -2 - sw * 2.5, 3, 2.8, YD);
    ov(c, 0, 6, 10.5, 8.5, Y);
    ov(c, 0, 3, 6.5, 1.3, BR, 0, null); ov(c, 0, 7, 6.5, 1.3, BR, 0, null);
    ov(c, -8, 14 - up(sw) * 3, 5, 3.3, Y); ov(c, 8, 14 - up(-sw) * 3, 5, 3.3, Y);
    pikaTail(c, 1, 10, wag * 0.8, 0.85);
  }
}

function artSnorlax(c, x, y, t, pose) {
  const { dir, mv, ph } = pose, sw = Math.sin(ph) * mv;
  const bob = -Math.abs(Math.sin(ph)) * 2 * mv + Math.sin(t * (pose.sleep ? 1.4 : 2)) * (pose.sleep ? 1.6 : 0.5); // a waddle when running, slow breathing at rest (slower and deeper asleep)
  const D = '#34667c', DD = '#27505f', C = '#efe3c4', K = '#1d2a30';
  c.save(); c.translate(x, y + bob); c.rotate(sw * 0.05 + (pose.sleep ? 0.12 : 0)); // asleep it slumps to one side
  if (dir === 2) c.scale(-1, 1);

// Ash Ketchum of Pallet Town: black hair under a red-and-white cap, a blue jacket with white sleeves, black fingerless

  else {

// Gyarados, the red one: a long coiled body in red with a cream belly and gold fins, rising behind a snarling head with

  c.save(); c.translate(x, y + bob);

  const ring = [...(pose.whip ? [] : [[-34, 24, 7.5]]), [-31, 12, 10], [-23, 4, 12.5], [-12, 2, 14], [-2, -8, 14.5], [5, -20, 14]];

  });
  if (!pose.whip) poly(c, [[-37, 27], [-48, 20], [-43, 30], [-50, 36], [-38, 32]], RD); // the tail fan (it is out swinging during a whip)
  // the head: long, with the mouth open

  poly(c, [[3, 4], [19, 5], [18, 8], [4, 7]], '#4a0b10', null); // the inside of the mouth
  poly(c, [[7, 4.5], [9.5, 4.5], [8.2, 9]], FANG, null); poly(c, [[13, 4.8], [15.5, 4.8], [14.2, 9.5]], FANG, null); // fangs
  ov(c, 4, -2, 3.8, 3.6, '#ffe58a'); poly(c, [[4, -5.2], [5.2, -2], [4, 1.2], [2.8, -2]], '#1d1d1d', null); // the slit eye
  poly(c, [[-1, -6], [9, -6], [10, -4.6], [0, -3.6]], RD, null); // the heavy brow

  c.restore();
  c.restore();
}

// A tail along a cubic bezier given as [x0,y0, x1,y1, x2,y2, x3,y3], w0 wide at its root and w1 at its tip.
function bezTail(c, p, w0, w1, col) {
  const q = (u) => { const m = 1 - u; return [m * m * m * p[0] + 3 * m * m * u * p[2] + 3 * m * u * u * p[4] + u * u * u * p[6], m * m * m * p[1] + 3 * m * m * u * p[3] + 3 * m * u * u * p[5] + u * u * u * p[7]]; };
  const N = 16; c.lineCap = 'round'; c.strokeStyle = col;
  for (let k = 0; k < N; k++) { const a = q(k / N), b = q((k + 1) / N); c.lineWidth = w0 + (w1 - w0) * (k + 0.5) / N; c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke(); }
}

// Charizard seen from the front: orange body and cream belly, a flame at the tail tip and two big teal wings. The wings beat all

    el(c, 55.5, -8.5, 2.6, 2.6, '#f6d58a'); // the claw at the wing's tip

    zigSeed(f.x + Math.cos(ang) * r0, f.y + Math.sin(ang) * r0, f.x + Math.cos(ang) * r1, f.y + Math.sin(ang) * r1, 4, 12 * sc, s + 7);
  }
  ctx.restore();
}

// A frozen player sits inside an iceberg; in its last half second the ice flickers and cracks.
function drawFrozen(p, i, d) {
  if (!(p.fz > 0)) return;
  const r = Math.max(bodyR(p) * 1.9, 30), melting = p.fz < 0.5;
  const a = melting ? 0.45 + 0.35 * Math.abs(Math.sin(p.fz * 30)) : 0.8;
  const pts = [[-1.1, 0.75], [-0.85, -0.15], [-0.5, 0.05], [-0.25, -1.0], [0.1, -0.35], [0.45, -0.85], [0.8, -0.05], [1.1, 0.75]];
  upright(d.x, d.y, () => {
    ctx.save(); ctx.translate(0, -d.z - r * 0.15); ctx.scale(r, r);
    const g = ctx.createLinearGradient(0, -1, 0, 0.8);
    g.addColorStop(0, `rgba(245,252,255,${a})`); g.addColorStop(1, `rgba(120,200,240,${a * 0.85})`);
    ctx.fillStyle = g; ctx.strokeStyle = `rgba(255,255,255,${Math.min(1, a + 0.2)})`; ctx.lineWidth = 2.5 / r; ctx.lineJoin = 'round';
    ctx.beginPath(); pts.forEach(([x, y], n) => (n ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = `rgba(255,255,255,${a * 0.8})`; ctx.lineWidth = 1.5 / r; // facets
    ctx.beginPath(); ctx.moveTo(-0.25, -1.0); ctx.lineTo(-0.1, 0.1); ctx.lineTo(0.1, -0.35); ctx.moveTo(-0.1, 0.1); ctx.lineTo(0, 0.75); ctx.stroke();
    if (melting) { ctx.strokeStyle = `rgba(60,110,150,${a})`; ctx.beginPath(); ctx.moveTo(-0.5, -0.1); ctx.lineTo(-0.2, 0.2); ctx.lineTo(-0.3, 0.5); ctx.moveTo(0.4, -0.3); ctx.lineTo(0.2, 0.1); ctx.stroke(); }
    ctx.restore();
  });
}

// The moment of freezing: a flash and shards of ice flying out.
function drawFreezeBurst(f) {
  const k = f.age / 0.6, a = 1 - k;
  ctx.save();
  ctx.fillStyle = `rgba(235,250,255,${0.7 * a * a})`;
  ctx.beginPath(); ctx.arc(f.x, f.y, 30 + 50 * k, 0, 7); ctx.fill();
  ctx.fillStyle = `rgba(190,232,255,${a})`; ctx.strokeStyle = `rgba(255,255,255,${a})`; ctx.lineWidth = 1.5;
  for (let s = 0; s < 12; s++) {
    const ang = s * 0.5236 + (s % 3) * 0.1, dd = 15 + (50 + 25 * (s % 3)) * (1 - (1 - k) * (1 - k)), sz = 7 + (s % 4) * 2;
    ctx.save(); ctx.translate(f.x + Math.cos(ang) * dd, f.y + Math.sin(ang) * dd); ctx.rotate(ang + k * 3);
    ctx.beginPath(); ctx.moveTo(sz, 0); ctx.lineTo(0, sz * 0.4); ctx.lineTo(-sz * 0.7, 0); ctx.lineTo(0, -sz * 0.4); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

// Frost Field's iceberg bursting: a white flash the size of the blast, a ring running out to its edge, and shards flying out.
function drawIceBurst(f) {
  const R = f.r, k = f.age / 0.6, a = 1 - k, out = 1 - (1 - k) * (1 - k);
  ctx.save();
  const disc = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, R);
  disc.addColorStop(0, `rgba(255,255,255,${0.85 * a})`); disc.addColorStop(0.6, `rgba(170,225,255,${0.45 * a})`); disc.addColorStop(1, `rgba(120,200,255,${0.1 * a})`);
  ctx.fillStyle = disc; ctx.beginPath(); ctx.arc(f.x, f.y, R, 0, 7); ctx.fill();
  ctx.strokeStyle = `rgba(225,248,255,${a})`; ctx.lineWidth = 6 * a + 1;
  ctx.beginPath(); ctx.arc(f.x, f.y, R * Math.min(1, k * 2.5), 0, 7); ctx.stroke();
  ctx.fillStyle = `rgba(200,238,255,${a})`; ctx.strokeStyle = `rgba(255,255,255,${a})`; ctx.lineWidth = 1.5;
  for (let s = 0; s < 18; s++) {
    const ang = s * 0.349 + (s % 3) * 0.08, dd = R * (0.25 + 0.7 * ((s * 5) % 7) / 6) * out, sz = 9 + (s % 4) * 3;
    ctx.save(); ctx.translate(f.x + Math.cos(ang) * dd, f.y + Math.sin(ang) * dd); ctx.rotate(ang + k * 4);
    ctx.beginPath(); ctx.moveTo(sz, 0); ctx.lineTo(0, sz * 0.4); ctx.lineTo(-sz * 0.7, 0); ctx.lineTo(0, -sz * 0.4); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

// The iceberg Vulpix rides: a little ice mountain, frost_field.radius x scale wide (the scale is looks only; the server hits
// with the radius). It stands upright on screen whichever way the arena is turned: a platform of ice with three peaks
// behind Vulpix, each lit on its left face and shaded on its right, snow on the tips.
function drawIceberg(d, p) {
  const R = frostCfg.radius * frostCfg.scale, t = performance.now() / 1000;
  const by = (bodyR(p) || 14) * 0.9; // where Vulpix's feet are, below its centre
  upright(d.x, d.y, () => {
    ctx.translate(0, Math.sin(t * 9) * R * 0.015); // it rocks a little as it slides
    ctx.lineJoin = 'round';
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(0, by + R * 0.12, R * 1.15, R * 0.42, 0, 0, 7); ctx.fill();
    // [centre x, half width, height] of the peaks, the small ones first so the big one overlaps them
    for (const [cx, w, h, k] of [[-0.62, 0.5, 0.85, 1], [0.7, 0.42, 0.62, 2], [0.02, 0.62, 1.35, 3]]) {
      const x = cx * R, hw = w * R, hh = h * R, ax = x + (seeded(k * 3.1) - 0.5) * hw * 0.4, ay = by - hh, rx = x + hw * 0.12;
      ctx.beginPath(); ctx.moveTo(x - hw, by); ctx.lineTo(x - hw * 0.5, by - hh * 0.5); ctx.lineTo(ax - hw * 0.12, ay + hh * 0.12); ctx.lineTo(ax, ay); ctx.lineTo(rx, by); ctx.closePath();
      let g = ctx.createLinearGradient(x - hw, ay, rx, by); g.addColorStop(0, '#f4fdff'); g.addColorStop(1, '#a9defa');
      ctx.fillStyle = g; ctx.fill();
      ctx.beginPath(); ctx.moveTo(rx, by); ctx.lineTo(ax, ay); ctx.lineTo(ax + hw * 0.18, ay + hh * 0.3); ctx.lineTo(x + hw * 0.55, by - hh * 0.5); ctx.lineTo(x + hw, by); ctx.closePath();
      g = ctx.createLinearGradient(ax, ay, x + hw, by); g.addColorStop(0, '#7cc4ee'); g.addColorStop(1, '#3f86c9');
      ctx.fillStyle = g; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = Math.max(1, R * 0.025);
      ctx.beginPath(); ctx.moveTo(x - hw, by); ctx.lineTo(x - hw * 0.5, by - hh * 0.5); ctx.lineTo(ax - hw * 0.12, ay + hh * 0.12); ctx.lineTo(ax, ay); ctx.lineTo(ax + hw * 0.18, ay + hh * 0.3); ctx.lineTo(x + hw * 0.55, by - hh * 0.5); ctx.lineTo(x + hw, by); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(rx, by); ctx.stroke(); // the ridge between the faces
      ctx.fillStyle = 'rgba(255,255,255,.96)'; // snow on the tip
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax - hw * 0.3, ay + hh * 0.27); ctx.lineTo(ax - hw * 0.08, ay + hh * 0.2); ctx.lineTo(ax + hw * 0.1, ay + hh * 0.31); ctx.lineTo(ax + hw * 0.3, ay + hh * 0.28); ctx.closePath(); ctx.fill();
    }
    // the platform the mountain stands on, with Vulpix in front of it
    const g = ctx.createLinearGradient(-R, by, R, by + R * 0.3); g.addColorStop(0, '#e8f9ff'); g.addColorStop(0.6, '#9ad4f4'); g.addColorStop(1, '#5aa2dc');
    ctx.fillStyle = g; ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = Math.max(1.5, R * 0.03);
    ctx.beginPath(); ctx.ellipse(0, by + R * 0.06, R * 1.08, R * 0.34, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = Math.max(1, R * 0.02);
    ctx.beginPath(); ctx.ellipse(0, by + R * 0.06, R * 0.7, R * 0.2, 0, 0, 7); ctx.stroke();
  });
}

// Gyarados's wave: a ring of surf running out from where it landed at the wave's speed, up to its radius.
function drawWave(f) {
  const r0 = 6, R = Math.min(f.r, r0 + waveCfg.speed * f.age), a = Math.max(0, 1 - Math.max(0, R - f.r * 0.6) / (f.r * 0.4 + 1e-6));
  ctx.save();
  const disc = ctx.createRadialGradient(f.x, f.y, Math.max(0, R * 0.6), f.x, f.y, R);
  disc.addColorStop(0, 'rgba(120,200,255,0)'); disc.addColorStop(1, `rgba(120,200,255,${0.28 * a})`);
  ctx.fillStyle = disc; ctx.beginPath(); ctx.arc(f.x, f.y, R, 0, 7); ctx.fill();
  ctx.lineCap = 'round';
  ctx.strokeStyle = `rgba(235,250,255,${0.9 * a})`; ctx.lineWidth = 7; // the crest, with foam on it
  ctx.beginPath(); ctx.arc(f.x, f.y, R, 0, 7); ctx.stroke();
  ctx.strokeStyle = `rgba(90,170,235,${0.7 * a})`; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(f.x, f.y, Math.max(0, R - 9), 0, 7); ctx.stroke();
  ctx.fillStyle = `rgba(255,255,255,${0.85 * a})`;
  for (let k = 0; k < 28; k++) { const ang = k * 0.2244 + seeded(k * 3.3) * 0.15, rr = R + (seeded(k * 7.1) - 0.5) * 8; ctx.beginPath(); ctx.arc(f.x + Math.cos(ang) * rr, f.y + Math.sin(ang) * rr, 2 + seeded(k) * 2.4, 0, 7); ctx.fill(); }
  ctx.restore();
}

// Gyarados's tail whip: the tail itself, a thick red limb that narrows to a fin, lashes across the fan from one edge to
// the other (cocked back a little first, then fast and slowing), bent behind its tip the way a whip is, with a smear
// of the sweep behind it. It pivots on Gyarados's middle; the body is drawn without its own tail meanwhile.
const TAIL_SWING = 0.3; // seconds the tail takes to lash across
// The tail itself, a thick red limb that narrows to a fan fin: from the pivot (x, y) out to `L`, pointing at angle `tip`, its
// middle bent towards angle `mid` the way a whip trails behind its tip. Returns where the fin is (and which way it points).
function drawTailLimb(x, y, L, tip, mid, alpha) {
  const thick = Math.max(8, radius[11] * 0.5);
  const pt = (t) => { // a point along the tail, t 0..1: a curve from the pivot
    const c1 = [x + Math.cos(mid) * L * 0.55, y + Math.sin(mid) * L * 0.55], p2 = [x + Math.cos(tip) * L * 0.97, y + Math.sin(tip) * L * 0.97];
    return [(1 - t) * (1 - t) * x + 2 * (1 - t) * t * c1[0] + t * t * p2[0], (1 - t) * (1 - t) * y + 2 * (1 - t) * t * c1[1] + t * t * p2[1]];
  };
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // the tail: sampled along its curve, drawn fat to thin, dark outline under red, with a pale belly line
  const N = 16, pts = []; for (let i = 0; i <= N; i++) pts.push(pt(i / N));
  const w = (i) => thick * (1 - 0.7 * i / N);
  ctx.globalAlpha = alpha;
  for (const [col, extra] of [['#5c1014', 5], ['#d22a2a', 0]]) {
    for (let i = 0; i < N; i++) { ctx.strokeStyle = col; ctx.lineWidth = w(i + 0.5) + extra; ctx.beginPath(); ctx.moveTo(pts[i][0], pts[i][1]); ctx.lineTo(pts[i + 1][0], pts[i + 1][1]); ctx.stroke(); }
  }
  ctx.strokeStyle = '#f3e3ba'; ctx.lineWidth = Math.max(2, thick * 0.22); ctx.beginPath(); // the pale underside
  pts.slice(0, N - 2).forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.stroke();
  const [tx, ty] = pts[N], [px, py] = pts[N - 2], ta = Math.atan2(ty - py, tx - px), fin = thick * 1.5; // the fin at its tip
  ctx.save(); ctx.translate(tx, ty); ctx.rotate(ta);
  ctx.fillStyle = '#9a1c22'; ctx.strokeStyle = '#5c1014'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-fin * 0.15, 0); // a fan of rays with a scallop between each
  for (let q = 0; q <= 4; q++) { const ang = -1 + q * 0.5; ctx.lineTo(Math.cos(ang) * fin * 1.05, Math.sin(ang) * fin * 1.05); if (q < 4) ctx.lineTo(Math.cos(ang + 0.25) * fin * 0.65, Math.sin(ang + 0.25) * fin * 0.65); }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#f0c23a'; ctx.lineWidth = 2.5; ctx.beginPath(); // gold ribs along the rays
  for (let q = 0; q <= 4; q++) { const ang = -1 + q * 0.5; ctx.moveTo(fin * 0.1, 0); ctx.lineTo(Math.cos(ang) * fin * 0.95, Math.sin(ang) * fin * 0.95); }
  ctx.stroke();
  ctx.restore();
  ctx.restore();
  return { tx, ty, ta, fin };
}

function drawTailWhip(f) {
  const k = Math.min(1, f.age / TAIL_SWING), fade = f.age <= TAIL_SWING ? 1 : Math.max(0, 1 - (f.age - TAIL_SWING) / 0.15);
  const half = tailCfg.angle / 2 * Math.PI / 180, base = Math.atan2(f.dy || 0, f.dx || 0), L = f.r; // a zero component is left out of the event, hence the || 0
  const cock = 0.12, from = base - half; // the first part of the swing winds back a little
  const s2 = k < cock ? 0 : (k - cock) / (1 - cock); // 0..1 over the lash itself
  const tip = k < cock ? from - half * 0.15 * Math.sin(Math.PI * k / cock) : from + 2 * half * (1 - Math.pow(1 - s2, 2.2)); // fast, then slow
  const mid = tip - 0.9 * (1 - s2) * (k < cock ? 0 : 1); // the middle of the tail trails behind the tip
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // where it can reach, and the smear the tail has left on the way
  ctx.fillStyle = `rgba(255,170,80,${0.12 * fade})`; ctx.strokeStyle = `rgba(255,220,150,${0.35 * fade})`; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.arc(f.x, f.y, L, base - half, base + half); ctx.closePath(); ctx.fill(); ctx.stroke();
  const sweep = ctx.createRadialGradient(f.x, f.y, L * 0.2, f.x, f.y, L);
  sweep.addColorStop(0, `rgba(255,230,190,0)`); sweep.addColorStop(1, `rgba(255,236,200,${0.45 * fade})`);
  ctx.fillStyle = sweep; ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.arc(f.x, f.y, L, from, Math.max(from, tip)); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = `rgba(255,250,230,${0.8 * fade})`; ctx.lineWidth = 5 * (1 - k) + 1; // the streak at the tip's end of the smear
  ctx.beginPath(); ctx.arc(f.x, f.y, L * 0.95, Math.max(from, tip - 0.7), Math.max(from, tip)); ctx.stroke();
  ctx.restore();
  const { tx, ty, ta, fin } = drawTailLimb(f.x, f.y, L, tip, mid, fade);
  ctx.save(); ctx.lineCap = 'round';
  // the crack of it: white flashes at the tip while it is going fast
  if (k > cock && k < 0.7) { ctx.strokeStyle = `rgba(255,255,255,${0.9 * (1 - k)})`; ctx.lineWidth = 2; for (let q = -1; q <= 1; q++) { ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(tx + Math.cos(ta + q * 0.9) * fin * 1.4, ty + Math.sin(ta + q * 0.9) * fin * 1.4); ctx.stroke(); } }
  ctx.restore();
}

// The tail whip winding up: the fan it will hit is drawn on the ground, where the opponent can see what to keep out of, filling
// with colour as the wind-up runs out; a ring runs out to the edge of it so the moment of the hit can be read, and the tail is
// cocked back at one side of the fan.

// Jigglypuff's ground blows: a big black-and-white flickering palm sweeps across the fan the blow hits (a right hand from its right side to its left, a left hand the other way), leaving afterimages,
// and stays a moment where it landed. `palm_scale` (hi.slap.pscale) sizes it; 0 = none. Only the picture: the hit is the server's fan.
function drawSlapPalm(p, d) {
  if (!p || !(slapCfg.pscale > 0) || p.jpa || !d || d.x === null) return;
  const dur = Math.max(slapCfg.dur[p.jpn] || slapCfg.dur[0], 1e-6), half = slapCfg.angle / 2 * Math.PI / 180, base = Math.atan2(p.sly, p.slx);
  let right, s, fade = 1;
  if (p.slt > 0) {
    const kk = 1 - p.slt / dur, dbl = p.jpn === 2 || p.jpn === 3, sub = dbl ? (kk * 2) % 1 : kk;
    if (sub < 0.5) return; // still raised: the palm shows as the swing comes down
    right = p.jpn === 0 || p.jpn === 4 || (dbl && kk < 0.5);
    s = (sub - 0.5) / 0.5;
  } else if (p.slr > 0 && (p.jpp === 0 || p.jpp === 3)) {
    right = p.jpp !== 3; s = 1; fade = Math.min(1, p.slr / 0.2);
  } else return;
  const R = slapCfg.length * 0.2 * slapCfg.pscale, at = (t) => base + (right ? 1 : -1) * half * (1 - 2 * Math.min(Math.max(t, 0), 1));
  const flick = Math.floor(performance.now() / 45) % 2 === 0;
  ctx.save();
  ctx.lineCap = 'round'; ctx.strokeStyle = `rgba(255,255,255,${0.55 * fade})`; ctx.lineWidth = R * 0.5; // the streak the hand leaves
  ctx.beginPath(); ctx.arc(d.x, d.y, slapCfg.length * 0.72, at(Math.max(0, s - 0.35)), at(s), !right); ctx.stroke();
  for (let n = 4; n >= 0; n--) { // afterimages, then the palm itself
    const t = s - n * 0.08, head = n === 0, black = flick !== (n % 2 === 1), a = at(t), r = slapCfg.length * 0.72;
    ctx.save(); ctx.translate(d.x + Math.cos(a) * r, d.y + Math.sin(a) * r); ctx.rotate(a);
    ctx.globalAlpha = (head ? 1 : 0.5 - n * 0.09) * fade;
    ctx.fillStyle = black ? '#0b0b10' : '#fafafa'; ctx.strokeStyle = black ? '#fff' : '#000'; ctx.lineWidth = 3; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.roundRect(-R * 0.7, -R * 0.8, R * 1.4, R * 1.6, R * 0.4); ctx.fill(); ctx.stroke();       // the palm
    for (const g of [-0.62, -0.21, 0.21, 0.62]) { ctx.beginPath(); ctx.roundRect(R * 0.5, R * g - R * 0.17, R * 0.7, R * 0.34, R * 0.17); ctx.fill(); ctx.stroke(); } // the fingers, outward
    ctx.beginPath(); ctx.ellipse(-R * 0.15, R * (right ? -0.95 : 0.95), R * 0.32, R * 0.2, 0, 0, 7); ctx.fill(); ctx.stroke(); // the thumb
    ctx.restore();
  }
  ctx.restore();
}

function drawTailWarning(p, d) {
  if (!(p.tlt > 0)) return;
  const k = 1 - p.tlt / Math.max(tailCfg.charge, 1e-6), half = tailCfg.angle / 2 * Math.PI / 180, base = Math.atan2(p.tly, p.tlx), L = tailCfg.length;
  const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 70);
  ctx.save(); ctx.lineCap = 'round';
  ctx.fillStyle = `rgba(255,70,40,${0.12 + 0.3 * k})`; ctx.strokeStyle = `rgba(255,${120 + 80 * pulse | 0},60,${0.5 + 0.4 * k})`; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.arc(d.x, d.y, L, base - half, base + half); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = `rgba(255,235,200,${0.35 + 0.4 * k})`; ctx.lineWidth = 2; // the ring that reaches the edge as it hits
  ctx.beginPath(); ctx.arc(d.x, d.y, L * k, base - half, base + half); ctx.stroke();
  ctx.restore();
  const from = base - half, tip = from - half * 0.15 - 0.05 * pulse; // cocked back past the first edge, trembling
  drawTailLimb(d.x, d.y, L * 0.9, tip, tip - 0.3, 0.95);
}

// The tree, as an axe: the trunk (a rectangle) with the canopy (a half disc, or whatever sector) at the tip, drawn `scale` times
// bigger than what it hits. (x, y) is the foot (where it is gripped), `base` the way it points on the ground, `pitch` how far it
// is raised about the foot (0 = flat on the ground, PI/2 = standing straight up toward the top of the screen, whichever way the
// arena is turned) and `alpha` how solid it is.
const TREE_UP = 0.85; // how far up the screen a raised tree reaches, per unit of its length
function drawTreeArt(x, y, base, pitch, alpha, treeCfg) {
  const L = treeCfg.len, W = treeCfg.w * treeCfg.scale, R = treeCfg.leaf * treeCfg.leafscale, half = treeCfg.angle / 2 * Math.PI / 180, ts = treeCfg.scale;
  const th = ROT + base, cp = Math.cos(pitch), sp = Math.sin(pitch), len = L * ts;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.rotate(-ROT);
  ctx.save(); ctx.transform(Math.cos(th) * cp, Math.sin(th) * cp - TREE_UP * sp, -Math.sin(th), Math.cos(th), 0, 0); // the trunk, foreshortened as it rises
  ctx.fillStyle = '#6b4a2a'; ctx.strokeStyle = '#3d2814'; ctx.lineWidth = 2; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.rect(0, -W / 2, len, W); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(40,25,10,.45)'; ctx.lineWidth = 1.5; ctx.beginPath(); // bark
  for (const f of [-0.28, 0, 0.28]) { ctx.moveTo(len * 0.05, W * f); ctx.lineTo(len * 0.95, W * f); }
  ctx.stroke();
  ctx.restore();
  const ax = Math.cos(th) * cp, ay = Math.sin(th) * cp - TREE_UP * sp; // where the trunk points on screen
  ctx.translate(len * ax, len * ay); // the canopy stays a full disc, capping the trunk whichever way it points
  ctx.rotate(Math.atan2(ay, ax));
  ctx.fillStyle = '#3f9a3c'; ctx.strokeStyle = '#1f5f22'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R, -half, half); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(120,210,100,.45)';
  for (const [rr, aa] of [[0.55, -0.4], [0.7, 0.35], [0.4, 0.05], [0.8, -0.05]]) { ctx.beginPath(); ctx.arc(Math.cos(aa * half) * R * rr, Math.sin(aa * half) * R * rr, R * 0.14, 0, 7); ctx.fill(); }
  ctx.restore();

// Ice Storm: a swirl of snow the size of the strike area that chases the opponent. Each strike (an event) rings out from it.
function drawStorms() {
  for (const si of slotsOf(4)) {
    const p = snap.p[si], sl = stormLook[si];
    if (!(p.wn > 0)) { sl.x = null; continue; }
    if (sl.x === null) { sl.x = p.wx; sl.y = p.wy; }
    sl.x += (p.wx - sl.x) * 0.4; sl.y += (p.wy - sl.y) * 0.4;
    const R = stormCfg.radius, t = performance.now() / 1000;
    ctx.save();

    g.addColorStop(0, 'rgba(235,248,255,.55)'); g.addColorStop(0.65, 'rgba(150,205,245,.35)'); g.addColorStop(1, 'rgba(110,170,235,.08)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sl.x, sl.y, R, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(210,240,255,.8)'; ctx.lineWidth = 2.5; ctx.setLineDash([14, 10]); ctx.lineDashOffset = -t * 40;
    ctx.beginPath(); ctx.arc(sl.x, sl.y, R, 0, 7); ctx.stroke(); ctx.setLineDash([]);
    ctx.lineWidth = 3; ctx.lineCap = 'round'; // three arms of wind turning round the middle
    for (let arm = 0; arm < 3; arm++) {
      ctx.strokeStyle = `rgba(255,255,255,${0.55 - arm * 0.08})`; ctx.beginPath();
      for (let u = 0; u <= 1.001; u += 0.05) { const ang = t * 2.6 + arm * 2.094 + u * 2.4, rr = R * (0.12 + 0.82 * u); u ? ctx.lineTo(sl.x + Math.cos(ang) * rr, sl.y + Math.sin(ang) * rr) : ctx.moveTo(sl.x + Math.cos(ang) * rr, sl.y + Math.sin(ang) * rr); }
      ctx.stroke();
    }
    ctx.fillStyle = '#fff'; // snowflakes blown round it
    for (let n = 0; n < 22; n++) {
      const ang = t * (1.4 + seeded(n) * 1.2) + n * 2.4, rr = R * (0.2 + 0.78 * ((seeded(n * 7) + t * 0.15) % 1)), s = 1.6 + seeded(n * 3) * 2;

// Freeze Beam: from the mouth to the spot on the ground the stick steers, cut short where an opponent stops it (p.zex/zey); the ring is where

function drawFBeams() {
  for (const si of slotsOf(4)) {
    const p = snap.p[si], d = disp[si], fl = fbLook[si];
    if (!(p.zt > 0)) { fl.x = null; continue; }
    if (fl.x === null) { fl.x = p.zx; fl.y = p.zy; fl.ex = p.zex; fl.ey = p.zey; }
    fl.x += (p.zx - fl.x) * 0.5; fl.y += (p.zy - fl.y) * 0.5; fl.ex += (p.zex - fl.ex) * 0.5; fl.ey += (p.zey - fl.ey) * 0.5;
    const bs = radius[4] / REF[4], dir = look[si].dir, t = performance.now() / 1000;
    const [mx, my] = dir === 3 ? [11, -1] : dir === 2 ? [-11, -1] : dir === 1 ? [0, -7] : [0, 2]; // the mouth, upright and in body units
    const [ex, ey] = rv(fl.ex - d.x, fl.ey - d.y), [px, py] = rv(fl.x - d.x, fl.y - d.y), cut = Math.hypot(fl.ex - fl.x, fl.ey - fl.y) > 4, bw = Math.max(26, fbeamCfg.width);
    upright(d.x, d.y, () => {
      const x0 = mx * bs, y0 = -d.z + my * bs, len = Math.hypot(ex - x0, ey - y0) || 1, ux = (ex - x0) / len, uy = (ey - y0) / len;
      ctx.lineCap = 'round';
      for (const [w, col] of [[bw, 'rgba(110,185,255,.30)'], [bw / 2, 'rgba(185,232,255,.80)'], [Math.max(4.5, bw / 6), 'rgba(255,255,255,.95)']]) {
        ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(ex, ey); ctx.stroke();
      }
      ctx.fillStyle = '#fff'; // sparkles streaming along it
      for (let s = (t * 220) % 46; s < len; s += 46) { const o = Math.sin(s * 0.3 + t * 8) * 6; ctx.beginPath(); ctx.arc(x0 + ux * s - uy * o, y0 + uy * s + ux * o, 2.4, 0, 7); ctx.fill(); }
