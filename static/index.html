<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Battle Prototype</title>
<style>
  body { margin: 0; background: #14161c; color: #e8e8ea; font: 14px system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; }
  canvas { background: #2b3a2f; max-width: 100%; max-height: calc(100vh - 120px); margin-top: 12px; border: 2px solid #3d4a40; }
  #bar { padding: 10px 16px; text-align: center; line-height: 1.6; }
  code { background: #262a33; padding: 2px 6px; border-radius: 4px; word-break: break-all; }
  #bar:empty { display: none; }
  /* Portrait (the default, for phones): the canvas fills the screen and the pad is drawn over it. */
  html { touch-action: none; overscroll-behavior: none; }
  body.portrait { height: 100dvh; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  body.portrait canvas { margin: 0; border: 0; max-width: 100vw; max-height: 100dvh; }
  body.portrait #bar { position: fixed; top: 0; left: 0; right: 0; z-index: 2; background: #000b; padding: 6px 12px; font-size: 12px; }
  body.portrait #bar2 { display: none; }
  #unzoom { position: fixed; left: 0; top: 0; transform-origin: 0 0; z-index: 9; display: none; margin: 12px; padding: 10px 14px; border-radius: 8px; border: 2px solid #fff; background: #000c; color: #fff; font: bold 14px system-ui; }
  .stick, .btn { position: fixed; z-index: 3; border-radius: 50%; touch-action: none; user-select: none; -webkit-user-select: none; }
  .stick { left: 18px; bottom: 28px; width: 140px; height: 140px; background: #ffffff22; border: 2px solid #ffffff44; }
  .knob { position: absolute; left: 38px; top: 38px; width: 60px; height: 60px; border-radius: 50%; background: #ffffff88; pointer-events: none; }
  .btn { display: flex; align-items: center; justify-content: center; background: #ffffff2a; border: 2px solid #ffffff66; color: #fff; font-weight: bold; }
  .btn.on { background: #ffffff77; }
  .aimring, .aimdot { position: absolute; left: 50%; top: 50%; border-radius: 50%; pointer-events: none; display: none; }
  .aimring { width: 150px; height: 150px; margin: -75px 0 0 -75px; border: 2px dashed #ffffff88; }
  .aimdot { width: 26px; height: 26px; margin: -13px 0 0 -13px; background: #ffd27acc; }
  .btn.aim .aimring, .btn.aim .aimdot { display: block; }
  /* cooldown: a dark pie over the button, the part still to wait, shrinking clockwise from the top */
  /* character choice: shown from connecting until the match starts */
  #pick { position: fixed; inset: 0; z-index: 4; background: #14161c; display: none; flex-direction: column; align-items: center; padding: 56px 12px 12px; box-sizing: border-box; overflow-y: auto; touch-action: pan-y; }
  #rooms { position: fixed; inset: 0; z-index: 5; background: #14161c; display: none; flex-direction: column; align-items: center; padding: 56px 12px 12px; box-sizing: border-box; overflow-y: auto; }
  #rooms h2 { margin: 6px 0 12px; font-size: 20px; }
  #roomlist { display: flex; flex-direction: column; gap: 8px; width: min(420px, 100%); margin-bottom: 14px; }
  #rooms button { font: bold 15px system-ui; padding: 12px 16px; border-radius: 10px; border: 2px solid #3d4a40; background: #1b1f27; color: #eee; cursor: pointer; }
  #rooms button.stale { opacity: .5; border-style: dashed; }
  #rooms .hint { margin-top: 12px; font-size: 13px; opacity: .6; }
  #pick h2 { margin: 6px 0 12px; font-size: 20px; }
  #cards { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .card { width: 148px; border: 2px solid #3d4a40; border-radius: 12px; padding: 8px; background: #1b1f27; text-align: center; cursor: pointer; user-select: none; -webkit-user-select: none; }
  .card canvas { margin: 0; border: 0; width: 120px; height: 100px; border-radius: 8px; background: #2b3a2f; }
  .card b { display: block; margin-top: 6px; font-size: 16px; }
  .card small { display: block; margin-top: 4px; opacity: .75; line-height: 1.5; text-align: left; font-size: 12px; }
  .card.mine { border-color: #6fd36f; background: #243026; }
  #easebox { margin: 0 0 12px; text-align: center; line-height: 1.6; }
  #easebox input { width: 220px; vertical-align: middle; }
  #easemsg { font-size: 12px; opacity: .75; }
  #modes, #teambar, #botbar { display: flex; gap: 10px; margin: 0 0 12px; }
  #teambar { margin: 12px 0 0; }
  #pick button, #repick { font: bold 15px system-ui; padding: 9px 16px; border-radius: 10px; border: 2px solid #3d4a40; background: #1b1f27; color: #eee; cursor: pointer; }
  #pick button.on { border-color: #6fd36f; background: #243026; }
  #pick button:disabled { opacity: .4; cursor: default; }
  #repick { position: fixed; left: 50%; top: 56%; transform: translateX(-50%); z-index: 3; display: none; font-size: 18px; padding: 12px 26px; background: #243026; border-color: #6fd36f; }
  .card { position: relative; }
  .card .ord { position: absolute; top: 4px; left: 4px; min-width: 24px; height: 24px; line-height: 24px; border-radius: 12px; background: #6fd36f; color: #111; font: bold 15px/24px system-ui; font-style: normal; display: none; }
  #pickmsg { margin-top: 14px; text-align: center; line-height: 1.7; }
  .uses { position: absolute; top: -4px; right: -4px; min-width: 28px; padding: 2px 5px; border-radius: 14px; background: #f7cf3a; color: #222; font-size: 14px; text-align: center; pointer-events: none; }
  .uses.out { background: #888; color: #eee; }
  .cd { position: absolute; inset: 0; border-radius: 50%; pointer-events: none; background: conic-gradient(#000000b0 var(--cd, 0deg), transparent 0); }
</style>
</head>
<body>
<div id="bar"></div>
<div id="rooms"><h2>選擇房間</h2><div id="roomlist"></div><button id="newroom">開新房間</button><div class="hint">灰色表示對方可能已斷線；沒有人等待時會自動開房</div></div>
<div id="pick"><h2>選擇你的寶可夢</h2><div id="easebox"><label>放水 <b id="easeval">0%</b>　<input id="ease" type="range" min="0" max="90" step="10" value="0"></label><div id="easemsg"></div></div><div id="modes"><button id="mSingle">單場對戰</button><button id="mTeam">死鬥（依序上場）</button><button id="sz3">3 隻</button><button id="szAll">全部</button></div><div id="botbar"><button id="bot0">單機：對皮卡丘</button><button id="bot1">單機：對卡比獸</button><button id="botOff">改和真人對戰</button></div><div id="cards"></div><div id="teambar"><button id="tClear">清除順序</button><button id="tOk">確認出場順序</button></div><div id="pickmsg"></div></div>
<button id="repick">重選角色</button>
<canvas id="c" width="2000" height="1000"></canvas>
<div id="bar2" style="padding:8px 16px;opacity:.7"></div>
<script>
// Portrait is the default (phones): the two players are one above the other and you are always at the
// bottom, so the arena is turned a quarter turn, a different way for each player. Add ?landscape to the
// address for the wide view, with the players left and right.
const PORTRAIT = !new URLSearchParams(location.search).has('landscape');
document.body.classList.toggle('portrait', PORTRAIT);
const QUAKE_LIFE = 0.75; // seconds the earthquake effect stays on screen (also on a landing)
let ROT = 0;               // how far the arena is turned on screen (radians); 0 in landscape
let VIEW = [1, 0, 0, 1, 0, 0]; // world -> canvas matrix for ctx.transform
// Each player picks a character in the lobby; a snapshot's p[i].k says who is who (0 Pikachu, 1 Snorlax, 2 Charizard, 3 Chikorita, 4 Vulpix, 5 Rowlet).
// Everything below that belongs to one character looks that player up with slotOf, instead of assuming a slot.
const NAMES = ['皮卡丘', '卡比獸', '噴火龍', '菊草葉', '六尾', '木木梟', '鯉魚王'];
const FORMS = [...NAMES, '紅色暴鯉龍']; // every kind a player can be in: Magikarp becomes the last one (nobody picks it)
const BLURB = ['伏特攻擊・打雷・電球', '跳躍落地震・破壞死光・急凍拳', '飛行・噴火・地球上投', '葉刃連斬・飛葉快刀・藤鞭', '冰山滑行・冰風暴・急凍光線', '滑翔・箭雨・龍捲風', '彈跳・彈跳五次進化成暴鯉龍'];
const HELP = [
  '你是皮卡丘　移動 WASD　空白鍵＝伏特攻擊（全身纏繞閃電朝按住的方向衝刺，可連續使用數次，撞到敵人會使其麻痺無法移動；比地球上投和急凍拳輕，對撞時會輸）　J＝打雷（朝天空放電並在敵人頭上落雷，施放期間無法移動，陰影會追著敵人）　K＝電球（續能後自動朝敵人所在方向丟出，碰到敵人、牆或被打爆時爆炸）',
  '你是卡比獸　移動 WASD　空白鍵＝跳躍（落地壓人，附地震特效）　J＝破壞死光（朝敵人所在方向扇形掃射，蓄力與掃射時定身，之後硬直）　K＝急凍拳（蓄力時按 WASD 決定方向，朝該方向衝拳，打到的敵人被冰凍）',
  '你是噴火龍　移動 WASD　空白鍵＝飛行（一段時間在半空，移動更快，但仍會被電球和急凍拳打到）　J＝噴火（自動朝敵人噴出一串小火球，可以邊走邊噴）　K＝地球上投（全身著火朝按住的方向衝刺，撞到敵人就抓上天再摔下）',
  '你是菊草葉　移動 WASD　空白鍵＝葉刃連斬（朝按住的方向跳一大步，落地不傷人，接著甩動頭上的葉子連斬數下，每一下都朝敵人前進，葉子掃到的人會受傷）　J＝飛葉快刀（在身邊灑出一堆樹葉，各自等一下後朝敵人射出）　K＝藤鞭（朝搖桿方向左右各揮出一條藤鞭在前方會合，被打中的敵人一段時間不能走路也不能用位移技能）',
  '你是六尾　移動 WASD　空白鍵＝冰山滑行（踩著冰山快速滑動，停不下來，WASD 控制方向；經過的地面結冰，站在自己的冰上走得更快、敵人踩上去會變慢；冰山撞到敵人或時間到就爆炸）　J＝冰風暴（風暴從身上出發追著敵人跑，定時打擊，每打中幾次就把敵人冰住）　K＝急凍光線（站定不動，WASD 或搖桿改成移動光線落點，光線不傷人，掃過的地面會長出冰柱擋住敵人）',
  '你是木木梟　移動 WASD　一直飛在空中，只有打得到這個高度的招式才打得到你　空白鍵＝滑翔（朝按住的方向衝出一道半月形弧線，彎向敵人那一側）　J＝箭雨（朝敵人扇形射出一排綠色弓箭，射中的敵人受傷並變慢）　K＝龍捲風（蓄力後在前方放出龍捲風，自動追著敵人跑，捲到就把敵人捲上天旋轉、最後摔下來；龍捲風可以被打壞）',
  '你是鯉魚王　移動 WASD　空白鍵＝彈跳（跳到半空並在最高點停一會兒再落下，打不到那麼高的招式都打不到你，落地不傷人；每落地一次算一次，累計彈跳 5 次就會進化成紅色暴鯉龍）　沒有其他技能',
  '你是紅色暴鯉龍　移動 WASD　空白鍵＝海浪（短暫跳起震動地面，海浪朝四面八方擴散，打到地面上的敵人）　J＝破壞死光（和卡比獸一樣）　K＝擺尾（朝 WASD 按住的方向掃出一個扇形，被掃到的敵人被擊退並擊暈，暈的時候不能動也不能出招）',
];
const ghosts = []; // dash afterimages
const beamLook = [{ ang: null, tail: null }, { ang: null, tail: null }]; // per slot: the smoothed beam angle, and the fading afterimage when a sweep ends
const TAIL = 0.2; // seconds
let beamCfg = { len: 450, w: 50, charge: 0.6, angle: 30 }, gbeamCfg = beamCfg; // Snorlax's and Gyarados's Hyper Beam, replaced by the server's values in 'hi'
const beamCfgOf = (k) => (k === 7 ? gbeamCfg : beamCfg);
let thunderCfg = { radius: 60, delay: 1, interval: 0.5, strikes: 3 }; // likewise
// Body sizes from 'hi' (world units). The art below was drawn at REF, so it is scaled by radius / REF;
// that is also the size the server hits with, and it does not depend on the court's size.
let radius = [16, 24, 26, 18, 14, 13]; // indexed by character
const REF = [16, 24, 26, 18, 14, 13, 10, 36];
let maxHp = [100, 100, 120, 110, 100, 100]; // each character's full HP, from 'hi'
let ballCfg = { radius: 14, hp: 30, charge: 0.5 }; // Electro Ball, from 'hi'
let punchCfg = { charge: 0.4, radius: 40, freeze: 1.5, distance: 250 }; // Ice Punch, from 'hi'
const iceTrail = []; // fading ice puffs the dash leaves behind
let leafCfg = { radius: 90, scale: 2.5 }, razorCfg = { radius: 10, scale: 1, hp: 5 }, vineCfg = { len: 160, w: 24, angle: 70, duration: 0.35, charge: 0.4, recharge: 0.5 }; // Chikorita's Leaf Slash reach, from 'hi'
let voltCfg = { radius: 16, uses: 3, window: 2 }; // Volt Tackle, from 'hi'
let waveCfg = { radius: 260, speed: 500 }, tailCfg = { angle: 90, length: 180, stun: 1.2, charge: 0.5 }, evolveHops = 5; // Gyarados's, from 'hi'
let frostCfg = { radius: 40, scale: 1, duration: 6, ride: 2 }, stormCfg = { radius: 80, interval: 0.7, strikes: 6 }, fbeamCfg = { len: 450, control: 3, pillar: 24, hp: 25, life: 8 }; // Vulpix's, from 'hi'
let arrowCfg = { radius: 8, hp: 2, slow: 2, count: 5, angle: 12, charge: 0.5, scale: 1 }, tornadoCfg = { radius: 50, hp: 40, charge: 0.4, lift: 200, scale: 1 }; // Rowlet's, from 'hi'
const stormLook = [{ x: null, y: 0 }, { x: null, y: 0 }], fbLook = [{ x: null, y: 0 }, { x: null, y: 0 }]; // per slot: the smoothed storm position and beam end
let fireCfg = { radius: 10, hp: 10 }, tossCfg = { radius: 45, high: 180 }, flyCfg = { height: 90 }; // Charizard's, from 'hi'
let cdCfg = { dash: 0, thunder: 0, jump: 0, beam: 0, ball: 0, punch: 0, fly: 0, fire: 0, toss: 0 }; // full cooldowns, from 'hi'
const cdBtns = []; // { span, field, total }: the pad's cooldown overlays
let usesBadge = null; // Pikachu's main button: how many Volt Tackles are left
const shadow = [{ x: null, y: null }, { x: null, y: null }]; // per slot: the smoothed thunder shadow position
const smoke = []; // puffs rising off Snorlax while it recharges
const flames = []; // fading flames Charizard leaves while it runs with a catch
let smokeAcc = 0;


const bar = document.getElementById('bar');
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let arena = { w: 2000, h: 1000 }; // replaced by the server's values in 'hi'
if (PORTRAIT) { cv.width = arena.h; cv.height = arena.w; }
let you = -1, snap = null, waiting = true, status = '連線中…';
// Which way each character faces on screen and how it is running (see art); set from how its display position moves.
const look = [{ dir: null, vx: 0, vy: 0, mv: 0, ph: 0, ls: 1, la: 0 }, { dir: null, vx: 0, vy: 0, mv: 0, ph: 0, ls: 1, la: 0 }]; // ls, la: the size and angle of Chikorita's leaf
const disp = [{ x: null, y: 0, z: 0 }, { x: null, y: 0, z: 0 }]; // smoothed positions; set from the first snapshot
let fx = [], shake = 0;

const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws?menu=1&mode=' + (PORTRAIT ? 'mobile' : 'web')); // no room number to type: when people are waiting the server sends their rooms to choose from, otherwise it opens one; the first player's view picks the court
let picks = [-1, -1], here = [true, false], bots = [-1, -1], padKind = -1; // bots: the character a computer plays in each slot (-1 = a person or nobody)
let ease = [0, 0]; // each slot's handicap in percent, from the lobby
let teamMode = false, teamSize = NAMES.length, myOrder = [], sentOrder = ''; // the lobby's match type; the order I field my characters in, and the one the server has
const hasBeam = (k) => k === 1 || k === 7; // Snorlax and Gyarados fire the Hyper Beam
const beamSlots = () => (snap ? [0, 1].filter((i) => hasBeam(snap.p[i].k)) : []);
const slotsOf = (k) => (snap ? [0, 1].filter((i) => snap.p[i].k === k) : []); // the slots playing that character (both may play the same one)
ws.onmessage = (e) => {
  const m = JSON.parse(e.data);
  if (m.t === 'hi') { hideRooms(); you = m.you; beamCfg = m.beam; gbeamCfg = m.gbeam; thunderCfg = m.thunder; cdCfg = m.cooldown; ballCfg = m.ball; punchCfg = m.punch; fireCfg = m.fire; tossCfg = m.toss; flyCfg = m.fly; voltCfg = m.volt; leafCfg = m.leaf; razorCfg = m.razor; vineCfg = m.vine; frostCfg = m.frost; stormCfg = m.storm; fbeamCfg = m.fbeam; arrowCfg = m.arrow; tornadoCfg = m.tornado; waveCfg = m.wave; tailCfg = m.tail; evolveHops = m.evolve; maxHp = m.maxhp; radius = m.radius; arena = m.arena; setView(); buildCards(); }
  else if (m.t === 'lobby') {
    if (m.picks[0] >= 0 && m.picks[1] >= 0 && m.here[0] && m.here[1]) return; // a match is on: a refused pick changes nothing
    if (teamSize !== (m.size || NAMES.length)) { teamSize = m.size || NAMES.length; myOrder = []; sentOrder = ''; } // another team size: choose again
    if (teamMode !== !!m.team) { teamMode = !!m.team; myOrder = []; sentOrder = ''; } // another match type: choose again
    if (sentOrder && m.picks[you] < 0) { myOrder = []; sentOrder = ''; } // sent back to choose again
    endAim(false); // a match that ended while the tail was being aimed
    ease = m.ease || [0, 0];
    picks = m.picks; here = m.here; bots = m.bot || [-1, -1]; waiting = !(here[0] && here[1]); snap = null; padKind = -1;
    document.querySelectorAll('.stick, .btn').forEach((el) => el.remove());
    showPick();
  }
  else if (m.t === 'rooms') showRooms(m.rooms);
  else if (m.t === 'full') { status = '房間已滿（最多 2 人）'; waiting = false; }
  else if (m.t === 's') {
    if (!snap) { ghosts.length = iceTrail.length = voltTrail.length = smoke.length = flames.length = 0; fx = []; for (const b of beamLook) b.ang = b.tail = null; for (const sh of shadow) sh.x = null; for (const l of stormLook) l.x = null; for (const l of fbLook) l.x = null; for (const d of disp) d.x = null; for (const l of look) l.dir = null; } // a new match starts clean
    const old = snap;
    waiting = false; snap = m;
    document.getElementById('pick').style.display = 'none';
    if (padKind !== m.p[you].k) { padKind = m.p[you].k; document.getElementById('bar2').textContent = HELP[padKind]; if (PORTRAIT) buildPad(); }
    for (const i of beamSlots()) {
      const st = m.p[i].st, prevSt = old ? old.p[i].st : 0;
      if (st > 0 && !(prevSt > 0)) shake = 14; // the sweep begins
      if (!(st > 0) && prevSt > 0 && beamLook[i].ang !== null) beamLook[i].tail = { x: disp[i].x, y: disp[i].y - 6, ang: beamLook[i].ang, age: 0, bc: beamCfgOf(m.p[i].k) };
    }
    for (const ev of m.e || []) {
      fx.push({ ...ev, age: 0 });
      if (ev.t === 'slam') shake = 16;
      if (ev.t === 'thunder') shake = 10;
      if (ev.t === 'explode') shake = 14;
      if (ev.t === 'iceburst') shake = 12;
      if (ev.t === 'wave') shake = 16;
      if (ev.t === 'evolve') shake = 14;
      if (ev.t === 'leaf') shake = 6;
      if (ev.t === 'freeze') shake = 10;
      if (ev.t === 'storm') shake = Math.max(shake, 5);
      if (ev.t === 'paralyze') shake = 8;
    }
  }
};
ws.onclose = () => { hideRooms(); status = '連線中斷，重新整理頁面再試'; waiting = false; snap = null; document.getElementById('pick').style.display = 'none'; };

// The room menu: shown when people are waiting, so a player who has dropped off can be skipped. The server sends the
// list again whenever it is asked, and on its own after a choice that failed.
let roomsTimer = 0;
function hideRooms() { clearInterval(roomsTimer); roomsTimer = 0; document.getElementById('rooms').style.display = 'none'; }
function showRooms(list) {
  const box = document.getElementById('rooms'), ul = document.getElementById('roomlist');
  box.style.display = 'flex';
  ul.textContent = '';
  list.forEach((r) => {
    const b = document.createElement('button');
    const who = r.pick >= 0 ? NAMES[r.pick] : '選角中';
    b.textContent = (r.bot ? '對電腦中・' : '') + who + '　等了 ' + r.wait + ' 秒' + (r.stale ? '　（可能已斷線）' : '');
    if (r.stale) b.className = 'stale';
    b.onclick = () => ws.send(JSON.stringify({ join: r.id }));
    ul.appendChild(b);
  });
  if (!roomsTimer) roomsTimer = setInterval(() => { if (ws.readyState === 1) ws.send(JSON.stringify({ rooms: true })); }, 2000);
}
document.getElementById('newroom').onclick = () => ws.send(JSON.stringify({ new: true }));

// The view: the world is drawn through VIEW, so everything that is not upright art (rings, beams, the
// strike areas) just follows. Pikachu starts on the left, so its view turns the arena a quarter turn
// counter-clockwise (the opponent ends up above it); Snorlax's turns clockwise.
function setView() {
  const W = arena.w, H = arena.h;
  tele.width = W; tele.height = H; // the warning fan is drawn in world space
  if (!PORTRAIT) { ROT = 0; VIEW = [1, 0, 0, 1, 0, 0]; cv.width = W; cv.height = H; return; }
  cv.width = H; cv.height = W;

// (x, y) is a ground point in the world and lift is the height above it, which is up on screen.
function drawBody(kind, X, Y, alpha, lift = 0, flap = 0, pose = IDLE, spin = 0) {
  const bs = radius[kind] / REF[kind];
  ctx.save(); ctx.translate(X, Y); ctx.rotate(-ROT); // upright whatever the view
  ctx.scale(bs, bs);
  ctx.globalAlpha = alpha;
  if (spin) { ctx.translate(0, -lift / bs); ctx.rotate(spin); ctx.translate(0, lift / bs); } // turned about its own centre (a tornado is spinning it)
  art(ctx, kind, 0, -lift / bs, performance.now() / 1000, flap, pose); // lift is a height in world units, so it is not scaled
  ctx.restore();
}

// Warning fan while Snorlax charges. The server hits whatever the beam touches as

// blended in, so the overlaps do not get darker than the rest.
const tele = document.createElement('canvas'); tele.width = arena.w; tele.height = arena.h;
const teleCtx = tele.getContext('2d');
function drawTelegraph() {
  for (const si of beamSlots()) drawFan(snap.p[si], disp[si]);
  for (const si of slotsOf(7)) drawTailWarning(snap.p[si], disp[si]);
  if (aiming && AIMED[snap.p[you].k] === aiming.name) drawAimFan(snap.p[you], disp[you]);
}
// The fan of an aimed skill the player is choosing, drawn for them only (the opponent's page never gets it; it is not sent) until the cast, when the
// real warning takes over. Without a direction it points at the opponent, which is where a tap would send it.
function drawAimFan(p, d) {
  const o = disp[1 - you], n = Math.hypot(aiming.x, aiming.y), w = n ? toWorld(aiming.x / n, aiming.y / n) : { x: o.x - d.x, y: o.y - d.y };
  const vine = aiming.name === 'vine'; // the vines sweep in from +-angle, the tail covers its whole angle
  const half = (vine ? vineCfg.angle : tailCfg.angle / 2) * Math.PI / 180, base = Math.atan2(w.y, w.x), L = vine ? vineCfg.len : tailCfg.length, ready = !((vine ? p.vcd : p.tlcd) > 0);
  ctx.save(); ctx.globalAlpha = ready ? 1 : 0.4;
  ctx.fillStyle = 'rgba(255,230,150,0.16)'; ctx.strokeStyle = 'rgba(255,235,190,0.85)'; ctx.lineWidth = 2; ctx.setLineDash([10, 7]);
  ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.arc(d.x, d.y, L, base - half, base + half); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.setLineDash([]); ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x + Math.cos(base) * L, d.y + Math.sin(base) * L); ctx.stroke();
  ctx.restore();
}
function drawFan(p, d) {
  if (!(p.bt > 0)) return;
  const bc = beamCfgOf(p.k);
  const k = 1 - p.bt / bc.charge; // 0 -> 1 as the charge fills
  const base = Math.atan2(p.by, p.bx), A = bc.angle * Math.PI / 180;
  teleCtx.clearRect(0, 0, tele.width, tele.height);
  teleCtx.fillStyle = teleCtx.strokeStyle = '#ff4628';
  teleCtx.lineCap = 'round'; teleCtx.lineWidth = bc.w;
  teleCtx.beginPath(); teleCtx.moveTo(d.x, d.y); teleCtx.arc(d.x, d.y, bc.len, base - A, base + A); teleCtx.closePath(); teleCtx.fill();
  for (const edge of [base - A, base + A]) {
    teleCtx.beginPath(); teleCtx.moveTo(d.x, d.y);
    teleCtx.lineTo(d.x + Math.cos(edge) * bc.len, d.y + Math.sin(edge) * bc.len); teleCtx.stroke();
  }
  ctx.save(); ctx.globalAlpha = 0.12 + 0.3 * k; ctx.drawImage(tele, 0, 0); ctx.restore();
}

// One beam at canvas angle ang (radians): red glow, orange body, white-hot core, rings running outward.
function drawBeamLine(x0, y0, ang, a, bc) {
  const dx = Math.cos(ang), dy = Math.sin(ang), x1 = x0 + dx * bc.len, y1 = y0 + dy * bc.len;
  ctx.save();
  ctx.lineCap = 'round';
  for (const [wd, col] of [[bc.w, `rgba(255,90,30,${0.35 * a})`], [bc.w * 0.65, `rgba(255,170,50,${0.75 * a})`], [bc.w * 0.3, `rgba(255,255,230,${a})`]]) {
    ctx.strokeStyle = col; ctx.lineWidth = wd;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  }
  ctx.strokeStyle = `rgba(255,255,255,${0.8 * a})`; ctx.lineWidth = 2;
  for (let s = (performance.now() * 0.9) % 70; s < bc.len; s += 70) {
    ctx.beginPath(); ctx.ellipse(x0 + dx * s, y0 + dy * s, bc.w * 0.22, bc.w * 0.55, ang, 0, 7); ctx.stroke();
  }
  ctx.restore();
}

// The beam is drawn from the snapshot, so it turns as the server turns it. The
// server's angle is counter-clockwise positive, which is a smaller canvas angle.
function drawBeams() {
  for (const i of [0, 1]) drawBeam(i, snap.p[i], disp[i], beamLook[i]);
}
function drawBeam(i, p, d, beamLook) {
  if (!hasBeam(p.k)) { beamLook.ang = null; return; }
  if (p.st > 0) {
    const target = Math.atan2(p.by, p.bx) - p.ba * Math.PI / 180;
    beamLook.ang = beamLook.ang === null ? target : beamLook.ang + (target - beamLook.ang) * 0.5; // 30 snapshots/s -> smooth at 60fps
    drawBeamLine(d.x, d.y - 6, beamLook.ang, 1, beamCfgOf(p.k));
  } else {
    beamLook.ang = null;
  }
  const t = beamLook.tail;
  if (t) {
    drawBeamLine(t.x, t.y, t.ang, 1 - t.age / TAIL, t.bc);
    if ((t.age += 1 / 60) >= TAIL) beamLook.tail = null;
  }
}

// Electro Ball: the aim line and a growing orb while Pikachu charges, and the balls in flight, each with
// a small HP bar (the opponent's skills wear it down; at 0 it explodes).
function drawBalls() {
  for (const pi of slotsOf(0)) drawBallCharge(snap.p[pi], disp[pi]);
  for (const b of snap.b || []) drawBall(b);
}
function drawBallCharge(p, d) {
  if (p.kt > 0) {
    const k = 1 - p.kt / ballCfg.charge, ux = p.ax, uy = p.ay;
    ctx.save();
    ctx.strokeStyle = `rgba(255,235,90,${0.3 + 0.4 * k})`; ctx.lineWidth = 3; ctx.setLineDash([12, 10]);
    ctx.beginPath(); ctx.moveTo(d.x + ux * 30, d.y + uy * 30); ctx.lineTo(d.x + ux * 220, d.y + uy * 220); ctx.stroke();
    ctx.setLineDash([]);

    const gr = ctx.createRadialGradient(ox, oy, 0, ox, oy, r * 1.8);
    gr.addColorStop(0, '#fff'); gr.addColorStop(0.4, '#ffe14a'); gr.addColorStop(1, 'rgba(255,200,40,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(ox, oy, r * 1.8, 0, 7); ctx.fill();

}
function drawBall(b) {

  {
    const r = ballCfg.radius, gr = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, r * 1.8);
    gr.addColorStop(0, '#fff'); gr.addColorStop(0.45, '#ffe14a'); gr.addColorStop(1, 'rgba(255,200,40,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(b.x, b.y, r * 1.8, 0, 7); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.lineJoin = 'round'; // crackling spark inside the orb

    for (let a = 0; a < 5; a++) { const ang = Math.random() * 6.28; ctx.moveTo(b.x, b.y); ctx.lineTo(b.x + Math.cos(ang) * r * 1.5, b.y + Math.sin(ang) * r * 1.5); }
    ctx.stroke();

}

// A fire ball: a hot white-yellow core in a flickering orange flame; a bar shows its HP once it has been hurt.
function drawFireBall(b) {
  const r = fireCfg.radius, f = 0.85 + 0.3 * Math.random(), R = r * 1.9 * f;
  const gr = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, R);
  gr.addColorStop(0, '#fff6c0'); gr.addColorStop(0.35, '#ffb030'); gr.addColorStop(0.7, 'rgba(255,90,20,0.7)'); gr.addColorStop(1, 'rgba(255,60,10,0)');
  ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(b.x, b.y, R, 0, 7); ctx.fill();
  if (b.hp < fireCfg.hp) {
    upright(b.x, b.y, () => {
      ctx.fillStyle = '#000a'; ctx.fillRect(-9, -r - 10, 18, 3);
      ctx.fillStyle = '#ffb030'; ctx.fillRect(-9, -r - 10, 18 * Math.max(b.hp, 0) / fireCfg.hp, 3);
    });
  }
}

// Seismic Toss: while it runs Charizard is wrapped in flame, shedding flames behind it; while it carries
// its catch up it burns less fiercely.
function drawToss() {
  for (const [i, p] of snap.p.entries()) {
    if (p.k !== 2 || !(p.gp > 0)) continue;
    const d = disp[i], R = tossCfg.radius * (p.gp === 1 ? 1 : 0.7);
    if (p.gp === 1) flames.push({ x: d.x, y: d.y, age: 0, r: R * (0.5 + Math.random() * 0.4) });
    const gr = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, R);
    gr.addColorStop(0, 'rgba(255,240,170,0.6)'); gr.addColorStop(0.6, 'rgba(255,130,30,0.45)'); gr.addColorStop(1, 'rgba(255,60,10,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(d.x, d.y - (p.gp === 1 ? 0 : d.z), R, 0, 7); ctx.fill();
  }
  for (const f of flames) {
    const a = 1 - f.age / 0.4; f.age += 1 / 60;
    if (a <= 0) continue;
    const gr = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
    gr.addColorStop(0, `rgba(255,220,120,${0.55 * a})`); gr.addColorStop(1, 'rgba(255,70,10,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 7); ctx.fill();
  }
  while (flames.length && flames[0].age >= 0.4) flames.shift();
}

// The blast: a bright disc of the real reach (f.r), a ring racing out, and forked bolts bursting from the
// centre to the edge, redrawn jagged every frame so they crackle.
function drawExplosion(f) {
  const R = f.r, k = f.age / 0.5, a = 1 - k;
  ctx.save();
  const disc = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, R);
  disc.addColorStop(0, `rgba(255,255,255,${0.9 * a})`);
  disc.addColorStop(0.5, `rgba(255,230,80,${0.5 * a})`);
  disc.addColorStop(1, `rgba(255,200,40,${0.15 * a})`);
  ctx.fillStyle = disc; ctx.beginPath(); ctx.arc(f.x, f.y, R, 0, 7); ctx.fill();
  ctx.strokeStyle = `rgba(255,245,160,${a})`; ctx.lineWidth = 8 * a + 1;
  ctx.beginPath(); ctx.arc(f.x, f.y, R * Math.min(1, k * 2.5), 0, 7); ctx.stroke();
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const reach = Math.min(1, k * 4); // the bolts shoot out in the first fifth of the effect, then fade
  for (let i = 0; i < 12; i++) {
    const ang = i * 0.5236 + (i % 2) * 0.12, len = R * (0.75 + 0.25 * ((i * 7) % 5) / 4) * reach;
    const dx = Math.cos(ang), dy = Math.sin(ang);
    const pts = [[f.x, f.y]];
    for (let s = 1; s <= 5; s++) { // zig-zag out along the ray
      const off = (Math.random() - 0.5) * 26;
      pts.push([f.x + dx * len * s / 5 - dy * off, f.y + dy * len * s / 5 + dx * off]);
    }
    for (const [wd, col] of [[9, `rgba(255,225,70,${0.45 * a})`], [3, `rgba(255,255,255,${a})`]]) {
      ctx.strokeStyle = col; ctx.lineWidth = wd;
      ctx.beginPath(); pts.forEach(([x, y], n) => (n ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.stroke();
    }
  }
  ctx.restore();
}

// Ice Punch: a white ice fist grows in front of Snorlax while it charges (with a dashed line along the aim),
// then Snorlax is wrapped in an icy aura with the fist in front while it dashes, leaving fading ice puffs.
function drawIcePunch() {
  for (const si of slotsOf(1)) drawFist(snap.p[si], disp[si]);
  for (const t of iceTrail) { // the puffs the dashes left, fading
    const a = 1 - t.age / 0.45; t.age += 1 / 60;
    if (a <= 0) continue;
    ctx.fillStyle = `rgba(215,242,255,${0.5 * a})`;
    ctx.beginPath(); ctx.arc(t.x, t.y, punchCfg.radius * (0.55 + 0.35 * a), 0, 7); ctx.fill();
  }
  while (iceTrail.length && iceTrail[0].age >= 0.45) iceTrail.shift();
}
function drawFist(p, d) {
  const R = punchCfg.radius;
  let ux = p.ax, uy = p.ay, k = 0, dashing = false;
  if (p.ut > 0) k = 1 - p.ut / punchCfg.charge;
  else if (p.ud > 0) { ux = p.udx; uy = p.udy; k = 1; dashing = true; }
  else k = -1; // not punching
  if (dashing) iceTrail.push({ x: d.x, y: d.y, age: 0 });
  if (k < 0) return;
  ctx.save();
  if (!dashing) { // the aim, so the direction can be chosen while charging
    ctx.strokeStyle = `rgba(200,235,255,${0.3 + 0.4 * k})`; ctx.lineWidth = 3; ctx.setLineDash([12, 10]);
    ctx.beginPath(); ctx.moveTo(d.x + ux * R, d.y + uy * R); ctx.lineTo(d.x + ux * punchCfg.distance, d.y + uy * punchCfg.distance); ctx.stroke();
    ctx.setLineDash([]);
  } else { // the aura the dash hits with
    const g = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, R);
    g.addColorStop(0, 'rgba(255,255,255,0.55)'); g.addColorStop(1, 'rgba(150,215,255,0.25)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(d.x, d.y, R, 0, 7); ctx.fill();
  }
  const fr = R * (0.35 + 0.45 * k), fxp = d.x + ux * R * 0.85, fyp = d.y + uy * R * 0.85; // the fist
  ctx.translate(fxp, fyp); ctx.rotate(Math.atan2(uy, ux));
  ctx.fillStyle = '#f4fbff'; ctx.strokeStyle = '#7fd0f5'; ctx.lineWidth = 3; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.arc(0, 0, fr, 0, 7); ctx.fill(); ctx.stroke();
  for (let s = -2; s <= 2; s++) { // ice crystals along the knuckles
    const a = s * 0.45, bx = Math.cos(a) * fr, by = Math.sin(a) * fr;
    ctx.beginPath(); ctx.moveTo(bx - Math.sin(a) * fr * 0.28, by + Math.cos(a) * fr * 0.28);
    ctx.lineTo(Math.cos(a) * fr * 1.55, Math.sin(a) * fr * 1.55);
    ctx.lineTo(bx + Math.sin(a) * fr * 0.28, by - Math.cos(a) * fr * 0.28); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

// Volt Tackle: while it dashes Pikachu is wrapped in a flickering glow with lightning crackling round it; during
// a chain a row of pips under it shows the uses left, and a bar the time left to spend them.
function zig(x0, y0, x1, y1, n, jit) { // a jagged line between two points
  ctx.beginPath(); ctx.moveTo(x0, y0);
  for (let s = 1; s < n; s++) { const k = s / n; ctx.lineTo(x0 + (x1 - x0) * k + (Math.random() - 0.5) * jit, y0 + (y1 - y0) * k + (Math.random() - 0.5) * jit); }
  ctx.lineTo(x1, y1); ctx.stroke();
}
const voltTrail = []; // rings of lightning the tackle leaves along its path
let zigRand = 0;
function zigSeed(x0, y0, x1, y1, n, jit, seed) { // zig() whose random jitter is the same for the three strokes of one bolt in a frame
  const sv = Math.random; let h = (seed * 9301 + zigRand * 49297) % 233280;
  Math.random = () => { h = (h * 9301 + 49297) % 233280; return h / 233280; };
  zig(x0, y0, x1, y1, n, jit); Math.random = sv;
}
function drawVolt() {
  zigRand = (zigRand + 1) % 997;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const t of voltTrail) { // fading rings and sparks along the path
    const k = t.age / 0.45; t.age += 1 / 60;
    if (k >= 1) continue;
    ctx.strokeStyle = `rgba(255,230,80,${0.7 * (1 - k)})`; ctx.lineWidth = 3 * (1 - k) + 1;
    ctx.beginPath(); ctx.arc(t.x, t.y, t.R * (0.6 + 0.9 * k), 0, 7); ctx.stroke();
    ctx.fillStyle = `rgba(255,255,200,${0.5 * (1 - k)})`; ctx.beginPath(); ctx.arc(t.x, t.y, t.R * 0.5 * (1 - k), 0, 7); ctx.fill();
  }
  ctx.restore();
  while (voltTrail.length && voltTrail[0].age >= 0.45) voltTrail.shift();
  for (const i of slotsOf(0)) {
    const p = snap.p[i], d = disp[i], bs = radius[0] / REF[0];
    upright(d.x, d.y, () => {
      const cy = -d.z - 4 * bs;
      if (p.vd > 0) {
        const R = voltCfg.radius * 1.6, pulse = 1 + 0.12 * Math.sin(performance.now() / 35);
        shake = Math.max(shake, 5);
        ctx.save(); ctx.globalCompositeOperation = 'lighter'; // glows add up: the more lightning, the whiter it gets
        const g = ctx.createRadialGradient(0, cy, 0, 0, cy, R * 2.3 * pulse);
        g.addColorStop(0, 'rgba(255,255,255,0.95)'); g.addColorStop(0.25, 'rgba(255,240,120,0.7)'); g.addColorStop(0.6, 'rgba(255,170,30,0.28)'); g.addColorStop(1, 'rgba(255,120,0,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, cy, R * 2.3 * pulse, 0, 7); ctx.fill();
        ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.shadowColor = 'rgba(255,230,60,1)'; ctx.shadowBlur = 14;
        for (let s = 0; s < 18; s++) { // bolts, each with a branch, in a blue halo, a yellow body and a white core
          const a = Math.random() * 6.283, r0 = R * (0.4 + Math.random() * 0.4), r1 = R * (1.5 + Math.random() * 1.1);
          const x0 = Math.cos(a) * r0, y0 = cy + Math.sin(a) * r0, x1 = Math.cos(a) * r1, y1 = cy + Math.sin(a) * r1;
          const bx = x0 + (x1 - x0) * 0.55, by = y0 + (y1 - y0) * 0.55, ba = a + (Math.random() - 0.5) * 1.6;
          for (const [col, w] of [['rgba(120,170,255,0.55)', 6], ['rgba(255,225,50,0.95)', 3.4], ['rgba(255,255,255,1)', 1.4]]) {
            ctx.strokeStyle = col; ctx.lineWidth = w;
            zigSeed(x0, y0, x1, y1, 5, R * 0.3, s);
            zigSeed(bx, by, bx + Math.cos(ba) * R * 0.7, by + Math.sin(ba) * R * 0.7, 3, R * 0.2, s + 50);
          }
        }
        ctx.restore();
        ctx.strokeStyle = 'rgba(255,250,170,0.7)'; ctx.lineWidth = 2; // a ring that spins round the body
        for (let s = 0; s < 3; s++) { const a0 = performance.now() / 90 + s * 2.1; ctx.beginPath(); ctx.arc(0, cy, R * 1.1, a0, a0 + 1.2); ctx.stroke(); }
        voltTrail.push({ x: d.x, y: d.y, R, age: 0 }); // the afterimage of the charge, left behind
      }
      if (p.vn > 0) {
        const N = voltCfg.uses, gap = 11, x0 = -(N - 1) * gap / 2, y = 22 * bs;
        for (let s = 0; s < N; s++) {
          ctx.fillStyle = s < p.vn ? '#ffd83a' : 'rgba(255,255,255,0.25)'; ctx.strokeStyle = 'rgba(60,40,0,.7)'; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.arc(x0 + s * gap, y, 4, 0, 7); ctx.fill(); ctx.stroke();
        }
        const w = Math.max(N * gap, 24), k = Math.min(1, Math.max(0, p.vw / voltCfg.window));
        ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(-w / 2, y + 8, w, 3);
        ctx.fillStyle = '#ffd83a'; ctx.fillRect(-w / 2, y + 8, w * k, 3);
      }
    });
  }
}

// Paralyzed by a Volt Tackle: sparks crackle round the body, and a label, while it cannot walk or use a movement skill.
function drawParalyzed(d, p) {
  const bs = radius[p.k] / REF[p.k], R = 20 * bs;
  upright(d.x, d.y, () => {
    const cy = -d.z - 4 * bs, fade = p.pz < 0.4 ? p.pz / 0.4 : 1;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let s = 0; s < 4; s++) {
      const a = Math.random() * 6.283, r0 = R * (0.7 + Math.random() * 0.3), r1 = R * (1.1 + Math.random() * 0.5);
      ctx.strokeStyle = `rgba(255,240,120,${0.9 * fade})`; ctx.lineWidth = 2;
      zig(Math.cos(a) * r0, cy + Math.sin(a) * r0, Math.cos(a) * r1, cy + Math.sin(a) * r1, 3, 8 * bs);
    }
    ctx.font = 'bold 12px system-ui'; ctx.textAlign = 'center'; ctx.fillStyle = `rgba(255,224,70,${fade})`;
    ctx.fillText('麻痺！', 0, cy - 36 * bs);
  });
}

// The moment of the shock: a yellow flash and bolts flying out.
function drawParalyzeBurst(f) {
  const k = f.age / 0.35, a = 1 - k, sc = (f.r || 16) / 16;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = `rgba(255,245,160,${0.8 * a * a})`; ctx.beginPath(); ctx.arc(f.x, f.y, (30 + 60 * k) * sc, 0, 7); ctx.fill();
  ctx.strokeStyle = `rgba(255,255,255,${a})`; ctx.lineWidth = 4 * a + 1; ctx.beginPath(); ctx.arc(f.x, f.y, (20 + 120 * k) * sc, 0, 7); ctx.stroke();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.shadowColor = 'rgba(255,230,60,1)'; ctx.shadowBlur = 12;
  for (let s = 0; s < 14; s++) {
    const ang = s * 0.4488 + 0.2, r0 = (14 + 25 * k) * sc, r1 = (40 + 95 * k) * sc;
    ctx.strokeStyle = `rgba(255,225,60,${a})`; ctx.lineWidth = 3.5;
    zigSeed(f.x + Math.cos(ang) * r0, f.y + Math.sin(ang) * r0, f.x + Math.cos(ang) * r1, f.y + Math.sin(ang) * r1, 4, 12 * sc, s + 7);
    ctx.strokeStyle = `rgba(255,255,255,${a})`; ctx.lineWidth = 1.4;
    zigSeed(f.x + Math.cos(ang) * r0, f.y + Math.sin(ang) * r0, f.x + Math.cos(ang) * r1, f.y + Math.sin(ang) * r1, 4, 12 * sc, s + 7);
  }
  ctx.restore();
}

// A frozen player sits inside an iceberg; in its last half second the ice flickers and cracks.
function drawFrozen(p, i, d) {
  if (!(p.fz > 0)) return;
  const r = Math.max(radius[p.k] * 1.9, 30), melting = p.fz < 0.5;
  const a = melting ? 0.45 + 0.35 * Math.abs(Math.sin(p.fz * 30)) : 0.8;
  const pts = [[-1.1, 0.75], [-0.85, -0.15], [-0.5, 0.05], [-0.25, -1.0], [0.1, -0.35], [0.45, -0.85], [0.8, -0.05], [1.1, 0.75]];
  upright(d.x, d.y, () => {
    ctx.save(); ctx.translate(0, -d.z - r * 0.15); ctx.scale(r, r);
    const g = ctx.createLinearGradient(0, -1, 0, 0.8);
    g.addColorStop(0, `rgba(245,252,255,${a})`); g.addColorStop(1, `rgba(120,200,240,${a * 0.85})`);
    ctx.fillStyle = g; ctx.strokeStyle = `rgba(255,255,255,${Math.min(1, a + 0.2)})`; ctx.lineWidth = 2.5 / r; ctx.lineJoin = 'round';
    ctx.beginPath(); pts.forEach(([x, y], n) => (n ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = `rgba(255,255,255,${a * 0.8})`; ctx.lineWidth = 1.5 / r; // facets
    ctx.beginPath(); ctx.moveTo(-0.25, -1.0); ctx.lineTo(-0.1, 0.1); ctx.lineTo(0.1, -0.35); ctx.moveTo(-0.1, 0.1); ctx.lineTo(0, 0.75); ctx.stroke();
    if (melting) { ctx.strokeStyle = `rgba(60,110,150,${a})`; ctx.beginPath(); ctx.moveTo(-0.5, -0.1); ctx.lineTo(-0.2, 0.2); ctx.lineTo(-0.3, 0.5); ctx.moveTo(0.4, -0.3); ctx.lineTo(0.2, 0.1); ctx.stroke(); }
    ctx.restore();
  });
}

// The moment of freezing: a flash and shards of ice flying out.
function drawFreezeBurst(f) {
  const k = f.age / 0.6, a = 1 - k;
  ctx.save();
  ctx.fillStyle = `rgba(235,250,255,${0.7 * a * a})`;
  ctx.beginPath(); ctx.arc(f.x, f.y, 30 + 50 * k, 0, 7); ctx.fill();
  ctx.fillStyle = `rgba(190,232,255,${a})`; ctx.strokeStyle = `rgba(255,255,255,${a})`; ctx.lineWidth = 1.5;
  for (let s = 0; s < 12; s++) {
    const ang = s * 0.5236 + (s % 3) * 0.1, dd = 15 + (50 + 25 * (s % 3)) * (1 - (1 - k) * (1 - k)), sz = 7 + (s % 4) * 2;
    ctx.save(); ctx.translate(f.x + Math.cos(ang) * dd, f.y + Math.sin(ang) * dd); ctx.rotate(ang + k * 3);
    ctx.beginPath(); ctx.moveTo(sz, 0); ctx.lineTo(0, sz * 0.4); ctx.lineTo(-sz * 0.7, 0); ctx.lineTo(0, -sz * 0.4); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

// Frost Field's iceberg bursting: a white flash the size of the blast, a ring running out to its edge, and shards flying out.
function drawIceBurst(f) {
  const R = f.r, k = f.age / 0.6, a = 1 - k, out = 1 - (1 - k) * (1 - k);
  ctx.save();
  const disc = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, R);
  disc.addColorStop(0, `rgba(255,255,255,${0.85 * a})`); disc.addColorStop(0.6, `rgba(170,225,255,${0.45 * a})`); disc.addColorStop(1, `rgba(120,200,255,${0.1 * a})`);
  ctx.fillStyle = disc; ctx.beginPath(); ctx.arc(f.x, f.y, R, 0, 7); ctx.fill();
  ctx.strokeStyle = `rgba(225,248,255,${a})`; ctx.lineWidth = 6 * a + 1;
  ctx.beginPath(); ctx.arc(f.x, f.y, R * Math.min(1, k * 2.5), 0, 7); ctx.stroke();
  ctx.fillStyle = `rgba(200,238,255,${a})`; ctx.strokeStyle = `rgba(255,255,255,${a})`; ctx.lineWidth = 1.5;
  for (let s = 0; s < 18; s++) {
    const ang = s * 0.349 + (s % 3) * 0.08, dd = R * (0.25 + 0.7 * ((s * 5) % 7) / 6) * out, sz = 9 + (s % 4) * 3;
    ctx.save(); ctx.translate(f.x + Math.cos(ang) * dd, f.y + Math.sin(ang) * dd); ctx.rotate(ang + k * 4);
    ctx.beginPath(); ctx.moveTo(sz, 0); ctx.lineTo(0, sz * 0.4); ctx.lineTo(-sz * 0.7, 0); ctx.lineTo(0, -sz * 0.4); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

// The iceberg Vulpix rides: a little ice mountain, frost_field.radius x scale wide (the scale is looks only; the server hits
// with the radius). It stands upright on screen whichever way the arena is turned: a platform of ice with three peaks
// behind Vulpix, each lit on its left face and shaded on its right, snow on the tips.
function drawIceberg(d, p) {
  const R = frostCfg.radius * frostCfg.scale, t = performance.now() / 1000;
  const by = (radius[p.k] || 14) * 0.9; // where Vulpix's feet are, below its centre
  upright(d.x, d.y, () => {
    ctx.translate(0, Math.sin(t * 9) * R * 0.015); // it rocks a little as it slides
    ctx.lineJoin = 'round';
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(0, by + R * 0.12, R * 1.15, R * 0.42, 0, 0, 7); ctx.fill();
    // [centre x, half width, height] of the peaks, the small ones first so the big one overlaps them
    for (const [cx, w, h, k] of [[-0.62, 0.5, 0.85, 1], [0.7, 0.42, 0.62, 2], [0.02, 0.62, 1.35, 3]]) {
      const x = cx * R, hw = w * R, hh = h * R, ax = x + (seeded(k * 3.1) - 0.5) * hw * 0.4, ay = by - hh, rx = x + hw * 0.12;
      ctx.beginPath(); ctx.moveTo(x - hw, by); ctx.lineTo(x - hw * 0.5, by - hh * 0.5); ctx.lineTo(ax - hw * 0.12, ay + hh * 0.12); ctx.lineTo(ax, ay); ctx.lineTo(rx, by); ctx.closePath();
      let g = ctx.createLinearGradient(x - hw, ay, rx, by); g.addColorStop(0, '#f4fdff'); g.addColorStop(1, '#a9defa');
      ctx.fillStyle = g; ctx.fill();
      ctx.beginPath(); ctx.moveTo(rx, by); ctx.lineTo(ax, ay); ctx.lineTo(ax + hw * 0.18, ay + hh * 0.3); ctx.lineTo(x + hw * 0.55, by - hh * 0.5); ctx.lineTo(x + hw, by); ctx.closePath();
      g = ctx.createLinearGradient(ax, ay, x + hw, by); g.addColorStop(0, '#7cc4ee'); g.addColorStop(1, '#3f86c9');
      ctx.fillStyle = g; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = Math.max(1, R * 0.025);
      ctx.beginPath(); ctx.moveTo(x - hw, by); ctx.lineTo(x - hw * 0.5, by - hh * 0.5); ctx.lineTo(ax - hw * 0.12, ay + hh * 0.12); ctx.lineTo(ax, ay); ctx.lineTo(ax + hw * 0.18, ay + hh * 0.3); ctx.lineTo(x + hw * 0.55, by - hh * 0.5); ctx.lineTo(x + hw, by); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(rx, by); ctx.stroke(); // the ridge between the faces
      ctx.fillStyle = 'rgba(255,255,255,.96)'; // snow on the tip
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax - hw * 0.3, ay + hh * 0.27); ctx.lineTo(ax - hw * 0.08, ay + hh * 0.2); ctx.lineTo(ax + hw * 0.1, ay + hh * 0.31); ctx.lineTo(ax + hw * 0.3, ay + hh * 0.28); ctx.closePath(); ctx.fill();
    }
    // the platform the mountain stands on, with Vulpix in front of it
    const g = ctx.createLinearGradient(-R, by, R, by + R * 0.3); g.addColorStop(0, '#e8f9ff'); g.addColorStop(0.6, '#9ad4f4'); g.addColorStop(1, '#5aa2dc');

    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = Math.max(1, R * 0.02);
    ctx.beginPath(); ctx.ellipse(0, by + R * 0.06, R * 0.7, R * 0.2, 0, 0, 7); ctx.stroke();
  });
}

// Gyarados's wave: a ring of surf running out from where it landed at the wave's speed, up to its radius.
function drawWave(f) {
  const r0 = 6, R = Math.min(f.r, r0 + waveCfg.speed * f.age), a = Math.max(0, 1 - Math.max(0, R - f.r * 0.6) / (f.r * 0.4 + 1e-6));
  ctx.save();
  const disc = ctx.createRadialGradient(f.x, f.y, Math.max(0, R * 0.6), f.x, f.y, R);
  disc.addColorStop(0, 'rgba(120,200,255,0)'); disc.addColorStop(1, `rgba(120,200,255,${0.28 * a})`);
  ctx.fillStyle = disc; ctx.beginPath(); ctx.arc(f.x, f.y, R, 0, 7); ctx.fill();
  ctx.lineCap = 'round';
  ctx.strokeStyle = `rgba(235,250,255,${0.9 * a})`; ctx.lineWidth = 7; // the crest, with foam on it
  ctx.beginPath(); ctx.arc(f.x, f.y, R, 0, 7); ctx.stroke();
  ctx.strokeStyle = `rgba(90,170,235,${0.7 * a})`; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(f.x, f.y, Math.max(0, R - 9), 0, 7); ctx.stroke();
  ctx.fillStyle = `rgba(255,255,255,${0.85 * a})`;
  for (let k = 0; k < 28; k++) { const ang = k * 0.2244 + seeded(k * 3.3) * 0.15, rr = R + (seeded(k * 7.1) - 0.5) * 8; ctx.beginPath(); ctx.arc(f.x + Math.cos(ang) * rr, f.y + Math.sin(ang) * rr, 2 + seeded(k) * 2.4, 0, 7); ctx.fill(); }
  ctx.restore();
}

// Gyarados's tail whip: the tail itself, a thick red limb that narrows to a fin, lashes across the fan from one edge to
// the other (cocked back a little first, then fast and slowing), bent behind its tip the way a whip is, with a smear
// of the sweep behind it. It pivots on Gyarados's middle; the body is drawn without its own tail meanwhile.
const TAIL_SWING = 0.3; // seconds the tail takes to lash across
// The tail itself, a thick red limb that narrows to a fan fin: from the pivot (x, y) out to `L`, pointing at angle `tip`, its
// middle bent towards angle `mid` the way a whip trails behind its tip. Returns where the fin is (and which way it points).
function drawTailLimb(x, y, L, tip, mid, alpha) {
  const thick = Math.max(8, radius[7] * 0.5);
  const pt = (t) => { // a point along the tail, t 0..1: a curve from the pivot
    const c1 = [x + Math.cos(mid) * L * 0.55, y + Math.sin(mid) * L * 0.55], p2 = [x + Math.cos(tip) * L * 0.97, y + Math.sin(tip) * L * 0.97];
    return [(1 - t) * (1 - t) * x + 2 * (1 - t) * t * c1[0] + t * t * p2[0], (1 - t) * (1 - t) * y + 2 * (1 - t) * t * c1[1] + t * t * p2[1]];
  };
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // the tail: sampled along its curve, drawn fat to thin, dark outline under red, with a pale belly line
  const N = 16, pts = []; for (let i = 0; i <= N; i++) pts.push(pt(i / N));
  const w = (i) => thick * (1 - 0.7 * i / N);
  ctx.globalAlpha = alpha;
  for (const [col, extra] of [['#5c1014', 5], ['#d22a2a', 0]]) {
    for (let i = 0; i < N; i++) { ctx.strokeStyle = col; ctx.lineWidth = w(i + 0.5) + extra; ctx.beginPath(); ctx.moveTo(pts[i][0], pts[i][1]); ctx.lineTo(pts[i + 1][0], pts[i + 1][1]); ctx.stroke(); }
  }
  ctx.strokeStyle = '#f3e3ba'; ctx.lineWidth = Math.max(2, thick * 0.22); ctx.beginPath(); // the pale underside
  pts.slice(0, N - 2).forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.stroke();
  const [tx, ty] = pts[N], [px, py] = pts[N - 2], ta = Math.atan2(ty - py, tx - px), fin = thick * 1.5; // the fin at its tip
  ctx.save(); ctx.translate(tx, ty); ctx.rotate(ta);
  ctx.fillStyle = '#9a1c22'; ctx.strokeStyle = '#5c1014'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-fin * 0.15, 0); // a fan of rays with a scallop between each
  for (let q = 0; q <= 4; q++) { const ang = -1 + q * 0.5; ctx.lineTo(Math.cos(ang) * fin * 1.05, Math.sin(ang) * fin * 1.05); if (q < 4) ctx.lineTo(Math.cos(ang + 0.25) * fin * 0.65, Math.sin(ang + 0.25) * fin * 0.65); }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#f0c23a'; ctx.lineWidth = 2.5; ctx.beginPath(); // gold ribs along the rays
  for (let q = 0; q <= 4; q++) { const ang = -1 + q * 0.5; ctx.moveTo(fin * 0.1, 0); ctx.lineTo(Math.cos(ang) * fin * 0.95, Math.sin(ang) * fin * 0.95); }
  ctx.stroke();
  ctx.restore();
  ctx.restore();
  return { tx, ty, ta, fin };
}

function drawTailWhip(f) {
  const k = Math.min(1, f.age / TAIL_SWING), fade = f.age <= TAIL_SWING ? 1 : Math.max(0, 1 - (f.age - TAIL_SWING) / 0.15);
  const half = tailCfg.angle / 2 * Math.PI / 180, base = Math.atan2(f.dy || 0, f.dx || 0), L = f.r; // a zero component is left out of the event, hence the || 0
  const cock = 0.12, from = base - half; // the first part of the swing winds back a little
  const s2 = k < cock ? 0 : (k - cock) / (1 - cock); // 0..1 over the lash itself
  const tip = k < cock ? from - half * 0.15 * Math.sin(Math.PI * k / cock) : from + 2 * half * (1 - Math.pow(1 - s2, 2.2)); // fast, then slow
  const mid = tip - 0.9 * (1 - s2) * (k < cock ? 0 : 1); // the middle of the tail trails behind the tip
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // where it can reach, and the smear the tail has left on the way
  ctx.fillStyle = `rgba(255,170,80,${0.12 * fade})`; ctx.strokeStyle = `rgba(255,220,150,${0.35 * fade})`; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.arc(f.x, f.y, L, base - half, base + half); ctx.closePath(); ctx.fill(); ctx.stroke();
  const sweep = ctx.createRadialGradient(f.x, f.y, L * 0.2, f.x, f.y, L);
  sweep.addColorStop(0, `rgba(255,230,190,0)`); sweep.addColorStop(1, `rgba(255,236,200,${0.45 * fade})`);
  ctx.fillStyle = sweep; ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.arc(f.x, f.y, L, from, Math.max(from, tip)); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = `rgba(255,250,230,${0.8 * fade})`; ctx.lineWidth = 5 * (1 - k) + 1; // the streak at the tip's end of the smear
  ctx.beginPath(); ctx.arc(f.x, f.y, L * 0.95, Math.max(from, tip - 0.7), Math.max(from, tip)); ctx.stroke();
  ctx.restore();
  const { tx, ty, ta, fin } = drawTailLimb(f.x, f.y, L, tip, mid, fade);
  ctx.save(); ctx.lineCap = 'round';
  // the crack of it: white flashes at the tip while it is going fast
  if (k > cock && k < 0.7) { ctx.strokeStyle = `rgba(255,255,255,${0.9 * (1 - k)})`; ctx.lineWidth = 2; for (let q = -1; q <= 1; q++) { ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(tx + Math.cos(ta + q * 0.9) * fin * 1.4, ty + Math.sin(ta + q * 0.9) * fin * 1.4); ctx.stroke(); } }
  ctx.restore();
}

// The tail whip winding up: the fan it will hit is drawn on the ground, where the opponent can see what to keep out of, filling
// with colour as the wind-up runs out; a ring runs out to the edge of it so the moment of the hit can be read, and the tail is
// cocked back at one side of the fan.
function drawTailWarning(p, d) {
  if (!(p.tlt > 0)) return;
  const k = 1 - p.tlt / Math.max(tailCfg.charge, 1e-6), half = tailCfg.angle / 2 * Math.PI / 180, base = Math.atan2(p.tly, p.tlx), L = tailCfg.length;
  const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 70);
  ctx.save(); ctx.lineCap = 'round';
  ctx.fillStyle = `rgba(255,70,40,${0.12 + 0.3 * k})`; ctx.strokeStyle = `rgba(255,${120 + 80 * pulse | 0},60,${0.5 + 0.4 * k})`; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.arc(d.x, d.y, L, base - half, base + half); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = `rgba(255,235,200,${0.35 + 0.4 * k})`; ctx.lineWidth = 2; // the ring that reaches the edge as it hits
  ctx.beginPath(); ctx.arc(d.x, d.y, L * k, base - half, base + half); ctx.stroke();
  ctx.restore();
  const from = base - half, tip = from - half * 0.15 - 0.05 * pulse; // cocked back past the first edge, trembling
  drawTailLimb(d.x, d.y, L * 0.9, tip, tip - 0.3, 0.95);

// Magikarp becomes Gyarados: a white flash that swells and drains away, with sparks flying out of it.
function drawEvolve(f) {
  const k = f.age / 0.9, a = 1 - k, R = f.r * (1.2 + 3 * k);
  ctx.save();
  const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, R);
  g.addColorStop(0, `rgba(255,255,255,${0.95 * a})`); g.addColorStop(0.5, `rgba(255,240,170,${0.5 * a})`); g.addColorStop(1, 'rgba(255,200,80,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(f.x, f.y, R, 0, 7); ctx.fill();
  ctx.strokeStyle = `rgba(255,255,255,${a})`; ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (let s = 0; s < 14; s++) { const ang = s * 0.449 + seeded(s) * 0.2, r1 = R * (0.4 + 0.5 * k), r2 = R * (0.7 + 0.5 * k); ctx.beginPath(); ctx.moveTo(f.x + Math.cos(ang) * r1, f.y + Math.sin(ang) * r1); ctx.lineTo(f.x + Math.cos(ang) * r2, f.y + Math.sin(ang) * r2); ctx.stroke(); }
  ctx.restore();
}

// A stunned player: little stars go round its head.
function drawStunned(p, top, bs) {
  const t = performance.now() / 1000;
  ctx.save(); ctx.fillStyle = '#ffe14d'; ctx.strokeStyle = '#a77d00'; ctx.lineWidth = 1;
  for (let k = 0; k < 3; k++) {
    const a = t * 5 + k * 2.094, sx = Math.cos(a) * 16 * bs, sy = top - 22 * bs + Math.sin(a) * 4 * bs;
    ctx.beginPath();
    for (let q = 0; q < 10; q++) { const rr = q % 2 ? 2.2 : 5, ang = q * Math.PI / 5 - Math.PI / 2; ctx[q ? 'lineTo' : 'moveTo'](sx + Math.cos(ang) * rr, sy + Math.sin(ang) * rr); }
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

// Thunder: a dark circle the size of the strike area sits where the bolt will land.
// It darkens and a ring closes in on it as the bolt gets near.
function drawShadow() {
  for (const i of [0, 1]) drawThunderShadow(snap.p[i], shadow[i]);
}
function drawThunderShadow(p, shadow) {
  if (p.k !== 0 || !(p.tn > 0)) { shadow.x = null; return; }
  if (shadow.x === null) { shadow.x = p.sx; shadow.y = p.sy; }
  shadow.x += (p.sx - shadow.x) * 0.4; shadow.y += (p.sy - shadow.y) * 0.4;
  const period = p.tn === thunderCfg.strikes ? thunderCfg.delay : thunderCfg.interval; // time the current wait started from
  const k = period > 0 ? Math.min(Math.max(1 - p.ti / period, 0), 1) : 1;               // 0 -> 1 as the bolt nears
  ctx.save();
  ctx.fillStyle = `rgba(10,10,40,${0.18 + 0.4 * k})`;
  ctx.beginPath(); ctx.arc(shadow.x, shadow.y, thunderCfg.radius, 0, 7); ctx.fill();
  ctx.strokeStyle = `rgba(255,235,90,${0.4 + 0.6 * k})`; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(shadow.x, shadow.y, thunderCfg.radius * (1 - 0.7 * k), 0, 7); ctx.stroke();
  ctx.restore();
}

// The ground-shock effect, used for Snorlax's landing and Charizard's slam. It shows the real reach (f.r, sent by the
// server) in a bright disc the moment it goes off, then a pair of shockwaves, cracks in the ground and flying dust. All circles are true
// circles because the hit test is a distance in the ground plane.
function drawQuake(f) {
  const R = f.r, k = f.age / QUAKE_LIFE, a = 1 - k;
  ctx.save();
  // the area that was hit
  const disc = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, R);
  disc.addColorStop(0, `rgba(255,170,40,${0.2 * a})`);
  disc.addColorStop(1, `rgba(255,110,20,${0.6 * a})`);
  ctx.fillStyle = disc; ctx.beginPath(); ctx.arc(f.x, f.y, R, 0, 7); ctx.fill();
  ctx.strokeStyle = `rgba(255,225,100,${a})`; ctx.lineWidth = 7; ctx.stroke();
  // cracks racing out from the centre
  ctx.strokeStyle = `rgba(45,25,10,${0.9 * a})`; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const grow = Math.min(1, k * 5);
  for (let i = 0; i < 10; i++) {
    const ang = i * 0.6283 + (i % 3) * 0.12, len = R * (0.55 + 0.4 * (((i * 37) % 10) / 10)) * grow;
    const dx = Math.cos(ang), dy = Math.sin(ang), j1 = (((i * 53) % 11) - 5) * 2.2, j2 = (((i * 29) % 11) - 5) * 2.2;
    ctx.beginPath(); ctx.moveTo(f.x, f.y);
    ctx.lineTo(f.x + dx * len * 0.35 - dy * j1, f.y + dy * len * 0.35 + dx * j1);
    ctx.lineTo(f.x + dx * len * 0.7 - dy * j2, f.y + dy * len * 0.7 + dx * j2);
    ctx.lineTo(f.x + dx * len, f.y + dy * len);
    ctx.stroke();
  }
  // two shockwaves, the second one a beat behind
  for (const [delay, w] of [[0, 14], [0.12, 8]]) {
    const kk = (k - delay) / 0.5;
    if (kk > 0 && kk < 1) {
      ctx.strokeStyle = `rgba(255,255,255,${0.95 * (1 - kk)})`; ctx.lineWidth = w * (1 - kk) + 1;
      ctx.beginPath(); ctx.arc(f.x, f.y, R * kk, 0, 7); ctx.stroke();
    }
  }
  // dust thrown outwards
  const out = 1 - (1 - k) * (1 - k);
  ctx.fillStyle = `rgba(165,135,100,${0.6 * a})`;
  for (let i = 0; i < 18; i++) {
    const ang = i * 0.349 + 0.2, dist = R * (0.45 + 0.5 * (((i * 17) % 10) / 10)) * out;
    ctx.beginPath(); ctx.arc(f.x + Math.cos(ang) * dist, f.y + Math.sin(ang) * dist - 10 * k * 6, 6 + 9 * k, 0, 7); ctx.fill();
  }
  ctx.restore();
}

// A jagged bolt from the top of the screen to the strike point, plus a flash on the ground.
// Drawn upright so it comes from the top of the screen in any view; sy is how far down the point is.
function drawBolt(f) {
  const k = f.age / 0.35, a = 1 - k, sy = screenY(f.x, f.y);
  upright(f.x, f.y, () => {
    ctx.fillStyle = `rgba(255,245,170,${0.55 * a})`;
    ctx.beginPath(); ctx.arc(0, 0, thunderCfg.radius, 0, 7); ctx.fill();
    const pts = [[(Math.random() - 0.5) * 24, -sy - 10]];
    for (let v = 30 - sy; v < 0; v += 38) pts.push([(Math.random() - 0.5) * 36, v]);
    pts.push([0, 0]);
    ctx.lineJoin = 'round';
    for (const [wd, col] of [[14, `rgba(255,225,70,${0.5 * a})`], [5, `rgba(255,255,255,${a})`]]) {
      ctx.strokeStyle = col; ctx.lineWidth = wd;
      ctx.beginPath(); pts.forEach(([x, y], n) => (n ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.stroke();
    }
  });
}

// Pikachu fires a bolt straight up into the sky for each strike: a jagged line from its position
// off the top of the screen, with a spark where it leaves.
function drawSkyBolt(f) {
  const k = f.age / 0.35, a = 1 - k, sy = screenY(f.x, f.y), top = -18;
  upright(f.x, f.y, () => {
    ctx.fillStyle = `rgba(255,245,170,${0.7 * a})`;
    ctx.beginPath(); ctx.arc(0, top, 26 * (0.6 + k), 0, 7); ctx.fill();
    const pts = [[0, top]];
    for (let v = top - 34; v > -sy - 10; v -= 34) pts.push([(Math.random() - 0.5) * 30, v]);
    pts.push([(Math.random() - 0.5) * 20, -sy - 10]);
    ctx.lineJoin = 'round';
    for (const [wd, col] of [[12, `rgba(255,225,70,${0.5 * a})`], [4, `rgba(255,255,255,${a})`]]) {
      ctx.strokeStyle = col; ctx.lineWidth = wd;
      ctx.beginPath(); pts.forEach(([x, y], n) => (n ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.stroke();
    }

}

// Chikorita's leaf: while a swing runs, a bright crescent cuts across the body. Swing 0, 2, ... go from the upper
// left to the lower right, swing 1, 3, ... from the upper right to the lower left. The blade reaches `radius`
// from the body on each side, which is the reach the server hits with.
// ---- Vulpix ----
const seeded = (n) => { const v = Math.sin(n * 127.1) * 43758.5453; return v - Math.floor(v); }; // a stable 0..1 from a number, so a patch looks the same every frame

// Frost Field: patches of ice on the ground. Cyan rim for the viewer's own frost (it speeds them up), violet for the other's (it slows).
// A patch grows in over a quarter of a second and fades out over its last second and a half.
function drawFrost() {
  for (const f of snap.f || []) {
    const age = frostCfg.duration - f.l, grow = Math.min(1, age / 0.25), a = Math.min(1, f.l / 1.5) * grow, R = (f.r || frostCfg.radius) * (0.5 + 0.5 * grow * (2 - grow));
    const mine = f.o === you, rim = mine ? '120,225,255' : '190,160,255', sd = f.x * 0.37 + f.y * 0.91;
    ctx.save();
    const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, R);
    g.addColorStop(0, `rgba(240,252,255,${0.8 * a})`); g.addColorStop(0.7, `rgba(165,222,250,${0.5 * a})`); g.addColorStop(1, `rgba(${rim},0)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(f.x, f.y, R, 0, 7); ctx.fill();
    ctx.strokeStyle = `rgba(${rim},${0.85 * a})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(f.x, f.y, R * 0.94, 0, 7); ctx.stroke();
    ctx.strokeStyle = `rgba(255,255,255,${0.8 * a})`; ctx.lineWidth = 1.5; ctx.beginPath(); // six crystal spokes with a fork on each
    for (let k = 0; k < 6; k++) {
      const ang = k * Math.PI / 3 + seeded(sd + k) * 0.3, len = R * (0.55 + 0.35 * seeded(sd + k * 3)), ex = f.x + Math.cos(ang) * len, ey = f.y + Math.sin(ang) * len;
      ctx.moveTo(f.x, f.y); ctx.lineTo(ex, ey);
      for (const sgn of [-1, 1]) { ctx.moveTo(f.x + Math.cos(ang) * len * 0.6, f.y + Math.sin(ang) * len * 0.6); ctx.lineTo(f.x + Math.cos(ang + sgn * 0.6) * len * 0.85, f.y + Math.sin(ang + sgn * 0.6) * len * 0.85); }
    }
    ctx.stroke();
    ctx.restore();
  }
}

// Ice Storm: a swirl of snow the size of the strike area that chases the opponent. Each strike (an event) rings out from it.
function drawStorms() {
  for (const si of slotsOf(4)) {
    const p = snap.p[si], sl = stormLook[si];
    if (!(p.wn > 0)) { sl.x = null; continue; }
    if (sl.x === null) { sl.x = p.wx; sl.y = p.wy; }
    sl.x += (p.wx - sl.x) * 0.4; sl.y += (p.wy - sl.y) * 0.4;
    const R = stormCfg.radius, t = performance.now() / 1000;
    ctx.save();
    const g = ctx.createRadialGradient(sl.x, sl.y, R * 0.1, sl.x, sl.y, R);
    g.addColorStop(0, 'rgba(235,248,255,.55)'); g.addColorStop(0.65, 'rgba(150,205,245,.35)'); g.addColorStop(1, 'rgba(110,170,235,.08)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sl.x, sl.y, R, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(210,240,255,.8)'; ctx.lineWidth = 2.5; ctx.setLineDash([14, 10]); ctx.lineDashOffset = -t * 40;
    ctx.beginPath(); ctx.arc(sl.x, sl.y, R, 0, 7); ctx.stroke(); ctx.setLineDash([]);
    ctx.lineWidth = 3; ctx.lineCap = 'round'; // three arms of wind turning round the middle
    for (let arm = 0; arm < 3; arm++) {
      ctx.strokeStyle = `rgba(255,255,255,${0.55 - arm * 0.08})`; ctx.beginPath();
      for (let u = 0; u <= 1.001; u += 0.05) { const ang = t * 2.6 + arm * 2.094 + u * 2.4, rr = R * (0.12 + 0.82 * u); u ? ctx.lineTo(sl.x + Math.cos(ang) * rr, sl.y + Math.sin(ang) * rr) : ctx.moveTo(sl.x + Math.cos(ang) * rr, sl.y + Math.sin(ang) * rr); }
      ctx.stroke();
    }
    ctx.fillStyle = '#fff'; // snowflakes blown round it
    for (let n = 0; n < 22; n++) {
      const ang = t * (1.4 + seeded(n) * 1.2) + n * 2.4, rr = R * (0.2 + 0.78 * ((seeded(n * 7) + t * 0.15) % 1)), s = 1.6 + seeded(n * 3) * 2;
      ctx.globalAlpha = 0.5 + 0.5 * seeded(n * 5); ctx.fillRect(sl.x + Math.cos(ang) * rr - s / 2, sl.y + Math.sin(ang) * rr - s / 2, s, s);
    }
    ctx.restore();
  }
}
// One strike of the storm: a white flash, a ring running out to the edge, shards flying out.
function drawStormStrike(f) {
  const k = f.age / 0.4, a = 1 - k, R = f.r || stormCfg.radius;

// Freeze Beam: from the mouth to the spot on the ground the stick steers. The beam hurts nobody; a faint circle shows how far it can reach.
function drawFBeams() {
  for (const si of slotsOf(4)) {
    const p = snap.p[si], d = disp[si], fl = fbLook[si];

}

// An ice pillar, drawn as a small iceberg: a wide jagged base with a tall peak and a lower one, light on the left faces and darker on

// (x in units of the pillar's radius, y in units of its height, up is negative)

    path(BERG); ctx.fill(); ctx.stroke();

    path([[0.24, -0.88], [0.52, -0.5], [0.9, -0.38], [1.05, 0], [0.3, 0]]); ctx.fill();
    ctx.fillStyle = `rgba(255,255,255,${0.7 * a})`; // snow on the peaks

    path([[0.2, -0.82], [0.24, -0.88], [0.36, -0.7], [0.26, -0.68]]); ctx.fill();

  });
}

// ---- Rowlet ----

// While Rowlet aims, one dashed line per arrow shows where the volley will go: it follows the opponent, and

// A tornado: a funnel that is narrow at the ground and wide at the top, rings turning round it and leaves carried

    ctx.save(); ctx.translate(lx, ly); ctx.rotate(a + Math.PI / 2 + t * 3 + k);

    const N = 14, top = [], bot = [];
    for (let i = 0; i <= N; i++) { const u = i / N, y = -u * H; top.push([lean(u) - w(u), y]); bot.push([lean(u) + w(u), y]); }
    const g = ctx.createLinearGradient(0, -H, 0, 0);
    g.addColorStop(0, `rgba(215,240,205,${held ? 0.5 : 0.38})`); g.addColorStop(1, `rgba(120,190,110,${held ? 0.6 : 0.5})`);

    ctx.beginPath(); bot.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.stroke();
    ctx.lineWidth = 2; ctx.setLineDash([16, 12]); // rings turning round it

    if (b.hp < tornadoCfg.hp) {
      ctx.fillStyle = '#000a'; ctx.fillRect(-16, -H - 14, 32, 4);
      ctx.fillStyle = '#9be37b'; ctx.fillRect(-16, -H - 14, 32 * Math.max(b.hp, 0) / tornadoCfg.hp, 4);
    }
  });
}

function drawLeafSlashes() { for (const si of slotsOf(3)) drawLeafSlash(snap.p[si], disp[si]); }
function drawLeafSlash(p, d) {
  if (p.lp !== 2) return;
  const R = leafCfg.radius, k = p.lk, sgn = p.ln % 2 === 0 ? 1 : -1, bs = radius[3] / REF[3];
  const P0 = [-sgn * 0.707 * R, -0.707 * R], P1 = [sgn * 0.707 * R, 0.707 * R];
  const dx = P1[0] - P0[0], dy = P1[1] - P0[1], len = Math.hypot(dx, dy), nx = -dy / len, ny = dx / len;
  const pos = (v) => [P0[0] + dx * v + nx * 0.22 * R * Math.sin(Math.PI * v), P0[1] + dy * v + ny * 0.22 * R * Math.sin(Math.PI * v)];
  const v0 = Math.max(0, k - 0.75), n = 16, W = 10 + 0.14 * R, alpha = 0.55 * (k > 0.88 ? (1 - k) / 0.12 : 1); // only an afterimage now: the leaf itself is the blade
  upright(d.x, d.y, () => {

    const A = [], B = [];
    for (let i = 0; i <= n; i++) {
      const v = v0 + (k - v0) * i / n, w = W * Math.pow(i / n, 0.9) * (1 - 0.25 * Math.abs(Math.sin(Math.PI * v))), [px, py] = pos(v);
      A.push([px + nx * w / 2, py + ny * w / 2]); B.push([px - nx * w / 2, py - ny * w / 2]);
    }

    gr.addColorStop(0, 'rgba(90,200,80,0)'); gr.addColorStop(0.6, `rgba(150,235,110,${0.55 * alpha})`); gr.addColorStop(1, `rgba(240,255,220,${0.95 * alpha})`);

    A.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
    B.reverse().forEach(([x, y]) => ctx.lineTo(x, y)); ctx.closePath(); ctx.fill();
    ctx.fillStyle = `rgba(255,255,255,${0.9 * alpha})`; ctx.beginPath(); ctx.arc(tx, ty, W * 0.28, 0, 7); ctx.fill();
  });
}
function drawLeafSpark(f) {
  const k = f.age / 0.35, a = 1 - k;
  upright(f.x, f.y, () => {
    ctx.strokeStyle = `rgba(190,255,150,${a})`; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    for (let i = 0; i < 7; i++) {

// Razor Leaf: a sharp leaf pointing the way it flies. While it hangs around Chikorita it turns slowly and bobs; a bar
// shows its HP once the opponent's skills have worn it down.
function drawRazorLeaf(b) {
  const r = razorCfg.radius * razorCfg.scale, t = performance.now() / 1000, ang = b.w ? t * 2 + b.x * 0.05 : Math.atan2(b.dy || 0, b.dx || 0);
  const bob = b.w ? Math.sin(t * 4 + b.y * 0.1) * 2 : 0, L = r * 2.3, Wd = r * 0.75;

  ctx.strokeStyle = '#2f8a3a'; ctx.beginPath(); ctx.moveTo(-L * 0.9, 0); ctx.lineTo(L * 0.9, 0); ctx.stroke();

// Vine Whip: two vines swing in from either side of the aim and meet on it. A vine lags behind its own swing,
// so it bends away from the aim until the two come together.
function drawVines() { for (const si of slotsOf(3)) drawVine(snap.p[si], disp[si]); }
function drawVine(p, d) {
  const charging = p.vc > 0, swinging = p.vt > 0, pulling = p.vr > 0;
  if (!charging && !swinging && !pulling) return;
  const [ax, ay] = rv(p.vx, p.vy), base = Math.atan2(ay, ax), L = vineCfg.len, bs = radius[3] / REF[3];
  // charging: the vines unfurl towards where they will start from, with a fan on the ground showing what they are about to sweep;
  // swinging: in from either side; pulling back: they shrink away along the aim
  const ck = charging ? 1 - p.vc / Math.max(vineCfg.charge, 1e-6) : 1, ease = 1 - (1 - ck) * (1 - ck);
  const deg = charging ? vineCfg.angle : swinging ? p.va : 0;
  const len = charging ? L * ease : pulling && !swinging ? L * Math.min(p.vr / Math.max(vineCfg.recharge, 1e-6), 1) : L;
  const alpha = charging ? 0.45 + 0.55 * ck : 1, t = performance.now() / 1000;

    ctx.translate(0, -d.z - 8 * bs);

      const A = vineCfg.angle * Math.PI / 180;
      ctx.fillStyle = `rgba(60,170,60,${0.07 + 0.12 * ck})`; ctx.strokeStyle = `rgba(90,210,90,${0.25 + 0.35 * ck})`; ctx.lineWidth = 2; ctx.setLineDash([8, 6]);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, L, base - A, base + A); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.setLineDash([]);
    }

      const a = base + side * deg * Math.PI / 180 + shake, ux = Math.cos(a), uy = Math.sin(a);
      const bend = side * 0.2 * len * (deg / vineCfg.angle), nx = -uy, ny = ux; // outward, away from the aim
      const cx = ux * len * 0.5 + nx * bend, cy = uy * len * 0.5 + ny * bend, ex = ux * len, ey = uy * len;
      const pts = [], n = 14;
      for (let i = 0; i <= n; i++) {
        const u = i / n, x = 2 * (1 - u) * u * cx + u * u * ex, y = 2 * (1 - u) * u * cy + u * u * ey;
        const tx = 2 * (1 - u) * cx + 2 * u * (ex - cx), ty = 2 * (1 - u) * cy + 2 * u * (ey - cy), tl = Math.hypot(tx, ty) || 1;
        pts.push([x, y, -ty / tl, tx / tl, vineCfg.w * 0.26]); // the same width from root to tip
      }
