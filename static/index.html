    if (p.k === 1 && p.slp > 0) drawSleepFx(p, top, hudTop, bs);
    if (p.sn > 0) { drawStunned(p, top, bs); ctx.font = 'bold 13px system-ui'; ctx.textAlign = 'center'; ctx.fillStyle = '#ffe14d'; ctx.fillText('被擊暈！', 0, hudTop - 54 * bs); }
    if (p.k === 6) { ctx.font = 'bold 12px system-ui'; ctx.textAlign = 'center'; ctx.fillStyle = '#ffd27a'; ctx.fillText(`進化 ${p.hn}/${evolveHops}`, 0, hudTop - 40 * bs); }
    if (p.k === 4 && p.zt > 0) { ctx.font = 'bold 13px system-ui'; ctx.textAlign = 'center'; ctx.fillStyle = '#a8e0ff'; ctx.fillText(`急凍光線 ${p.zt.toFixed(1)}s`, 0, hudTop - 54 * bs); }
    if (p.tw > 0) { ctx.font = 'bold 13px system-ui'; ctx.textAlign = 'center'; ctx.fillStyle = '#9be37b'; ctx.fillText(p.tw === 1 ? '被龍捲風捲走！' : '摔下來了！', 0, hudTop - 54 * bs); }
    else if (p.hd) { ctx.font = 'bold 13px system-ui'; ctx.textAlign = 'center'; ctx.fillStyle = '#ff8a5c'; ctx.fillText('被抓住！', 0, hudTop - 54 * bs); }
    if (p.sl > 0) { ctx.font = 'bold 12px system-ui'; ctx.textAlign = 'center'; ctx.fillStyle = '#b6e87a'; ctx.fillText(`緩速 ${p.sl.toFixed(1)}s`, 0, hudTop - 68 * bs); }
    if (i === you) { ctx.fillStyle = '#fff'; ctx.font = '12px system-ui'; ctx.textAlign = 'center'; ctx.fillText('▼ 你', 0, hudTop - 40 * bs); }
    else if (snap.p.length > 2 && sideOf(i) === sideOf(you)) { ctx.fillStyle = '#9ff0b8'; ctx.font = '12px system-ui'; ctx.textAlign = 'center'; ctx.fillText('▼ 隊友', 0, hudTop - 40 * bs); }
    if (p.k === DUMMY) { const took = maxHp[DUMMY] - p.hp; ctx.font = 'bold 14px system-ui'; ctx.textAlign = 'center'; ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.strokeStyle = '#fff'; ctx.strokeText(`已承受 ${took} 傷害`, 0, hudTop - 56 * bs); ctx.fillStyle = '#c1121f'; ctx.fillText(`已承受 ${took} 傷害`, 0, hudTop - 56 * bs); if (dummyHit.at > performance.now() - 900) { ctx.fillStyle = '#ff7a5c'; ctx.font = `bold ${20 + Math.min(dummyHit.n, 40) * 0.4}px system-ui`; ctx.fillText(`-${dummyHit.n}`, 0, hudTop - 74 * bs - (performance.now() - dummyHit.at) / 25); } }
    // HP bar follows the body.
    ctx.fillStyle = '#000a'; ctx.fillRect(-20, hudTop - 36 * bs, 40, 6);
    const full = (snap.mx && snap.mx[i]) || (isGmax(p) ? gmaxOf(p.k).hp : maxHp[p.k]); // a 1v2's person may have extra HP
    ctx.fillStyle = p.hp > 0.3 * full ? '#6fd36f' : '#e55'; ctx.fillRect(-20, hudTop - 36 * bs, 40 * Math.min(1, p.hp / full), 6);
    if (ultCfg[p.k] > 0) { // the ultimate's charge, a thin bar under the HP; it flashes once it is full
      const ch = Math.min(1, p.uc / ultCfg[p.k]);
      ctx.fillStyle = '#000a'; ctx.fillRect(-20, hudTop - 29 * bs, 40, 4);
      ctx.fillStyle = ch >= 1 ? (Math.floor(performance.now() / 200) % 2 ? '#fff6a8' : '#ffd21f') : '#e0b020'; ctx.fillRect(-20, hudTop - 29 * bs, 40 * ch, 4);
    }
  });
}

// Volt Tackles left: the running chain's, else all of them once the cooldown is over, else none.
const voltUses = (p) => (p.vn > 0 ? p.vn : p.dcd > 0 ? 0 : voltCfg.uses);

// Each button's dark pie is the share of its cooldown still to wait.
function drawCooldowns() {
  if (!snap) return;
  const gm = snap.p[you].k === 8 && snap.p[you].gmt > 0; // the Gigantamax Machamp's K is the Lightning Punch, with a cooldown of its own
  for (const c of cdBtns) {
    if (c.gmLabel && c.b.firstChild && c.b.firstChild.nodeType === 3) { const want = isGmax(snap.p[you]) ? c.gmLabel : c.label; if (c.b.firstChild.nodeValue !== want) c.b.firstChild.nodeValue = want; }
    const cgm = snap.p[you].k === 2 && snap.p[you].gmt > 0 && cgmaxCfg.cd[c.total] != null; // the Gigantamax Charizard's skills have cooldowns of their own
    const gg = snap.p[you].k === 9 && snap.p[you].gmt > 0; // the Gigantamax Gengar's Lick and Devour have cooldowns of their own
    const total = cgm ? cgmaxCfg.cd[c.total] : cdCfg[gm && c.total === 'mkick' ? 'glp' : gm && c.total === 'upper' ? 'gbp' : gg && c.total === 'gsneak' ? 'glick' : gg && c.total === 'sball' ? 'gdevour' : gg && c.total === 'gfire' ? 'ggfire' : c.total], left = snap.p[you][gm && c.field === 'kkcd' ? 'lpcd' : gm && c.field === 'ucd' ? 'bpcd' : gg && c.field === 'gncd' ? 'lkcd' : gg && c.field === 'sbcd' ? 'dvcd' : c.field];
    c.span.style.setProperty('--cd', (total > 0 ? Math.min(Math.max(left / total, 0), 1) * 360 : 0) + 'deg');
  }
  if (ultBtn) {
    const need = ultCfg[snap.p[you].k] || 1, ch = Math.min(Math.max(snap.p[you].uc / need, 0), 1);
    ultBtn.span.style.setProperty('--cd', (1 - ch) * 360 + 'deg');
    ultBtn.b.classList.toggle('ready', ch >= 1);
    ultBtn.pct.textContent = ch >= 1 ? 'Z' : Math.floor(ch * 100) + '%';
  }
  if (usesBadge) { const n = voltUses(snap.p[you]); usesBadge.textContent = '×' + n; usesBadge.classList.toggle('out', n === 0); }
}

// Team match: a row of tokens per side along the top, the opponent's above mine. A fallen character is
// crossed out, the one fighting is lit, and the ones still to come are my own letters and the opponent's "?".
function drawTeamHud() {
  const tm = snap.tm;
  if (!tm) return;
  ctx.save(); ctx.font = 'bold 17px system-ui'; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
  [1 - you, you].forEach((s, row) => {
    const y = 20 + row * 38;
    ctx.fillStyle = '#fffc'; ctx.textAlign = 'left'; ctx.fillText(s === you ? '你' : '對手', 8, y); ctx.textAlign = 'center';
    for (let n = 0; n < tm.n; n++) {
      const x = 82 + n * 38, fallen = n < tm.c[s], now = n === tm.c[s] && !tm.o;
      const k = fallen ? tm.f[s][n] : now ? snap.p[s].k : s === you ? +(myOrder[n] ?? -1) : -1;
      ctx.beginPath(); ctx.arc(x, y, 15, 0, 7);
      ctx.fillStyle = fallen ? '#555' : now ? '#f7cf3a' : '#2b3340'; ctx.fill();
      ctx.strokeStyle = now ? '#fff' : '#889'; ctx.lineWidth = now ? 2.5 : 1; ctx.stroke();
      ctx.fillStyle = now ? '#222' : fallen ? '#999' : '#dde'; ctx.fillText(k >= 0 ? NAMES[k][0] : '?', x, y + 1);
      if (fallen) { ctx.strokeStyle = '#e44'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x - 11, y - 11); ctx.lineTo(x + 11, y + 11); ctx.moveTo(x + 11, y - 11); ctx.lineTo(x - 11, y + 11); ctx.stroke(); }
    }
  });
  ctx.restore();
}

// The banner when a bout or the match ends.
function drawResult() {
  if (snap.w < 0) return;
  const tm = snap.tm, final = !tm || tm.o, me = snap.p[you], op = snap.p[1 - you];
  const text = final ? ((tm ? tm.mw : snap.w) === sideOf(you) ? '你贏了！' : '你輸了')
    : me.hp <= 0 && op.hp <= 0 ? '同時倒下！雙方換下一隻' : me.hp <= 0 ? `${FORMS[me.k]}倒下了，換下一隻` : `打倒對手的${FORMS[op.k]}！`;
  ctx.fillStyle = '#000a'; ctx.fillRect(0, cv.height / 2 - 50, cv.width, 100);
  ctx.fillStyle = '#fff'; ctx.font = (final ? 40 : 28) + 'px system-ui'; ctx.textAlign = 'center';
  ctx.fillText(text, cv.width / 2, cv.height / 2 + 12);
}

// The battlefield is a sandy island in a shallow sea. The sea, shallows, beach, speckles, rocks and the palm are painted once into an
// offscreen bitmap (half resolution: it is all soft) and blitted every frame; the court markings are drawn live so they stay crisp.
// The coast lies COAST units outside the walls, so every spot a fighter can stand on is sand.
const COAST = 70, SEA_SCALE = 0.5;
const seaPad = () => cam.margin + 300; // painted a little past what the camera can reach
let seaArt = null, seaKey = '';

function seededRandom(seed) { // mulberry32: both players paint the same island
  return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

// The shore: a rounded rectangle `grow` units outside the walls, pushed further out by a slow wobble (never inwards, so the corners stay sand).
// Returns points {x, y, nx, ny} (nx, ny the outward normal).
function coastline(grow, wob) {
  const x0 = -grow, y0 = -grow, w = arena.w + 2 * grow, h = arena.h + 2 * grow, r = Math.min(220, grow * 3.2), N = 360;
  const sw = w - 2 * r, sh = h - 2 * r, arc = Math.PI * r / 2, per = 2 * sw + 2 * sh + 4 * arc, out = [];
  for (let i = 0; i < N; i++) {
    let s = i / N * per, x, y, nx, ny;
    if (s < sw) { x = x0 + r + s; y = y0; nx = 0; ny = -1; }
    else if ((s -= sw) < arc) { const a = -Math.PI / 2 + s / r; nx = Math.cos(a); ny = Math.sin(a); x = x0 + w - r + nx * r; y = y0 + r + ny * r; }
    else if ((s -= arc) < sh) { x = x0 + w; y = y0 + r + s; nx = 1; ny = 0; }
    else if ((s -= sh) < arc) { const a = s / r; nx = Math.cos(a); ny = Math.sin(a); x = x0 + w - r + nx * r; y = y0 + h - r + ny * r; }
    else if ((s -= arc) < sw) { x = x0 + w - r - s; y = y0 + h; nx = 0; ny = 1; }
    else if ((s -= sw) < arc) { const a = Math.PI / 2 + s / r; nx = Math.cos(a); ny = Math.sin(a); x = x0 + r + nx * r; y = y0 + h - r + ny * r; }
    else if ((s -= arc) < sh) { x = x0; y = y0 + h - r - s; nx = -1; ny = 0; }
    else { s -= sh; const a = Math.PI + s / r; nx = Math.cos(a); ny = Math.sin(a); x = x0 + r + nx * r; y = y0 + r + ny * r; }
    const u = i / N * Math.PI * 2, d = wob * (0.5 + 0.28 * Math.sin(u * 3 + 1) + 0.14 * Math.sin(u * 7 + 2) + 0.08 * Math.sin(u * 13 + 4));
    out.push({ x: x + nx * d, y: y + ny * d, nx, ny });
  }
  return out;
}

function tracePath(c, pts) { c.beginPath(); pts.forEach((p, i) => (i ? c.lineTo(p.x, p.y) : c.moveTo(p.x, p.y))); c.closePath(); }

function paintRock(c, x, y, r, rnd) {
  c.fillStyle = 'rgba(10,60,90,.28)'; c.beginPath(); c.ellipse(x + r * 0.2, y + r * 0.35, r * 1.25, r * 0.8, 0, 0, 7); c.fill(); // the shadow in the water
  c.fillStyle = '#4b5057'; c.beginPath(); c.ellipse(x, y, r, r * 0.78, rnd() * 3, 0, 7); c.fill();
  c.fillStyle = '#6d747c'; c.beginPath(); c.ellipse(x - r * 0.2, y - r * 0.22, r * 0.6, r * 0.42, 0, 0, 7); c.fill();
  c.fillStyle = 'rgba(255,255,255,.22)'; c.beginPath(); c.ellipse(x - r * 0.3, y - r * 0.35, r * 0.25, r * 0.15, 0, 0, 7); c.fill();
}

// A palm on the beach leaning out over the water (n is the outward normal of the shore there), so it never stands over the court:
// a tapering ringed trunk, a crown of drooping fronds (a midrib with leaflets down both sides) and a bunch of coconuts.
function paintPalm(c, x, y, nx, ny, rnd) {
  const tx = -ny, ty = nx, lean = rnd() < 0.5 ? 1 : -1, H = 150;
  const ex = x + nx * H + tx * 26 * lean, ey = y + ny * H + ty * 26 * lean, kx = x + nx * H * 0.5 + tx * 46 * lean, ky = y + ny * H * 0.5 + ty * 46 * lean; // the trunk's end and bend
  const at = (t) => ({ x: (1 - t) * (1 - t) * x + 2 * (1 - t) * t * kx + t * t * ex, y: (1 - t) * (1 - t) * y + 2 * (1 - t) * t * ky + t * t * ey });
  c.save(); c.lineCap = 'round';
  c.fillStyle = 'rgba(10,50,80,.25)'; c.beginPath(); c.ellipse((x + ex) / 2 + 26, (y + ey) / 2 + 30, 96, 34, 0, 0, 7); c.fill(); // its shadow on the water and sand
  const seg = 14; // trunk: short slanted pieces, dark at the edges, getting thinner towards the top
  for (let i = 0; i < seg; i++) {
    const a = at(i / seg), b = at((i + 1) / seg), w = 21 - 10 * (i / seg);
    c.strokeStyle = i % 2 ? '#6b4a2b' : '#7d5934'; c.lineWidth = w; c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke();
    c.strokeStyle = 'rgba(40,22,8,.55)'; c.lineWidth = 2; c.beginPath(); c.moveTo(a.x - tx * w * 0.5, a.y - ty * w * 0.5); c.lineTo(a.x + tx * w * 0.5, a.y + ty * w * 0.5); c.stroke(); // the growth ring
    c.strokeStyle = 'rgba(255,220,160,.28)'; c.lineWidth = w * 0.22; c.beginPath(); c.moveTo(a.x - 3, a.y - 3); c.lineTo(b.x - 3, b.y - 3); c.stroke(); // the lit side
  }
  const FR = 11; // fronds, the far ones first so the near ones overlap them
  for (let i = 0; i < FR; i++) {
    const ang = i / FR * Math.PI * 2 + rnd() * 0.25 + 0.2, dx = Math.cos(ang), dy = Math.sin(ang), L = 98 + rnd() * 26;
    const mx = ex + dx * L * 0.55, my = ey + dy * L * 0.55 * 0.8 - 22, fx = ex + dx * L, fy = ey + dy * L * 0.8 + 30; // the midrib arches up, then droops
    const rib = (t) => ({ x: (1 - t) * (1 - t) * ex + 2 * (1 - t) * t * mx + t * t * fx, y: (1 - t) * (1 - t) * ey + 2 * (1 - t) * t * my + t * t * fy });
    const dark = i % 2 ? '#2a7035' : '#348341', light = i % 2 ? '#3f9a4a' : '#4aad55';
    for (let k = 1; k <= 15; k++) { // leaflets, longest in the middle of the frond
      const t = k / 15, p = rib(t), q = rib(Math.min(1, t + 0.04)), rx = q.x - p.x, ry = q.y - p.y, rl = Math.hypot(rx, ry) || 1;
      const ux = rx / rl, uy = ry / rl, len = 30 * Math.sin(Math.PI * (0.15 + 0.8 * t)) + 4;
      for (const side of [-1, 1]) {
        const lx = -uy * side, ly = ux * side, ox = p.x + (lx * 0.8 + ux * 0.7) * len, oy = p.y + (ly * 0.8 + uy * 0.7) * len + len * 0.35; // swept forward and hanging
        c.strokeStyle = side > 0 ? dark : light; c.lineWidth = 6.5 - 3.5 * t; c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(ox, oy); c.stroke();
      }
    }
    c.strokeStyle = '#2d6a30'; c.lineWidth = 4.5; c.beginPath(); c.moveTo(ex, ey); c.quadraticCurveTo(mx, my, fx, fy); c.stroke(); // the midrib
  }
  for (const [ox, oy, r] of [[-9, 8, 10], [8, 10, 10.5], [0, 20, 9.5]]) { // the coconuts
    c.fillStyle = '#4a3220'; c.beginPath(); c.arc(ex + ox, ey + oy, r, 0, 7); c.fill();
    c.fillStyle = '#6e4d30'; c.beginPath(); c.arc(ex + ox - 2.5, ey + oy - 3, r * 0.55, 0, 7); c.fill();
    c.fillStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.arc(ex + ox - 4, ey + oy - 5, r * 0.2, 0, 7); c.fill();
  }
  c.restore();
}

function buildSea() {
  const rnd = seededRandom(arena.w * 31 + arena.h), SEA_PAD = seaPad(), W = arena.w + 2 * SEA_PAD, H = arena.h + 2 * SEA_PAD;
  const bmp = document.createElement('canvas'); bmp.width = Math.ceil(W * SEA_SCALE); bmp.height = Math.ceil(H * SEA_SCALE);
  const c = bmp.getContext('2d'); c.scale(SEA_SCALE, SEA_SCALE); c.translate(SEA_PAD, SEA_PAD);
  c.lineJoin = 'round'; c.lineCap = 'round';
  const g = c.createLinearGradient(0, -SEA_PAD, 0, arena.h + SEA_PAD); g.addColorStop(0, '#1b79b4'); g.addColorStop(1, '#1d86be');
  c.fillStyle = g; c.fillRect(-SEA_PAD, -SEA_PAD, W, H); // the open sea
  const shore = coastline(COAST, 34);
  // the shallows: wide translucent turquoise bands around the coast, the widest and darkest outermost
  [[420, 'rgba(46,190,205,.20)'], [300, 'rgba(60,205,215,.22)'], [190, 'rgba(95,222,225,.28)'], [100, 'rgba(150,236,232,.38)'], [44, 'rgba(215,248,240,.55)']].forEach(([lw, col]) => { c.strokeStyle = col; c.lineWidth = lw; tracePath(c, shore); c.stroke(); });
  for (let i = 0; i < 90; i++) { // ripples
    const x = -SEA_PAD + rnd() * W, y = -SEA_PAD + rnd() * H, l = 30 + rnd() * 50;
    c.strokeStyle = 'rgba(255,255,255,.10)'; c.lineWidth = 3; c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + l / 2, y - 6, x + l, y); c.stroke();
  }
  for (let i = 0; i < shore.length; i += 3) { // wave crests rolling in: short white arcs along the coast, one row per band of the shallows
    for (const d of [90, 170, 250]) {
      if (rnd() < 0.45) continue;
      const p = shore[i], l = 40 + rnd() * 50, ox = p.x + p.nx * (d + rnd() * 30), oy = p.y + p.ny * (d + rnd() * 30), tx = -p.ny * l, ty = p.nx * l;
      c.strokeStyle = 'rgba(255,255,255,' + (0.22 + rnd() * 0.18) + ')'; c.lineWidth = 3 + rnd() * 3;
      c.beginPath(); c.moveTo(ox - tx, oy - ty); c.quadraticCurveTo(ox + p.nx * 14, oy + p.ny * 14, ox + tx, oy + ty); c.stroke();
    }
  }
  // the beach: wet sand at the waterline, then dry sand, then the sea's foam line on top
  c.fillStyle = '#d9c28c'; tracePath(c, shore); c.fill();
  c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 9; c.stroke();
  const dry = coastline(COAST - 22, 24); c.fillStyle = '#ecdcab'; tracePath(c, dry); c.fill();
  c.save(); tracePath(c, dry); c.clip();
  for (let i = 0; i < 40; i++) { // darker and lighter patches of sand
    const x = rnd() * arena.w, y = rnd() * arena.h, r = 120 + rnd() * 220, gr = c.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, rnd() < 0.5 ? 'rgba(200,170,110,.20)' : 'rgba(255,248,225,.28)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = gr; c.fillRect(x - r, y - r, 2 * r, 2 * r);
  }
  const specks = Math.round(arena.w * arena.h / 700);
  for (let i = 0; i < specks; i++) { // grains
    c.fillStyle = rnd() < 0.6 ? 'rgba(150,120,70,.30)' : 'rgba(255,255,255,.45)';
    const s = 1.5 + rnd() * 2.5; c.fillRect(-COAST + rnd() * (arena.w + 2 * COAST), -COAST + rnd() * (arena.h + 2 * COAST), s, s);
  }
  for (let i = 0; i < 26; i++) { // a few shells and pebbles
    const x = -COAST + rnd() * (arena.w + 2 * COAST), y = -COAST + rnd() * (arena.h + 2 * COAST);
    c.fillStyle = rnd() < 0.5 ? '#f6e9ee' : '#c9a98a'; c.beginPath(); c.ellipse(x, y, 5 + rnd() * 4, 3.5 + rnd() * 3, rnd() * 3, 0, 7); c.fill();
  }
  c.restore();
  // rocks standing in the water (never on the sand, so nothing there is mistaken for an obstacle) and the palm on the shore
  for (let i = 0; i < shore.length; i += 7) {
    if (rnd() < 0.45) continue;
    const p = shore[i], d = 60 + rnd() * 200, n = 1 + Math.floor(rnd() * 3);
    for (let k = 0; k < n; k++) paintRock(c, p.x + p.nx * d + (rnd() - 0.5) * 70, p.y + p.ny * d + (rnd() - 0.5) * 70, 14 + rnd() * 24, rnd);
  }
  for (const f of [0.03, 0.2, 0.37, 0.55, 0.72, 0.9]) { const p = shore[Math.floor(shore.length * f)]; paintPalm(c, p.x - p.nx * 25, p.y - p.ny * 25, p.nx, p.ny, rnd); }
  seaArt = bmp; seaKey = arena.w + 'x' + arena.h + 'x' + cam.margin;
}

// The island with its court markings: a dotted circle, the halfway line and circle, and a small circle in front of each side's start.
function drawIsland() {
  if (seaKey !== arena.w + 'x' + arena.h + 'x' + cam.margin) buildSea();
  const pad = seaPad();
  ctx.drawImage(seaArt, -pad, -pad, arena.w + 2 * pad, arena.h + 2 * pad);
  const w = arena.w, h = arena.h, cx = w / 2, cy = h / 2;
  ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.setLineDash([1, 17]);
  ctx.beginPath(); ctx.arc(cx, cy, Math.min(w, h) * 0.42, 0, 7); ctx.stroke(); // the big circle
  ctx.beginPath(); ctx.moveTo(cx, h * 0.04); ctx.lineTo(cx, h * 0.96); ctx.stroke(); // the halfway line
  ctx.beginPath(); ctx.arc(cx, cy, Math.min(w, h) * 0.12, 0, 7); ctx.stroke(); // the centre circle
  for (const sx of [0.2, 0.8]) for (const sy of [0.26, 0.74]) { ctx.beginPath(); ctx.arc(w * sx, h * sy, Math.min(w, h) * 0.05, 0, 7); ctx.stroke(); }
  ctx.setLineDash([]); ctx.strokeStyle = 'rgba(120,90,50,.35)'; ctx.lineWidth = 4; ctx.strokeRect(0, 0, w, h); // the walls, a faint line in the sand
  ctx.restore();
}

// While a Thousand Volt is on (its gathering, then its bolts out) the sky goes dark, and the screen flashes white and black once for each explosion; while a
// Thunder is on (from the cast until the last strike) the sky goes dark and the screen flashes once for each strike that lands. For everyone watching.
// Ash's Megaton Punch makes the sky dark from the start of its gathering, and the screen flashes all through the second half of it (the ball).
// All use pikachu.thousand_volt's sky_dark, flash_every and flash_alpha.
let skyK = 0, flashT = 0, ballFrames = 0; // flashT: frames left of the flash an explosion or a Thunder strike set off; ballFrames: how long the ball of a Megaton Punch has flashed
const calm = matchMedia('(prefers-reduced-motion: reduce)'); // whoever asks the system for less motion gets the dark sky and no flashing
function drawStormSky(dt) {
  const on = snap.p.some((p, i) => p.k === 0 && (p.uct > 0 || (snap.b || []).some((b) => b.k === 11 && b.sd === i + 1))) || snap.p.some((p) => p.k === 0 && p.tn > 0) || snap.p.some((p) => p.k === 7 && p.mgt > 0);
  const ball = snap.p.some((p) => p.k === 7 && p.mgt > 0 && p.mgt <= megaCfg.charge - megaCfg.ring); // the ball of a Megaton Punch is swelling
  skyK = Math.min(1, Math.max(0, skyK + (on ? 1 : -1) * dt / 0.4)); // fades over 0.4 s
  const N = tvoltCfg.fevery, bn = megaCfg.fevery; // the frames a flash lasts: for the explosions and strikes, and for the ball of a Megaton Punch
  if (skyK <= 0 && !(flashT > 0) && !ball) return;
  ctx.fillStyle = `rgba(8,12,34,${tvoltCfg.dark * skyK})`; ctx.fillRect(0, 0, cv.width, cv.height);
  if (calm.matches) { flashT = ballFrames = 0; return; }
  let s = -1; // white, clear, black, clear
  if (ball && bn > 0) s = Math.floor(ballFrames++ / bn) % 4;
  else if (!ball && flashT > 0 && N > 0) s = Math.floor((4 * N - flashT--) / N) % 4;
  if (!ball) ballFrames = 0;
  if (!(N > 0)) flashT = 0;
  if (s === 0 || s === 2) { ctx.fillStyle = s === 0 ? `rgba(255,255,255,${tvoltCfg.falpha})` : `rgba(0,0,0,${tvoltCfg.falpha})`; ctx.fillRect(0, 0, cv.width, cv.height); }
}

let lastFrame = performance.now();
function frame() {
  const now = performance.now(), dt = Math.min(0.1, (now - lastFrame) / 1000); lastFrame = now;
  drawCooldowns();
  drawCards();
  updateCamera(dt);
  ctx.save();
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (shake > 0) { ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake); shake *= 0.85; if (shake < .5) shake = 0; }

  if (snap) {
    ctx.fillStyle = '#1c80b9'; ctx.fillRect(0, 0, cv.width, cv.height); // the open sea, past the painted part
    ctx.save();
    ctx.transform(...VIEW); // from here on, coordinates are the world's
    drawIsland();
    for (const g of ghosts) { drawBody(g.k, g.x, g.y, Math.max(g.a, 0), g.z, 0, g.pose); g.a -= 0.04; }
    while (ghosts.length && ghosts[0].a <= 0) ghosts.shift();
    drawTelegraph();
    drawArrowAims();
    drawTornadoWarnings();
    drawFrost();
    drawFireZones();
    drawSneakShadows();
    drawDevour();
    drawShadow();
    drawStorms();
    drawBalls();
    drawGhostFires();
    drawShadowBalls();
    drawIcicles();
    drawSilenced();
    drawToss();
    drawInfernoSummon();
    drawGmaxCharge();
    drawIcePunch();
    drawBeams();
    drawSmoke(); // under the players, so the labels and HP bars stay readable
    // Draw lower players first so the one nearer the camera overlaps correctly.
    [...snap.p.keys()].filter((i) => !fallen(i)).sort((a, b) => screenY(snap.p[a].x, snap.p[a].y) - screenY(snap.p[b].x, snap.p[b].y)).forEach((i) => drawPlayer(i, snap.p[i]));
    drawLeafSlashes(); // over the bodies: the blade is the thing to see
    for (const si of slotsOf(10)) drawSlapPalm(snap.p[si], disp[si]);
    drawVines();
    drawFBeams();
    drawVolt();
    fx = fx.filter((f) => (f.age += 1 / 60) < (f.t === 'slam' ? QUAKE_LIFE : f.t === 'explode' || f.t === 'voltburst' || f.t === 'ult' || f.t === 'bbboom' ? 0.5 : f.t === 'infboom' ? 0.7 : f.t === 'infpop' ? 0.45 : f.t === 'freeze' || f.t === 'iceburst' ? 0.6 : f.t === 'wave' ? waveCfg.radius / waveCfg.speed + 0.35 : f.t === 'tail' ? TAIL_SWING + 0.15 : f.t === 'tree' || f.t === 'gslam' ? 0.6 : f.t === 'lickhit' ? 0.35 : f.t === 'bite' ? Math.max(0.4, ggmaxCfg.lbite + 0.25) : f.t === 'mega' ? Math.max(0.5, megaCfg.fwdur) : f.t === 'megahit' ? Math.max(0.65, megaCfg.htdur) : f.t === 'kickhit' || f.t === 'uphit' ? 0.6 : f.t === 'gmax' || f.t === 'gmaxend' ? 0.9 : f.t === 'quake' ? (f.l || 3) + 0.5 : f.t === 'bpunch' ? 0.7 + (f.l || 0) : f.t === 'bpboom' ? 0.45 : f.t === 'lpunch' ? 0.45 : f.t === 'lpbolt' ? 0.8 : f.t === 'gwell' ? gengarCfg.pull : f.t === 'glacast' ? glaCfg.dur + glaCfg.fall + 0.3 : f.t === 'glaslam' ? 0.45 : f.t === 'bbwell' ? bbCfg.pull : f.t === 'evolve' ? 0.9 : f.t === 'gvplant' ? 0.7 : f.t === 'gvrise' || f.t === 'gvslam' ? 0.5 : f.t === 'storm' ? 0.4 : 0.35));
    for (const f of fx) {
      if (f.t === 'thunder') drawBolt(f);
      else if (f.t === 'skybolt') drawSkyBolt(f);
      else if (f.t === 'explode') drawExplosion({ ...f, r: f.r * ballCfg.scale }); // the Electro Ball's blast, drawn at `scale` times its reach
      else if (f.t === 'voltburst' || f.t === 'bbboom') drawExplosion(f);
      else if (f.t === 'infboom' || f.t === 'infpop') drawInfernoBoom(f);
      else if (f.t === 'ult') drawUltRing(f);
      else if (f.t === 'airhit') drawAirHit(f);
      else if (f.t === 'freeze') drawFreezeBurst(f);
      else if (f.t === 'iceburst') drawIceBurst(f);
      else if (f.t === 'wave') drawWave(f);
      else if (f.t === 'tail') drawTailWhip(f);
      else if (f.t === 'tree') drawTreeSlam(f);
      else if (f.t === 'mega') drawMegaFist(f);
      else if (f.t === 'megahit') drawMegaImpact(f);
      else if (f.t === 'kickhit') drawKickImpact(f);
      else if (f.t === 'uphit') drawUpperHit(f);
      else if (f.t === 'gmax' || f.t === 'gmaxend') drawGmaxBurst(f);
      else if (f.t === 'quake') drawEarthquake(f);
      else if (f.t === 'bpunch') drawBurstFist(f);
      else if (f.t === 'bpboom') drawBurstBoom(f);
      else if (f.t === 'lpunch') drawLightningFist(f);
      else if (f.t === 'lpbolt') drawLightningBolt(f);
      else if (f.t === 'gslam') drawGhostSlam(f);
      else if (f.t === 'lickhit') drawLickHit(f);
      else if (f.t === 'bite') drawBiteFx(f);
      else if (f.t === 'glacast') drawGlaciateArea(f);
      else if (f.t === 'glaslam') drawIcicleBurst(f);
      else if (f.t === 'gwell' || f.t === 'bbwell') drawPullWell(f);
      else if (f.t === 'evolve') drawEvolve(f);
      else if (f.t === 'gvplant') drawGvRing(f);
      else if (f.t === 'gvrise') drawGvSpikes(f, 0);
      else if (f.t === 'gvslam') drawGvSpikes(f, 1);
      else if (f.t === 'gvcast') { /* only the dirt (gvBurst) */ }
      else if (f.t === 'storm') drawStormStrike(f);
      else if (f.t === 'paralyze') drawParalyzeBurst(f);
      else if (f.t === 'leaf') drawLeafSpark(f);
      else if (f.t === 'sleep' || f.t === 'wake') { /* drawn from the player's own state (drawSleepFx) */ }
      else if (f.t === 'lick' || f.t === 'devour') { /* drawn from the player's own state (drawLick, drawDevour), not from the event */ }
      else if (f.t === 'slam' || f.t === 'stomp' || f.t === 'rollkick') drawQuake(f); // 'slam' (events with no picture and no reach, such as Jigglypuff's 'bounce', must not fall in here: no radius makes the gradient throw)
    }
    ctx.restore();
    drawStormSky(dt);
    drawBirdSky(dt);
    drawTeamHud();
    drawResult();
  }
  ctx.restore();
  document.getElementById('exitdummy').style.display = PLAY === 'dummy' && snap ? 'block' : 'none';
  document.getElementById('repick').style.display = snap && snap.w >= 0 && (!snap.tm || snap.tm.o) ? 'block' : 'none';

  bar.innerHTML = waiting ? '等待對手加入… 有人上線就會自動配對<br>（電腦橫式版：在網址後面加上 ?landscape）' : status === '連線中…' ? '' : status;
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
